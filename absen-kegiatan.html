<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"/>
<title>Absen Kegiatan UBNB</title>
<style>
:root{
  --green:#1a6640;--green-dark:#0f4428;--green-light:#e8f5ee;
  --gold:#c9a84c;--gold-light:#fdf6e3;--red:#dc2626;--red-light:#fee2e2;
  --blue:#3b82f6;--blue-light:#dbeafe;--border:#e0d8cc;--text:#1c1a16;--muted:#8a8078;
}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,var(--green-dark),var(--green));min-height:100vh;padding:14px;color:var(--text)}
.wrap{background:#fff;border-radius:18px;max-width:480px;margin:0 auto;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.25)}
.head{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;padding:34px 18px;text-align:center}
.icon{width:70px;height:70px;background:var(--gold-light);border:2px solid var(--gold);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:36px}
.head h1{margin:0;font-size:22px}.head .sub{opacity:.9;margin-top:6px}
.body{padding:22px 18px}.foot{text-align:center;padding:16px;border-top:1px solid #eee;color:var(--muted)}
.msg{padding:13px;border-radius:10px;text-align:center;margin-bottom:14px;font-size:14px}
.msg.err{background:var(--red-light);color:var(--red)}.msg.info{background:var(--blue-light);color:#1e40af}.msg.ok{background:#dcfce7;color:#166534}
.kgt{background:var(--green-light);border-radius:10px;padding:13px;margin-bottom:14px}.kgt .nm{font-size:18px;font-weight:800;color:var(--green-dark)}.meta{font-size:12px;color:var(--muted);margin-top:4px}
.gps{background:#fef3c7;color:#78350f;border:1px solid #f59e0b;border-radius:9px;padding:10px;text-align:center;font-size:12px;margin-bottom:14px}
label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:5px}
.ac-selected{display:none;background:var(--green-light);border:1px solid var(--green);padding:10px;border-radius:8px;font-weight:700;color:var(--green-dark);margin-bottom:8px}
.display{height:48px;border:1.5px solid var(--border);border-radius:8px;padding:13px;font-size:15px;overflow:hidden;white-space:nowrap;margin-bottom:7px}
.hint{text-align:center;font-size:10px;color:var(--muted);min-height:14px}
.vkb{background:#e8ecf0;border-radius:10px;padding:8px 4px 10px;margin-top:10px}
.row{display:flex;justify-content:center;gap:4px;margin-bottom:5px}
.key{height:42px;min-width:30px;flex:1;max-width:38px;border:0;border-radius:6px;background:#fff;font-weight:700;font-size:15px;box-shadow:0 2px 0 #b0b8c4}
.key.space{max-width:none;flex:4}.key.back{max-width:52px;background:#f1c0c0}.key.accept{max-width:none;flex:3;background:var(--green);color:#fff}
.btn{width:100%;padding:13px;border:0;border-radius:8px;background:var(--green);color:#fff;font-size:14px;font-weight:700;margin-top:12px}.btn:disabled{opacity:.55}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="icon">✅</div>
    <h1>Absen Kegiatan</h1>
    <div class="sub">UBNB Desa Perwira</div>
  </div>
  <div class="body" id="body"><div class="msg info">Memuat data kegiatan...</div></div>
  <div class="foot">© 2026 UBNB Desa Perwira</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SURL='https://skltbmcrqutevmtcxqxj.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrbHRibWNycXV0ZXZtdGN4cXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzM5ODIsImV4cCI6MjA5MTI0OTk4Mn0._nogUZg5UylVyP45QTGYw69u76pNxGryj9hZORIfE_A';
const sb=supabase.createClient(SURL,SKEY);
const token=new URLSearchParams(location.search).get('token');
let kegiatan=null,daftar=[],typed='',selectedId=null,selectedRow=null,currentGps=null;

function show(x){document.getElementById('body').innerHTML=x}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

async function getPublicData(){
  const {data,error}=await sb.rpc('dk_public_attendance_get',{p_token:token});
  if(error) throw new Error(error.message);
  if(!data||data.ok!==true) throw new Error(data?.error||'Kegiatan tidak ditemukan / link kadaluarsa');
  return data;
}

async function init(){
  if(!token){show('<div class="msg err">Link tidak valid (token kosong)</div>');return}
  try{
    const data=await getPublicData();
    kegiatan=data.kegiatan; daftar=Array.isArray(data.daftar)?data.daftar:[];
    if(kegiatan.status!=='aktif'){show('<div class="msg err">Kegiatan sudah '+esc(kegiatan.status)+'. Absen ditutup.</div>');return}
    if(!Array.isArray(kegiatan.mode)||!kegiatan.mode.includes('online')){show('<div class="msg err">Mode online tidak aktif untuk kegiatan ini</div>');return}
    render();
  }catch(e){show('<div class="msg err">'+esc(e.message||'Kegiatan tidak ditemukan / link kadaluarsa')+'</div>')}
}

function render(){
  const tgl=new Date(kegiatan.tanggal+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const hadir=daftar.filter(x=>x.status_hadir==='hadir').length;
  show(`
    <div class="kgt"><div class="nm">${esc(kegiatan.acara_nama)}</div>
      <div class="meta">${esc(tgl)}${kegiatan.waktu?' · '+esc(String(kegiatan.waktu).slice(0,5)):''}${kegiatan.lokasi?' · '+esc(kegiatan.lokasi):''}</div>
      <div class="meta">📊 Hadir: <b>${hadir}</b> / ${daftar.length}</div>
    </div>
    <div class="gps">📍 <b>Wajib aktifkan GPS</b> — lokasi dicatat untuk audit kehadiran.</div>
    <div id="msg"></div>
    <label>Cari nama Anda</label>
    <div id="selected" class="ac-selected"></div>
    <div id="searchWrap">
      <div class="display" id="display"></div>
      <div class="hint" id="hint">Ketik nama menggunakan keyboard di bawah</div>
      <div class="vkb" id="vkb"></div>
    </div>
    <button id="submitBtn" class="btn" disabled onclick="submitHadir()">Pilih nama dulu</button>
  `);
  initKeyboard(); updateDisplay();
}

function score(d,q){
  const n=(d.jamaah_nama||'').toLowerCase(), k=(d.jamaah_kk||'').toLowerCase(), z=q.toLowerCase();
  let s=0;if(n.startsWith(z))s+=80;if(n.includes(z))s+=40;if(n.split(' ').some(w=>w.startsWith(z)))s+=30;if(k.startsWith(z))s+=20;
  let qi=0;for(const ch of n){if(ch===z[qi])qi++;if(qi>=z.length)break}s+=qi;
  return s;
}
function bestMatch(){
  if(!typed)return null;let b=null,bs=-1;
  daftar.forEach(d=>{if(d.status_hadir==='hadir')return;const s=score(d,typed);if(s>bs){bs=s;b=d}});
  return bs>0?b:null;
}
function updateDisplay(){
  const b=bestMatch(),d=document.getElementById('display'),h=document.getElementById('hint');
  if(!d)return;
  d.textContent=b?b.jamaah_nama:(typed||'Ketik nama...');
  d.style.color=b?'#1c1a16':'#aaa';
  h.textContent=b?'KK: '+(b.jamaah_kk||'-')+' — tekan ✓ Pilih':(typed?'Nama tidak ditemukan':'Ketik nama menggunakan keyboard di bawah');
}
function initKeyboard(){
  const rows=[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['Z','X','C','V','B','N','M']];
  let x='';rows.forEach(r=>{x+='<div class="row">'+r.map(k=>`<button type="button" class="key" onclick="press('${k}')">${k}</button>`).join('')+'</div>'});
  x+=`<div class="row"><button type="button" class="key accept" onclick="press('ACCEPT')">✓ Pilih</button><button type="button" class="key space" onclick="press(' ')">SPASI</button><button type="button" class="key back" onclick="press('BACK')">⌫</button></div>`;
  document.getElementById('vkb').innerHTML=x;
}
function press(k){
  if(selectedId)resetPick();
  if(k==='BACK')typed=typed.slice(0,-1);
  else if(k==='ACCEPT'){const b=bestMatch();if(b)pick(b);return}
  else if(k===' '){if(typed)typed+=' '}
  else if(typed.length<40)typed+=k;
  updateDisplay();
}
function pick(r){
  selectedId=r.id;selectedRow=r;typed='';
  const s=document.getElementById('selected');s.style.display='block';s.textContent='✅ '+r.jamaah_nama+' (KK: '+(r.jamaah_kk||'-')+')';
  document.getElementById('searchWrap').style.display='none';
  const b=document.getElementById('submitBtn');b.disabled=false;b.textContent='✅ Konfirmasi Hadir: '+r.jamaah_nama;
}
function resetPick(){
  selectedId=null;selectedRow=null;typed='';
  document.getElementById('selected').style.display='none';document.getElementById('searchWrap').style.display='block';
  const b=document.getElementById('submitBtn');b.disabled=true;b.textContent='Pilih nama dulu';updateDisplay();
}
function gps(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation)return reject(new Error('Browser tidak mendukung GPS'));
    navigator.geolocation.getCurrentPosition(p=>resolve({
      lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,
      maps_url:'https://maps.google.com/?q='+p.coords.latitude+','+p.coords.longitude,
      captured_at:new Date().toISOString()
    }),e=>{
      let m='Gagal mendapatkan lokasi GPS';
      if(e.code===1)m='Akses GPS ditolak. Izinkan lokasi di browser lalu coba lagi.';
      else if(e.code===2)m='Lokasi GPS tidak tersedia. Pastikan GPS aktif.';
      else if(e.code===3)m='Timeout mendapatkan GPS. Coba lagi.';
      reject(new Error(m));
    },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  });
}
async function submitHadir(){
  if(!selectedId)return;
  const b=document.getElementById('submitBtn'),m=document.getElementById('msg');b.disabled=true;m.innerHTML='';b.textContent='Meminta GPS...';
  try{currentGps=await gps()}catch(e){m.innerHTML='<div class="msg err">'+esc(e.message)+'</div>';b.disabled=false;b.textContent='🔄 Coba Lagi';return}
  b.textContent='Mendaftarkan kehadiran...';
  const {data,error}=await sb.rpc('dk_public_attendance_mark',{p_token:token,p_hadir_id:selectedId,p_gps:currentGps});
  if(error||!data||data.ok!==true){m.innerHTML='<div class="msg err">Gagal: '+esc(data?.error||error?.message||'Tidak dapat mencatat kehadiran')+'</div>';b.disabled=false;b.textContent='🔄 Coba Lagi';return}
  const nama=selectedRow?.jamaah_nama||'';
  show('<div class="msg ok">✅ <b>'+esc(nama)+'</b> tercatat hadir</div><div class="msg info">Memuat ulang...</div>');
  selectedId=null;selectedRow=null;typed='';currentGps=null;
  try{const x=await getPublicData();kegiatan=x.kegiatan;daftar=x.daftar||[];render()}catch(e){show('<div class="msg err">'+esc(e.message)+'</div>')}
}
init();
</script>
</body>
</html>
