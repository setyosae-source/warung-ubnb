<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"/>
<title>Absen Kegiatan UBNB</title>
<style>
:root{
  --green:#1a6640;--green-dark:#0f4428;--green-light:#e8f5ee;
  --gold:#c9a84c;--gold-dark:#9a7830;--gold-light:#fdf6e3;
  --red:#dc2626;--red-light:#fee2e2;
  --blue:#3b82f6;--blue-light:#dbeafe;
  --bg:#f5f3ee;--surface:#fff;--border:#e0d8cc;
  --text:#1c1a16;--text-muted:#8a8078;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans','Inter',sans-serif;background:linear-gradient(135deg,var(--green-dark) 0%,var(--green) 100%);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:14px;padding-bottom:env(keyboard-inset-height,14px);}
.wrap{background:white;border-radius:18px;width:100%;max-width:480px;box-shadow:0 24px 64px rgba(0,0,0,0.25);overflow:hidden;}
.head{background:linear-gradient(135deg,var(--green),var(--green-dark));color:white;padding:18px 16px;text-align:center;}
.head .icon{width:54px;height:54px;background:var(--gold-light);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:26px;border:2px solid var(--gold);}
.head h1{font-size:16px;font-weight:800;}
.head .sub{font-size:11px;opacity:0.9;margin-top:3px;}
.body{padding:18px 16px;}
.kgt-info{background:var(--green-light);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px;}
.kgt-info .nm{font-weight:800;color:var(--green-dark);font-size:15px;margin-bottom:3px;}
.kgt-info .meta{font-size:11px;color:var(--text-muted);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:5px;}
.field input,.field select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none;}
.field input:focus,.field select:focus{border-color:var(--green);}
.btn{width:100%;padding:13px;background:var(--green);color:white;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:hover{background:var(--green-dark);}
.btn:disabled{opacity:0.6;cursor:not-allowed;}
.btn.outline{background:white;color:var(--green);border:1.5px solid var(--green);}
.msg{padding:10px;border-radius:6px;font-size:12px;margin-bottom:12px;text-align:center;}
.msg.err{background:var(--red-light);color:var(--red);}
.msg.warn{background:#fef3c7;color:#78350f;}
.msg.ok{background:#dcfce7;color:#166534;}
.msg.info{background:var(--blue-light);color:#1e40af;}
.ac-wrap{position:relative;margin-bottom:6px;}
.ac-display{position:relative;width:100%;height:48px;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;background:white;}
.ac-display.focused{border-color:var(--green);}
.ac-ghost{position:absolute;inset:0;padding:13px;font-size:15px;font-family:inherit;color:#bbb;letter-spacing:0.2px;white-space:nowrap;overflow:hidden;pointer-events:none;}
.ac-typed{position:absolute;inset:0;padding:13px;font-size:15px;font-family:inherit;color:var(--text);letter-spacing:0.2px;white-space:nowrap;overflow:hidden;pointer-events:none;}
.ac-cursor{display:inline-block;width:2px;height:18px;background:var(--green);vertical-align:middle;margin-left:1px;animation:blink 1s step-end infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
.ac-hint{font-size:10px;color:var(--text-muted);margin-top:4px;min-height:14px;text-align:center;}
.ac-selected{background:var(--green-light);border-color:var(--green);padding:10px 13px;border-radius:8px;font-size:14px;font-weight:700;color:var(--green-dark);margin-bottom:8px;display:none;}

/* Virtual Keyboard */
.vkb{background:#e8ecf0;border-radius:10px;padding:8px 4px 10px;margin-top:10px;user-select:none;}
.vkb-row{display:flex;justify-content:center;gap:4px;margin-bottom:5px;}
.vkb-key{background:white;border:none;border-radius:6px;font-size:15px;font-weight:600;font-family:inherit;color:#1c1a16;
  height:42px;min-width:30px;flex:1;max-width:38px;
  box-shadow:0 2px 0 #b0b8c4;cursor:pointer;transition:transform 0.07s,box-shadow 0.07s;
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.vkb-key:active,.vkb-key.pressed{transform:translateY(2px);box-shadow:0 0 0 #b0b8c4;background:#e0e0e0;}
.vkb-key.space{max-width:none;flex:4;font-size:12px;color:#666;}
.vkb-key.backspace{max-width:52px;font-size:18px;background:#f1c0c0;}
.vkb-key.accept{max-width:none;flex:3;background:var(--green);color:white;font-size:13px;font-weight:700;box-shadow:0 2px 0 #0f4428;}
.vkb-key.accept:active{background:var(--green-dark);}
.success-box{background:linear-gradient(135deg,#10b981,#059669);color:white;border-radius:14px;padding:24px;text-align:center;}
.success-box .ico{font-size:60px;margin-bottom:8px;}
.success-box h2{font-size:18px;margin-bottom:6px;}
.success-box .nm{font-size:16px;font-weight:700;background:rgba(255,255,255,0.2);padding:8px;border-radius:8px;margin:10px 0;}
.success-box .tm{font-size:12px;opacity:0.9;}
.foot{text-align:center;font-size:11px;color:var(--text-muted);padding:12px 16px;border-top:1px solid #f3f4f6;}
.gps-banner{background:#fef3c7;border:1px solid #f59e0b;border-radius:8px;padding:8px 12px;font-size:11px;color:#78350f;margin-bottom:12px;text-align:center;line-height:1.5;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:6px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="icon">✅</div>
    <h1>Absen Kegiatan</h1>
    <div class="sub">UBNB Desa Perwira</div>
  </div>
  <div class="body" id="body">
    <div class="msg info">Memuat data kegiatan...</div>
  </div>
  <div class="foot">© 2026 UBNB Desa Perwira</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SURL='https://skltbmcrqutevmtcxqxj.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrbHRibWNycXV0ZXZtdGN4cXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzM5ODIsImV4cCI6MjA5MTI0OTk4Mn0._nogUZg5UylVyP45QTGYw69u76pNxGryj9hZORIfE_A';
const sb=supabase.createClient(SURL,SKEY);

const params=new URLSearchParams(location.search);
const token=params.get('token');

let kegiatan=null,daftar=[];
let currentGps=null;

async function init(){
  if(!token){show('<div class="msg err">Link tidak valid (token kosong)</div>');return;}
  try{
    const{data:k,error:e}=await sb.from('ubnb_kegiatan').select('*').eq('public_token',token).maybeSingle();
    if(e||!k){show('<div class="msg err">Kegiatan tidak ditemukan / link kadaluarsa</div>');return;}
    kegiatan=k;
    if(k.status!=='aktif'){show('<div class="msg err">Kegiatan sudah '+k.status+'. Absen ditutup.</div>');return;}
    if(!Array.isArray(k.mode)||!k.mode.includes('online')){show('<div class="msg err">Mode online tidak aktif untuk kegiatan ini</div>');return;}
    await refreshDaftar();
    renderForm();
  }catch(err){
    show('<div class="msg err">Error: '+err.message+'</div>');
  }
}

async function refreshDaftar(){
  const{data:hd}=await sb.from('ubnb_kegiatan_hadir').select('id,jamaah_did,jamaah_nama,jamaah_kk,status_hadir').eq('kegiatan_id',kegiatan.id).order('jamaah_nama');
  daftar=hd||[];
}

function show(html){document.getElementById('body').innerHTML=html;}

function renderForm(){
  const tgl=new Date(kegiatan.tanggal+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const sudahHadir=daftar.filter(d=>d.status_hadir==='hadir').length;
  const html=`
    <div class="kgt-info">
      <div class="nm">${kegiatan.acara_nama}</div>
      <div class="meta">${tgl}${kegiatan.waktu?' · '+kegiatan.waktu.substring(0,5):''}${kegiatan.lokasi?' · '+kegiatan.lokasi:''}</div>
      <div class="meta" style="margin-top:4px;">📊 Hadir: <b>${sudahHadir}</b> / ${daftar.length}</div>
    </div>
    <div class="gps-banner">📍 <b>Wajib aktifkan GPS</b> — kehadiran akan dicatat dengan koordinat lokasi untuk audit</div>
    <div id="msg-area"></div>
    <div class="field">
      <label>Cari nama Anda</label>
      <div id="ac-selected" class="ac-selected"></div>
      <div class="ac-wrap" id="ac-wrap">
        <div class="ac-display" id="ac-display">
          <div class="ac-ghost" id="ac-ghost"></div>
          <div class="ac-typed" id="ac-typed"></div>
        </div>
        <div class="ac-hint" id="ac-hint">Ketik nama menggunakan keyboard di bawah</div>
      </div>
      <div class="vkb" id="vkb"></div>
    </div>
    <button class="btn" id="btn-submit" onclick="submitHadir()" disabled>Pilih nama dulu</button>
  `;
  show(html);
  // Inisialisasi virtual keyboard setelah render
  setTimeout(()=>{ initVKB(); updateACDisplay(); },50);
}

let _typed='';
let _selectedHadirId=null;
let _ghostNama='';
let _ghostId=null;
let _ghostKK='';

// ===== SCORING: makin banyak karakter cocok = skor lebih tinggi =====
function scoreMatch(d, q){
  const nama = (d.jamaah_nama||'').toLowerCase();
  const kk   = (d.jamaah_kk||'').toLowerCase();
  const ql   = q.toLowerCase();
  let score  = 0;
  let ni=0, qi=0;
  while(ni<nama.length && qi<ql.length){ if(nama[ni]===ql[qi]){score++;qi++;} ni++; }
  if(nama.startsWith(ql)) score+=50;
  if(nama.split(' ').some(w=>w.startsWith(ql))) score+=20;
  let ks=0, ki2=0, ki=0;
  while(ki<kk.length && ki2<ql.length){ if(kk[ki]===ql[ki2]){ks++;ki2++;} ki++; }
  if(kk.startsWith(ql)) ks+=30;
  return Math.max(score, ks*0.8);
}

function getBestMatch(q){
  if(!q||!daftar.length) return null;
  const ql=q.toLowerCase();
  let best=null, bestScore=-1;
  daftar.forEach(d=>{
    if(d.status_hadir==='hadir') return;
    const s=scoreMatch(d,ql);
    if(s>bestScore){ bestScore=s; best=d; }
  });
  return bestScore>0?best:null;
}

function updateACDisplay(){
  const typedEl  = document.getElementById('ac-typed');
  const ghostEl  = document.getElementById('ac-ghost');
  const hintEl   = document.getElementById('ac-hint');
  if(!typedEl) return;
  const q = _typed;
  const best = getBestMatch(q);
  if(best && q.length>0){
    _ghostNama=best.jamaah_nama||'';
    _ghostId=best.id;
    _ghostKK=best.jamaah_kk||'';
    ghostEl.textContent=_ghostNama;
    if(hintEl) hintEl.textContent='KK: '+(_ghostKK||'-')+' — Tekan ✓ Pilih';
  } else {
    _ghostNama=''; _ghostId=null; _ghostKK='';
    ghostEl.textContent=q.length===0?'Ketik nama...':'';
    if(hintEl) hintEl.textContent=q.length>0?'Nama tidak ditemukan':'Ketik nama menggunakan keyboard di bawah';
  }
  typedEl.innerHTML=q
    ?'<span style="color:var(--text);font-weight:600;">'+q+'</span><span class="ac-cursor"></span>'
    :'<span class="ac-cursor"></span>';
}

function acceptGhost(){
  if(!_ghostId) return;
  pilihNama(_ghostId,_ghostNama,_ghostKK);
}

function pilihNama(id,nama,kk){
  _selectedHadirId=id;
  _typed='';
  const sel=document.getElementById('ac-selected');
  const wrap=document.getElementById('ac-wrap');
  if(sel){ sel.style.display='block'; sel.textContent='✅ '+nama+' (KK: '+kk+')'; }
  if(wrap) wrap.style.display='none';
  document.getElementById('btn-submit').disabled=false;
  document.getElementById('btn-submit').textContent='✅ Konfirmasi Hadir: '+nama;
}

function resetPilihan(){
  _selectedHadirId=null; _typed=''; _ghostNama=''; _ghostId=null;
  const sel=document.getElementById('ac-selected');
  const wrap=document.getElementById('ac-wrap');
  if(sel) sel.style.display='none';
  if(wrap) wrap.style.display='block';
  document.getElementById('btn-submit').disabled=true;
  document.getElementById('btn-submit').textContent='Pilih nama dulu';
  updateACDisplay();
}

function initVKB(){
  const vkb=document.getElementById('vkb');
  if(!vkb) return;
  const rows=[
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['Z','X','C','V','B','N','M'],
  ];
  let html='';
  rows.forEach(row=>{
    html+='<div class="vkb-row">';
    row.forEach(k=>{
      html+=`<button class="vkb-key" onpointerdown="vkbPress('${k}')" type="button">${k}</button>`;
    });
    html+='</div>';
  });
  html+=`<div class="vkb-row">
    <button class="vkb-key accept" onpointerdown="vkbPress('ACCEPT')" type="button">✓ Pilih</button>
    <button class="vkb-key space" onpointerdown="vkbPress(' ')" type="button">SPASI</button>
    <button class="vkb-key backspace" onpointerdown="vkbPress('BACK')" type="button">⌫</button>
  </div>`;
  vkb.innerHTML=html;
}

function vkbPress(k){
  if(_selectedHadirId) resetPilihan();
  if(k==='BACK'){
    _typed=_typed.slice(0,-1);
  } else if(k==='ACCEPT'){
    acceptGhost(); return;
  } else if(k===' '){
    if(_typed.length>0) _typed+=k;
  } else {
    if(_typed.length<40) _typed+=k;
  }
  updateACDisplay();
}

// ===== GPS WAJIB =====
function getCurrentPosition(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){
      reject(new Error('Browser Anda tidak mendukung GPS'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos=>{
        resolve({
          lat:pos.coords.latitude,
          lng:pos.coords.longitude,
          accuracy:pos.coords.accuracy,
          maps_url:'https://maps.google.com/?q='+pos.coords.latitude+','+pos.coords.longitude,
          captured_at:new Date().toISOString(),
        });
      },
      err=>{
        let msg='Gagal mendapatkan lokasi GPS';
        if(err.code===1) msg='Akses GPS ditolak. Mohon izinkan akses lokasi di browser Anda lalu coba lagi.';
        else if(err.code===2) msg='Lokasi GPS tidak tersedia. Pastikan GPS aktif di perangkat.';
        else if(err.code===3) msg='Timeout mendapatkan GPS. Coba lagi.';
        reject(new Error(msg));
      },
      {enableHighAccuracy:true,timeout:15000,maximumAge:0}
    );
  });
}

async function submitHadir(){
  if(!_selectedHadirId)return;
  const btn=document.getElementById('btn-submit');
  const msgArea=document.getElementById('msg-area');
  btn.disabled=true;
  msgArea.innerHTML='';
  
  // Step 1: GPS WAJIB
  btn.innerHTML='<span class="spinner"></span>Meminta izin GPS...';
  try{
    currentGps=await getCurrentPosition();
  }catch(err){
    msgArea.innerHTML='<div class="msg err">⚠️ '+err.message+'<br><b>Absen tidak bisa dilanjutkan tanpa GPS.</b></div>';
    btn.disabled=false;
    btn.textContent='🔄 Coba Lagi';
    return;
  }
  
  // Step 2: Submit
  btn.innerHTML='<span class="spinner"></span>Mendaftarkan kehadiran...';
  const{error}=await sb.from('ubnb_kegiatan_hadir').update({
    status_hadir:'hadir',
    hadir_at:new Date().toISOString(),
    input_via:'self',
    lokasi_gps:currentGps,
    updated_at:new Date().toISOString(),
  }).eq('id',_selectedHadirId);
  if(error){
    msgArea.innerHTML='<div class="msg err">Gagal: '+error.message+'</div>';
    btn.disabled=false;btn.textContent='🔄 Coba Lagi';
    return;
  }
  const d=daftar.find(x=>x.id===_selectedHadirId);
  showSuccess(d);
}

async function showSuccess(d){
  // Tampilkan flash sebentar lalu langsung ke form lagi
  const nama = d?d.jamaah_nama:'';
  show(`<div class="msg ok" style="font-size:14px;padding:14px;text-align:center;">
    ✅ <strong>${nama}</strong> tercatat hadir
  </div><div class="msg info" style="text-align:center;">⏳ Memuat ulang...</div>`);
  _selectedHadirId=null; _typed=''; _ghostNama=''; _ghostId=null;
  currentGps=null;
  await refreshDaftar();
  renderForm();
}

init();


</script>
</body>
</html>
