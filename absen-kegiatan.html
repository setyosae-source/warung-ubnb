<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Absen Kegiatan UBNB</title>
<style>
:root{
  --green:#1a6640;--green-dark:#0f4428;--green-light:#e8f5ee;
  --gold:#c9a84c;--gold-dark:#9a7830;--gold-light:#fdf6e3;
  --red:#dc2626;--red-light:#fee2e2;
  --blue:#3b82f6;--blue-light:#dbeafe;
  --bg:#f5f3ee;--surface:#fff;--border:#e0d8cc;
  --text:#1c1a16;--text-muted:#8a8078;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans','Inter',sans-serif;background:linear-gradient(135deg,var(--green-dark) 0%,var(--green) 100%);color:var(--text);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:14px;}
.wrap{background:white;border-radius:18px;width:100%;max-width:480px;box-shadow:0 24px 64px rgba(0,0,0,0.25);overflow:hidden;}
.head{background:linear-gradient(135deg,var(--green),var(--green-dark));color:white;padding:18px 16px;text-align:center;}
.head .icon{width:54px;height:54px;background:var(--gold-light);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:26px;border:2px solid var(--gold);}
.head h1{font-size:16px;font-weight:800;}
.head .sub{font-size:11px;opacity:0.9;margin-top:3px;}
.body{padding:18px 16px;}
.kgt-info{background:var(--green-light);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13px;}
.kgt-info .nm{font-weight:800;color:var(--green-dark);font-size:15px;margin-bottom:3px;}
.kgt-info .meta{font-size:11px;color:var(--text-muted);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:5px;}
.field input,.field select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none;}
.field input:focus,.field select:focus{border-color:var(--green);}
.btn{width:100%;padding:13px;background:var(--green);color:white;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:hover{background:var(--green-dark);}
.btn:disabled{opacity:0.6;cursor:not-allowed;}
.msg{padding:10px;border-radius:6px;font-size:12px;margin-bottom:12px;text-align:center;}
.msg.err{background:var(--red-light);color:var(--red);}
.msg.ok{background:#dcfce7;color:#166534;}
.dropdown-list{background:white;border:1.5px solid var(--green);border-radius:8px;max-height:240px;overflow-y:auto;margin-top:4px;display:none;}
.dropdown-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f3f4f6;font-size:13px;}
.dropdown-item:hover{background:var(--green-light);}
.dropdown-item.disabled{color:#9ca3af;cursor:not-allowed;}
.dropdown-item .sub{font-size:11px;color:var(--text-muted);}
.success-box{background:linear-gradient(135deg,#10b981,#059669);color:white;border-radius:14px;padding:24px;text-align:center;}
.success-box .ico{font-size:60px;margin-bottom:8px;}
.success-box h2{font-size:18px;margin-bottom:6px;}
.success-box .nm{font-size:16px;font-weight:700;background:rgba(255,255,255,0.2);padding:8px;border-radius:8px;margin:10px 0;}
.success-box .tm{font-size:12px;opacity:0.9;}
.foot{text-align:center;font-size:11px;color:var(--text-muted);padding:12px 16px;border-top:1px solid #f3f4f6;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="icon">✅</div>
    <h1>Absen Kegiatan</h1>
    <div class="sub">UBNB Desa Perwira</div>
  </div>
  <div class="body" id="body">
    <div class="msg" style="background:var(--bg);">Memuat data kegiatan...</div>
  </div>
  <div class="foot">© 2026 UBNB Desa Perwira</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SURL='https://skltbmcrqutevmtcxqxj.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrbHRibWNycXV0ZXZtdGN4cXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzM5ODIsImV4cCI6MjA5MTI0OTk4Mn0._nogUZg5UylVyP45QTGYw69u76pNxGryj9hZORIfE_A';
const sb=supabase.createClient(SURL,SKEY);

const params=new URLSearchParams(location.search);
const token=params.get('token');

let kegiatan=null,daftar=[];

async function init(){
  if(!token){show('<div class="msg err">Link tidak valid (token kosong)</div>');return;}
  try{
    const{data:k,error:e}=await sb.from('ubnb_kegiatan').select('*').eq('public_token',token).maybeSingle();
    if(e||!k){show('<div class="msg err">Kegiatan tidak ditemukan / link kadaluarsa</div>');return;}
    kegiatan=k;
    if(k.status!=='aktif'){show('<div class="msg err">Kegiatan sudah '+k.status+'. Absen ditutup.</div>');return;}
    if(!Array.isArray(k.mode)||!k.mode.includes('online')){show('<div class="msg err">Mode online tidak aktif untuk kegiatan ini</div>');return;}
    const{data:hd}=await sb.from('ubnb_kegiatan_hadir').select('id,jamaah_did,jamaah_nama,jamaah_kk,status_hadir').eq('kegiatan_id',k.id).order('jamaah_nama');
    daftar=hd||[];
    renderForm();
  }catch(err){
    show('<div class="msg err">Error: '+err.message+'</div>');
  }
}

function show(html){document.getElementById('body').innerHTML=html;}

function renderForm(){
  const tgl=new Date(kegiatan.tanggal+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const html=`
    <div class="kgt-info">
      <div class="nm">${kegiatan.acara_nama}</div>
      <div class="meta">${tgl}${kegiatan.waktu?' · '+kegiatan.waktu.substring(0,5):''}${kegiatan.lokasi?' · '+kegiatan.lokasi:''}</div>
    </div>
    <div id="msg-area"></div>
    <div class="field">
      <label>Cari nama Anda</label>
      <input type="text" id="cari" placeholder="Ketik nama..." oninput="filterList()" autocomplete="off"/>
      <div class="dropdown-list" id="dropdown"></div>
    </div>
    <button class="btn" id="btn-submit" onclick="submitHadir()" disabled>Pilih nama dulu</button>
  `;
  show(html);
}

let _selectedHadirId=null;
function filterList(){
  const q=(document.getElementById('cari').value||'').toLowerCase().trim();
  const dd=document.getElementById('dropdown');
  if(!q){dd.style.display='none';return;}
  const filtered=daftar.filter(d=>(d.jamaah_nama||'').toLowerCase().includes(q)||(d.jamaah_kk||'').toLowerCase().includes(q));
  if(!filtered.length){dd.innerHTML='<div class="dropdown-item disabled">Nama tidak ada di daftar</div>';dd.style.display='block';return;}
  dd.innerHTML=filtered.slice(0,8).map(d=>{
    const sudah=d.status_hadir==='hadir';
    return `<div class="dropdown-item ${sudah?'disabled':''}" ${sudah?'':`onclick="pilihNama(${d.id},'${(d.jamaah_nama||'').replace(/'/g,"\\'")}','${(d.jamaah_kk||'').replace(/'/g,"\\'")}')"`}>
      <div>${d.jamaah_nama} ${sudah?'<span style="color:#10b981;">✓ sudah hadir</span>':''}</div>
      <div class="sub">KK: ${d.jamaah_kk||'-'}</div>
    </div>`;
  }).join('');
  dd.style.display='block';
}
function pilihNama(id,nama,kk){
  _selectedHadirId=id;
  document.getElementById('cari').value=nama;
  document.getElementById('dropdown').style.display='none';
  document.getElementById('btn-submit').disabled=false;
  document.getElementById('btn-submit').textContent='✅ Konfirmasi Hadir: '+nama;
}

async function submitHadir(){
  if(!_selectedHadirId)return;
  const btn=document.getElementById('btn-submit');
  btn.disabled=true;btn.textContent='⏳ Mendaftarkan...';
  const{error}=await sb.from('ubnb_kegiatan_hadir').update({
    status_hadir:'hadir',
    hadir_at:new Date().toISOString(),
    input_via:'self',
    updated_at:new Date().toISOString(),
  }).eq('id',_selectedHadirId);
  if(error){
    document.getElementById('msg-area').innerHTML='<div class="msg err">Gagal: '+error.message+'</div>';
    btn.disabled=false;btn.textContent='Coba Lagi';
    return;
  }
  const d=daftar.find(x=>x.id===_selectedHadirId);
  show(`<div class="success-box">
    <div class="ico">🎉</div>
    <h2>Alhamdulillah!</h2>
    <p>Kehadiran Anda telah tercatat</p>
    <div class="nm">${d?d.jamaah_nama:''}</div>
    <div class="tm">${new Date().toLocaleString('id-ID',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
  </div>`);
}

init();
</script>
</body>
</html>
