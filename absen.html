<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,interactive-widget=resizes-content">
<title>Absensi Jamaah UBNB</title>
<style>
:root{--g:#17623c;--g2:#0d482a;--bg:#f3f1ec;--line:#e3ddd3;--text:#1e1b18;--muted:#736d65;--red:#c62828;--blue:#2463aa}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#0c4d2d,#17623c);color:var(--text);min-height:100vh}.wrap{width:min(760px,100%);margin:auto;padding:18px}.card{background:#fff;border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,.22);overflow:hidden}.hero{padding:20px 20px 16px;background:linear-gradient(135deg,#fffdf6,#f4fff8);border-bottom:1px solid var(--line)}.logo{width:48px;height:48px;border-radius:13px;background:#fff4c9;border:1px solid #e8d384;display:flex;align-items:center;justify-content:center;font-size:25px;margin-bottom:10px}.title{font-size:21px;font-weight:950;color:var(--g2)}.meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}.st{background:#fff;border:1px solid #dfe9e2;border-radius:10px;padding:8px;text-align:center}.st b{display:block;font-size:20px;color:var(--g2)}.st span{font-size:9px;color:var(--muted)}.body{padding:18px}.label{font-size:10px;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.45px;margin-bottom:6px}.search{width:100%;font:inherit;font-size:20px;border:2px solid #cbded2;border-radius:12px;padding:14px 15px;outline:none}.search:focus{border-color:var(--g)}.hint{font-size:11px;color:var(--muted);margin-top:7px}.results{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.name{font-weight:850}.sub{font-size:10px;color:var(--muted);margin-top:2px}.btn{border:0;border-radius:9px;padding:8px 11px;background:var(--g);color:#fff;font-weight:850;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.already{background:#e8f5ec;color:#19633b;padding:6px 9px;border-radius:8px;font-size:10px;font-weight:800}.msg{padding:12px;border-radius:10px;margin-top:10px;font-size:12px}.msg.err{background:#ffebee;color:var(--red)}.msg.info{background:#eaf2ff;color:#234e82}.success{background:linear-gradient(135deg,#18a45e,#0f7a45);color:#fff;border-radius:13px;padding:22px;text-align:center;margin-top:12px}.success .check{font-size:42px}.success .nm{font-size:21px;font-weight:950}.success .tm{margin-top:4px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:18px}.footer{text-align:center;color:rgba(255,255,255,.75);font-size:10px;padding:12px}.loading{display:inline-block;width:16px;height:16px;border:2px solid #ccc;border-top-color:var(--g);border-radius:50%;animation:s .8s linear infinite;vertical-align:middle}@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:520px){.wrap{padding:0}.card{border-radius:0;min-height:100vh}.stats{grid-template-columns:repeat(2,1fr)}.hero,.body{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="hero"><div class="logo">✓</div><div id="eventName" class="title">Memuat acara...</div><div id="eventMeta" class="meta"></div><div class="stats"><div class="st"><b id="sTotal">—</b><span>Peserta</span></div><div class="st"><b id="sHadir">—</b><span>Hadir</span></div><div class="st"><b id="sBelum">—</b><span>Belum</span></div><div class="st"><b id="sPct">—</b><span>Kehadiran</span></div></div></div><div class="body"><div id="statusMsg"></div><div id="searchArea" style="display:none"><div class="label">Cari Nama / NIJ / Scan Kartu</div><input id="q" class="search" autocomplete="off" placeholder="Ketik nama atau NIJ..." oninput="debouncedSearch()" onkeydown="handleKey(event)"><div class="hint">Pilih nama Anda lalu tekan <b>Hadir</b>. Jika menggunakan scanner, scan kartu pada kolom ini.</div><div id="results"></div><div id="success"></div></div></div></div><div class="footer">UBNB · Sistem Kehadiran Jamaah</div></div>
<script>
const API='https://skltbmcrqutevmtcxqxj.supabase.co/functions/v1/attendance-public';
const token=new URLSearchParams(location.search).get('token')||'';
let EVENT=null,LAST_RESULTS=[],timer=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function fmtDate(v){if(!v)return '-';return new Date(v+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
function fmtTime(v){return v?String(v).slice(0,5):'-'}
async function call(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,...payload})});let d={};try{d=await r.json()}catch(e){}if(!r.ok||!d.ok)throw Object.assign(new Error(d.error||('HTTP '+r.status)),{code:d.error,status:r.status});return d}
function showError(text){$('statusMsg').innerHTML='<div class="msg err">'+esc(text)+'</div>'}
function updateCounts(c){if(!c)return;$('sTotal').textContent=c.total;$('sHadir').textContent=c.hadir;$('sBelum').textContent=c.belum;$('sPct').textContent=(c.total?Math.round(c.hadir*100/c.total):0)+'%'}
async function loadEvent(){if(!token){showError('Link absensi tidak lengkap.');return}try{const d=await call('event');EVENT=d.event;$('eventName').textContent=EVENT.acara_nama;$('eventMeta').innerHTML=fmtDate(EVENT.tanggal)+' · '+fmtTime(EVENT.waktu)+(EVENT.waktu_selesai?'–'+fmtTime(EVENT.waktu_selesai):'')+' WIB<br>'+esc(EVENT.kelompok||'Desa')+(EVENT.lokasi?' · '+esc(EVENT.lokasi):'');updateCounts(d.counts);$('statusMsg').innerHTML='';$('searchArea').style.display='block';setTimeout(()=>$('q').focus(),80);setInterval(refreshCounts,15000)}catch(e){if(e.code==='EVENT_NOT_ACTIVE')showError('Absensi acara ini sudah ditutup atau status acara tidak aktif.');else if(e.code==='EVENT_NOT_FOUND')showError('Acara tidak ditemukan. Periksa kembali link absensi.');else showError('Gagal membuka acara: '+e.message)}}
async function refreshCounts(){try{const d=await call('event');updateCounts(d.counts)}catch(e){}}
function debouncedSearch(){clearTimeout(timer);timer=setTimeout(()=>search(),250)}
async function search(){const q=$('q').value.trim();$('success').innerHTML='';if(q.length<2){$('results').innerHTML='';LAST_RESULTS=[];return}$('results').innerHTML='<div class="empty"><span class="loading"></span> Mencari...</div>';try{const d=await call('search',{q});LAST_RESULTS=d.results||[];renderResults()}catch(e){$('results').innerHTML='<div class="msg err">Gagal mencari peserta.</div>'}}
function renderResults(){if(!LAST_RESULTS.length){$('results').innerHTML='<div class="empty">Nama / NIJ tidak ditemukan pada daftar peserta acara.</div>';return}$('results').innerHTML='<div class="results">'+LAST_RESULTS.map(x=>'<div class="row"><div><div class="name">'+esc(x.jamaah_nama)+'</div><div class="sub">NIJ '+esc(x.nij||'-')+(x.jamaah_kk?' · KK '+esc(x.jamaah_kk):'')+'</div></div>'+(x.status_hadir==='hadir'?'<span class="already">✓ Sudah hadir</span>':'<button class="btn" onclick="checkin('+x.id+','+JSON.stringify(x.matched_type||'self')+')">Hadir</button>')+'</div>').join('')+'</div>'}
async function checkin(rowId,method){document.querySelectorAll('.btn').forEach(b=>b.disabled=true);try{const d=await call('checkin',{row_id:rowId,method});updateCounts(d.counts);const r=d.row;$('results').innerHTML='';$('q').value='';LAST_RESULTS=[];const tm=r.hadir_at?new Date(r.hadir_at).toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'';$('success').innerHTML='<div class="success"><div class="check">✓</div><div class="nm">'+esc(r.jamaah_nama)+'</div><div class="tm">'+(d.already?'Sudah tercatat hadir':'Berhasil tercatat hadir')+' · '+tm+' WIB</div></div>';setTimeout(()=>{$('success').innerHTML='';$('q').focus()},2200)}catch(e){$('success').innerHTML='<div class="msg err">Gagal mencatat kehadiran: '+esc(e.message)+'</div>'}finally{document.querySelectorAll('.btn').forEach(b=>b.disabled=false)}}
async function handleKey(e){if(e.key!=='Enter')return;e.preventDefault();const q=$('q').value.trim();if(q.length<2)return;await search();const exact=LAST_RESULTS.filter(x=>String(x.nij||'')===q||x.matched_type);if(exact.length===1&&exact[0].status_hadir!=='hadir')checkin(exact[0].id,exact[0].matched_type||'self')}
loadEvent();
</script>
</body>
</html>
