<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Absen MPPS — UBNB Perwira</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --hijau:#1a6640;--hijau-dark:#0f4428;--hijau-mid:#2e7d52;--hijau-light:#e8f5ee;
  --emas:#c9a84c;--emas-dark:#9a7830;--emas-light:#fdf6e3;--emas-mid:#f0d898;
  --red:#c0392b;--amber:#b45309;--amber-light:#fef3c7;
  --purple:#6d28d9;
  --bg:#f0f7f3;--surface:#fff;--surface2:#faf8f4;
  --border:#d4e8db;--border-light:#e8f2ec;
  --text:#1c1a16;--text-muted:#6b7c72;
  --radius:16px;--radius-sm:10px;
  --shadow:0 2px 16px rgba(26,102,64,0.10);--shadow-lg:0 8px 32px rgba(26,102,64,0.15);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}

/* HEADER */
.header{background:linear-gradient(135deg,var(--hijau-dark),var(--hijau));color:white;padding:20px 16px 28px;text-align:center;position:relative;}
.header-logo{font-size:40px;margin-bottom:8px;}
.header h1{font-size:18px;font-weight:800;letter-spacing:.3px;}
.header p{font-size:12px;opacity:.8;margin-top:3px;}
.header-stat{display:flex;justify-content:center;gap:24px;margin-top:16px;}
.hstat{text-align:center;}
.hstat-val{font-size:28px;font-weight:800;line-height:1;}
.hstat-lbl{font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

/* CARD UTAMA */
.main{padding:16px;max-width:500px;margin:0 auto;}
.card{background:var(--surface);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border-light);}
.card-title{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--hijau-dark);}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:10px;}
.search-input{width:100%;padding:13px 16px 13px 44px;border:2px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:15px;color:var(--text);outline:none;transition:border-color .2s;background:var(--surface);}
.search-input:focus{border-color:var(--hijau);}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none;}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--border);border:none;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;display:none;align-items:center;justify-content:center;}
.search-clear.show{display:flex;}

/* SUGGEST LIST */
.suggest-list{border:2px solid var(--emas);border-radius:var(--radius-sm);background:white;box-shadow:var(--shadow-lg);max-height:280px;overflow-y:auto;display:none;}
.suggest-list.show{display:block;}
.suggest-item{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border-light);transition:background .1s;}
.suggest-item:last-child{border:none;}
.suggest-item:hover,.suggest-item:active{background:var(--hijau-light);}
.s-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0;color:white;}
.s-info{flex:1;min-width:0;}
.s-nama{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
.s-badge{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:700;flex-shrink:0;}
.badge-anggota{background:var(--emas-light);color:var(--emas-dark);border:1px solid var(--emas-mid);}
.badge-jamaah{background:#ede9fe;color:#5b21b6;}
.badge-hadir{background:#d1fae5;color:#065f46;}

/* FEEDBACK */
.feedback{border-radius:var(--radius-sm);padding:16px;margin-top:12px;display:none;text-align:center;}
.feedback.hadir{background:#d1fae5;border:2px solid #34d399;}
.feedback.sudah{background:var(--amber-light);border:2px solid var(--emas);}
.feedback.err{background:#fee2e2;border:2px solid #f87171;}
.feedback-icon{font-size:36px;margin-bottom:8px;}
.feedback-nama{font-size:18px;font-weight:800;margin-bottom:4px;}
.feedback-sub{font-size:13px;color:var(--text-muted);}

/* TAMBAH JAMAAH BARU */
.new-j-btn{width:100%;padding:13px;background:var(--surface);color:var(--purple);border:2px dashed var(--purple);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;transition:background .15s;}
.new-j-btn:hover{background:#f5f3ff;}
.new-j-form{background:var(--emas-light);border:2px dashed var(--emas);border-radius:var(--radius-sm);padding:16px;margin-top:10px;display:none;}
.new-j-form.show{display:block;}
.irow{margin-bottom:10px;}
.irow label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:4px;}
.irow input,.irow select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;color:var(--text);outline:none;background:white;}
.irow input:focus,.irow select:focus{border-color:var(--emas);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{width:100%;padding:13px;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;}
.btn-primary{background:var(--hijau);color:white;}
.btn-primary:active{background:var(--hijau-dark);}
.btn-secondary{background:white;color:var(--hijau);border:2px solid var(--hijau);}
.btn-purple{background:var(--purple);color:white;}

/* DAFTAR HADIR TERAKHIR */
.hadir-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-light);}
.hadir-item:last-child{border:none;}
.hi-no{font-size:11px;font-weight:800;color:var(--hijau);min-width:36px;}
.hi-nama{flex:1;font-weight:600;font-size:13px;}
.hi-jam{font-size:11px;color:var(--text-muted);}

/* SPINNER */
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* TOAST */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:999;pointer-events:none;}
.toast{background:#1a3a2a;color:white;padding:12px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap;}
.toast.err{background:var(--red);}

/* SUCCESS OVERLAY */
.success-overlay{position:fixed;inset:0;background:rgba(26,102,64,.95);display:none;align-items:center;justify-content:center;z-index:500;flex-direction:column;text-align:center;padding:24px;}
.success-overlay.show{display:flex;}
.so-icon{font-size:80px;margin-bottom:16px;animation:popIn .4s cubic-bezier(.175,.885,.32,1.275);}
.so-nomor{font-size:40px;font-weight:800;color:var(--emas);margin-bottom:8px;}
.so-nama{font-size:24px;font-weight:800;color:white;margin-bottom:6px;}
.so-kel{font-size:15px;color:rgba(255,255,255,.7);margin-bottom:12px;}
.so-status{padding:6px 18px;border-radius:99px;font-size:13px;font-weight:700;margin-bottom:24px;}
.so-anggota{background:var(--emas-light);color:var(--emas-dark);}
.so-jamaah{background:#ede9fe;color:#5b21b6;}
.so-close{padding:14px 32px;background:white;color:var(--hijau-dark);border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
@keyframes popIn{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-logo">🗳️</div>
  <h1>Absensi MPPS UBNB</h1>
  <p>Musyawarah Pemegang &amp; Pemilik Saham · Desa Perwira</p>
  <div class="header-stat">
    <div class="hstat"><div class="hstat-val" id="stat-hadir">0</div><div class="hstat-lbl">Hadir</div></div>
    <div class="hstat"><div class="hstat-val" id="stat-anggota">0</div><div class="hstat-lbl">Anggota</div></div>
    <div class="hstat"><div class="hstat-val" id="stat-jamaah">0</div><div class="hstat-lbl">Tamu</div></div>
  </div>
</div>

<div class="main">

  <!-- CARI & ABSEN -->
  <div class="card">
    <div class="card-title">👆 Tap nama untuk absen</div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" type="text" id="q" placeholder="Ketik nama jamaah..." 
        autocomplete="off" autocorrect="off" spellcheck="false"
        oninput="onSearch(this.value)">
      <button class="search-clear" id="q-clear" onclick="clearSearch()">✕</button>
    </div>
    <div class="suggest-list" id="suggest"></div>
    <div class="feedback" id="feedback"></div>

    <!-- Tambah jamaah baru -->
    <button class="new-j-btn" onclick="toggleNewJ()">➕ Tambah Nama Jamaah Baru</button>
    <div class="new-j-form" id="new-j-form">
      <div style="font-size:12px;font-weight:700;color:var(--emas-dark);margin-bottom:12px;">📝 Tambah ke data jamaah &amp; langsung catat hadir</div>
      <div class="two-col">
        <div class="irow"><label>Nama *</label><input type="text" id="nj-nama" placeholder="Nama lengkap"></div>
        <div class="irow"><label>Nama KK</label><input type="text" id="nj-kk" placeholder="Kepala keluarga"></div>
      </div>
      <div class="two-col">
        <div class="irow"><label>Kelompok</label>
          <select id="nj-kel">
            <option value="">-- Pilih --</option>
            <option value="PW1">PW1</option><option value="PW2">PW2</option>
            <option value="PW3">PW3</option><option value="PW4">PW4</option>
          </select>
        </div>
        <div class="irow"><label>Jenis Kelamin</label>
          <select id="nj-jk"><option value="L">Laki-laki</option><option value="P">Perempuan</option></select>
        </div>
      </div>
      <button class="btn btn-purple" onclick="simpanJamaahBaru()" id="btn-simpan">💾 Simpan &amp; Catat Hadir</button>
      <button class="btn btn-secondary" onclick="toggleNewJ()">Batal</button>
    </div>
  </div>

  <!-- TERAKHIR HADIR -->
  <div class="card">
    <div class="card-title" style="display:flex;justify-content:space-between;">
      <span>🕐 Terakhir Hadir</span>
      <button onclick="loadData()" style="background:none;border:none;font-size:18px;cursor:pointer;">↻</button>
    </div>
    <div id="last-hadir"></div>
  </div>

</div>

<!-- SUCCESS OVERLAY -->
<div class="success-overlay" id="success-overlay" onclick="closeSuccess()">
  <div class="so-icon">✅</div>
  <div class="so-nomor" id="so-nomor">#001</div>
  <div class="so-nama" id="so-nama">-</div>
  <div class="so-kel" id="so-kel"></div>
  <div class="so-status" id="so-status"></div>
  <button class="so-close">Tap untuk tutup</button>
</div>

<!-- TOAST -->
<div class="toast-wrap" id="toast-wrap" style="display:none;">
  <div class="toast" id="toast-msg"></div>
</div>

<script>
const SURL='https://skltbmcrqutevmtcxqxj.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrbHRibWNycXV0ZXZtdGN4cXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzM5ODIsImV4cCI6MjA5MTI0OTk4Mn0._nogUZg5UylVyP45QTGYw69u76pNxGryj9hZORIfE_A';
const sb=supabase.createClient(SURL,SKEY);

let aJamaah=[],aSaham=[],aHadir=[];
let sahamMap={},hadirMap={};

function kelColor(k,isA){
  if(!isA)return'#6d28d9';
  return{PW1:'#1e5fa8',PW2:'#be185d',PW3:'#065f46',PW4:'#9a7830'}[k]||'#1a6640';
}
function initials(n){return(n||'?').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
function kelBadge(k){const c={PW1:'#dbeafe|#1d4ed8',PW2:'#fce7f3|#be185d',PW3:'#d1fae5|#065f46',PW4:'#fdf6e3|#9a7830'};const[bg,col]=(c[k]||'#f3f4f6|#4b5563').split('|');return k?`<span style="background:${bg};color:${col};padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700">${k}</span>`:''}
function fmtJam(s){if(!s)return'';return new Date(s).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});}

let _tt;
function toast(msg,err=false){
  const w=document.getElementById('toast-wrap'),m=document.getElementById('toast-msg');
  m.textContent=msg;m.className='toast'+(err?' err':'');w.style.display='block';
  clearTimeout(_tt);_tt=setTimeout(()=>w.style.display='none',3000);
}

async function loadData(){
  const[{data:jm},{data:sh},{data:hd}]=await Promise.all([
    sb.from('jamaah_desa').select('did,nama,kelompok,kelompok_nama,jenis_kelamin,nama_kk').order('nama'),
    sb.from('ubnb_saham').select('nama,kelompok').eq('status','Aktif'),
    sb.from('mpps_hadir').select('*').order('hadir_at',{ascending:false}),
  ]);
  aJamaah=jm||[];aSaham=sh||[];aHadir=hd||[];
  sahamMap={};(sh||[]).forEach(s=>sahamMap[s.nama.toLowerCase().trim()]={kelompok:s.kelompok});
  hadirMap={};(hd||[]).forEach(h=>{const k=h.nama.toLowerCase().trim();if(!hadirMap[k])hadirMap[k]=h;});

  // Update stats
  document.getElementById('stat-hadir').textContent=aHadir.length;
  document.getElementById('stat-anggota').textContent=aHadir.filter(h=>h.is_anggota).length;
  document.getElementById('stat-jamaah').textContent=aHadir.filter(h=>!h.is_anggota).length;
  renderLastHadir();
  if(document.getElementById('q').value)onSearch(document.getElementById('q').value);
}

function renderLastHadir(){
  const el=document.getElementById('last-hadir');
  const list=aHadir.slice(0,10);
  if(!list.length){el.innerHTML='<div style="text-align:center;padding:16px;color:var(--text-muted);font-size:13px">Belum ada yang hadir</div>';return;}
  el.innerHTML=list.map(h=>`
    <div class="hadir-item">
      <div class="hi-no">${h.nomor||'-'}</div>
      <div class="hi-nama">${h.nama} ${kelBadge(h.kelompok)}</div>
      <div class="hi-jam">${h.is_anggota?'⭐ ':'''}${fmtJam(h.hadir_at)}</div>
    </div>`).join('');
}

function onSearch(q){
  const clearBtn=document.getElementById('q-clear');
  clearBtn.classList.toggle('show',q.length>0);
  const sg=document.getElementById('suggest');
  const fb=document.getElementById('feedback');
  fb.style.display='none';
  if(!q||q.length<2){sg.classList.remove('show');return;}
  const ql=q.toLowerCase();
  let list=aJamaah.filter(j=>j.nama.toLowerCase().includes(ql)).slice(0,8);
  if(!list.length){sg.innerHTML='<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px">Tidak ditemukan. Coba tambah jamaah baru.</div>';sg.classList.add('show');return;}
  sg.innerHTML=list.map(j=>{
    const nk=j.nama.toLowerCase().trim();
    const isA=!!sahamMap[nk];
    const kelA=isA?sahamMap[nk].kelompok:null;
    const kel=kelA||(j.kelompok?(/^\d+$/.test(j.kelompok)?'PW'+j.kelompok:j.kelompok):null);
    const sudah=!!hadirMap[nk];
    return`<div class="suggest-item${sudah?' done':''}" onclick="${sudah?`showSudahHadir('${j.nama.replace(/'/g,"\\'")}')`:`doAbsen('${j.nama.replace(/'/g,"\\'")}','${kel||''}','${j.did||''}',${isA},'${j.jenis_kelamin||''}')`}">
      <div class="s-avatar" style="background:${sudah?'#bbb':kelColor(kel,isA)}">${initials(j.nama)}</div>
      <div class="s-info">
        <div class="s-nama">${j.nama}</div>
        <div class="s-sub">${j.kelompok_nama||kel||'—'}${j.nama_kk?' · KK: '+j.nama_kk:''}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;align-items:flex-end;">
        ${kel?`<span class="s-badge" style="background:${({PW1:'#dbeafe',PW2:'#fce7f3',PW3:'#d1fae5',PW4:'#fdf6e3'}[kel]||'#f3f4f6')};color:${({PW1:'#1d4ed8',PW2:'#be185d',PW3:'#065f46',PW4:'#9a7830'}[kel]||'#4b5563')}">${kel}</span>`:''}
        ${isA?`<span class="s-badge badge-anggota">⭐ Anggota</span>`:`<span class="s-badge badge-jamaah">Jamaah</span>`}
        ${sudah?`<span class="s-badge badge-hadir">✅ ${fmtJam(hadirMap[nk]?.hadir_at)}</span>`:'<span style="font-size:12px;color:var(--hijau);font-weight:700">+ Hadir</span>'}
      </div>
    </div>`;
  }).join('');
  sg.classList.add('show');
}

function clearSearch(){
  document.getElementById('q').value='';
  document.getElementById('q-clear').classList.remove('show');
  document.getElementById('suggest').classList.remove('show');
  document.getElementById('feedback').style.display='none';
  document.getElementById('q').focus();
}

function showSudahHadir(nama){
  const nk=nama.toLowerCase().trim();
  const hd=hadirMap[nk];
  const fb=document.getElementById('feedback');
  fb.className='feedback sudah';
  fb.style.display='block';
  fb.innerHTML=`<div class="feedback-icon">⚠️</div>
    <div class="feedback-nama">${nama}</div>
    <div class="feedback-sub">Sudah hadir pada ${fmtJam(hd?.hadir_at)}</div>`;
  document.getElementById('suggest').classList.remove('show');
  setTimeout(()=>fb.style.display='none',3000);
}

async function doAbsen(nama,kelompok,did,isAnggota,jk){
  const nk=nama.toLowerCase().trim();
  if(hadirMap[nk]){showSudahHadir(nama);return;}
  const nomor='#'+String(aHadir.length+1).padStart(3,'0');
  const{error}=await sb.from('mpps_hadir').insert([{
    nama,kelompok:kelompok||null,nomor,
    jamaah_did:did||null,
    is_anggota:isAnggota,
    jenis_kelamin:jk||null
  }]);
  if(error){toast('Gagal absen: '+error.message,true);return;}

  // Tampil success overlay
  document.getElementById('so-nomor').textContent=nomor;
  document.getElementById('so-nama').textContent=nama;
  document.getElementById('so-kel').innerHTML=kelompok?`Kelompok ${kelompok}`:'';
  const st=document.getElementById('so-status');
  st.className='so-status '+(isAnggota?'so-anggota':'so-jamaah');
  st.textContent=isAnggota?'⭐ Anggota Saham':'👤 Tamu / Jamaah';
  document.getElementById('success-overlay').classList.add('show');

  clearSearch();
  await loadData();
}

function closeSuccess(){
  document.getElementById('success-overlay').classList.remove('show');
  document.getElementById('q').focus();
}

// ===== TAMBAH JAMAAH BARU =====
function toggleNewJ(){
  const f=document.getElementById('new-j-form');
  f.classList.toggle('show');
  if(f.classList.contains('show'))setTimeout(()=>document.getElementById('nj-nama').focus(),100);
}

async function simpanJamaahBaru(){
  const nama=document.getElementById('nj-nama').value.trim();
  if(!nama){toast('Nama wajib diisi',true);return;}
  const kk=document.getElementById('nj-kk').value.trim();
  const kel=document.getElementById('nj-kel').value;
  const jk=document.getElementById('nj-jk').value;
  if(aJamaah.find(j=>j.nama.toLowerCase().trim()===nama.toLowerCase().trim())){
    toast('Nama sudah ada di data jamaah!',true);return;
  }
  const btn=document.getElementById('btn-simpan');
  btn.innerHTML='<span class="spinner"></span>Menyimpan...';btn.disabled=true;
  const did='JD'+Date.now();
  const kelNum=kel?kel.replace('PW',''):null;
  const{error:ej}=await sb.from('jamaah_desa').insert([{
    did,nama,nama_kk:kk||null,
    kelompok:kelNum,kelompok_nama:kel||null,
    jenis_kelamin:jk
  }]);
  if(ej){toast('Gagal simpan: '+ej.message,true);btn.innerHTML='💾 Simpan & Catat Hadir';btn.disabled=false;return;}
  // Langsung catat hadir
  const nomor='#'+String(aHadir.length+1).padStart(3,'0');
  await sb.from('mpps_hadir').insert([{
    nama,kelompok:kel||null,nomor,jamaah_did:did,is_anggota:false,jenis_kelamin:jk
  }]);
  btn.innerHTML='💾 Simpan & Catat Hadir';btn.disabled=false;
  document.getElementById('nj-nama').value='';
  document.getElementById('nj-kk').value='';
  document.getElementById('new-j-form').classList.remove('show');
  // Success overlay
  document.getElementById('so-nomor').textContent=nomor;
  document.getElementById('so-nama').textContent=nama;
  document.getElementById('so-kel').innerHTML=kel?`Kelompok ${kel}`:'Jamaah Baru';
  const st=document.getElementById('so-status');
  st.className='so-status so-jamaah';st.textContent='👤 Jamaah Baru';
  document.getElementById('success-overlay').classList.add('show');
  await loadData();
}

// Init
loadData();
