<!-- FORM BARANG DENGAN SATUAN DAN ALLOW_DECIMAL -->
<!-- Copy snippet ini ke form tambah/edit barang -->

<div class="irow">
  <label>Satuan</label>
  <select id="form-satuan" onchange="updateAllowDecimalSuggestion()">
    <optgroup label="🔢 Unit/Satuan">
      <option value="pcs">Pcs (Pieces/Buah)</option>
      <option value="unit">Unit/Set</option>
      <option value="porsi">Porsi</option>
    </optgroup>
    
    <optgroup label="📦 Kemasan">
      <option value="dus">Dus/Box/Karton</option>
      <option value="pak">Pak/Pack/Bungkus</option>
      <option value="lusin">Lusin (12 pcs)</option>
      <option value="botol">Botol</option>
      <option value="kaleng">Kaleng</option>
      <option value="sachet">Sachet</option>
    </optgroup>
    
    <optgroup label="⚖️ Berat">
      <option value="kg">Kilogram (kg)</option>
      <option value="gram">Gram</option>
      <option value="ons">Ons (100 gram)</option>
    </optgroup>
    
    <optgroup label="🧪 Volume">
      <option value="liter">Liter</option>
      <option value="ml">Mililiter (ml)</option>
    </optgroup>
    
    <optgroup label="📏 Panjang">
      <option value="meter">Meter</option>
      <option value="cm">Centimeter</option>
    </optgroup>
  </select>
</div>

<div class="irow">
  <label>
    <input type="checkbox" id="form-allow-decimal" style="width:auto;margin-right:6px"/>
    Boleh pecahan/desimal
  </label>
  <small style="color:var(--text-muted);font-size:11px">
    Centang jika qty bisa 0.5, 1.5, 2.25 (contoh: telur 1.5 kg)
  </small>
</div>

<script>
// Auto-suggest allow_decimal berdasarkan satuan
function updateAllowDecimalSuggestion() {
  const satuan = document.getElementById('form-satuan').value;
  const checkbox = document.getElementById('form-allow-decimal');
  
  // Satuan yang biasanya desimal
  const desimalUnits = ['kg', 'gram', 'ons', 'liter', 'ml', 'meter', 'cm'];
  
  // Auto-check jika satuan biasanya desimal
  if (desimalUnits.includes(satuan)) {
    checkbox.checked = true;
  }
  // Note: user masih bisa uncheck manual kalau mau
}

// Saat save barang
function simpanBarang() {
  const satuan = document.getElementById('form-satuan').value;
  const allowDecimal = document.getElementById('form-allow-decimal').checked;
  
  const payload = {
    nama: document.getElementById('form-nama').value,
    satuan: satuan,
    allow_decimal: allowDecimal,
    // ... field lainnya
  };
  
  // Insert/update ke Supabase
  // await sb.from('barang').insert([payload]);
}
</script>
