 .event-banner p{font-size:14px;line-height:1.7;gap:6px;max-width:none}.event-banner p svg{width:16px;height:16px}
 .countdown{min-width:78px}.countdown b{font-size:34px}.countdown>span{font-size:13px;line-height:1.45;max-width:85px}
 .countdown button{font-size:13px;min-height:40px;padding:7px;white-space:normal}
 .metric-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .stat{padding:16px}.stat>small{font-size:14px;line-height:1.5;min-height:44px;padding-right:24px;color:#806d8d}
 .stat strong{font-size:33px;line-height:1.25}.stat strong span{font-size:17px}
 .stat strong.small-number{font-size:21px;line-height:1.4;overflow-wrap:anywhere}
 .stat p{font-size:14px;line-height:1.6;margin-top:10px;color:#8c779b}
 .stat>.stat-icon{top:16px;right:12px;width:26px;height:26px}
 .task-line,.agenda-line{gap:10px;align-items:flex-start}
 .task-line>div{min-width:0;flex:1 1 170px}.task-line b,.agenda-line b,.mini-row b{font-size:16px;line-height:1.55}
 .task-line small,.agenda-line small,.mini-row small,.main-cell small{font-size:14px;line-height:1.6;color:#8d769e}
 .check-box{width:26px;height:26px;margin-top:2px}.check-box svg{width:16px;height:16px}
 .task-line .badge,.badge{font-size:13px;line-height:1.4;padding:5px 8px}
 .add-inline{font-size:15px;min-height:44px;margin-top:8px}.agenda-line time{font-size:15px;padding:10px 8px}
 .quick-grid{grid-template-columns:1fr}.quick-grid button{padding:18px;min-height:105px}
 .quick-grid button:last-child{grid-column:auto;padding:18px}.quick-grid button:last-child>b{display:block;margin:10px 0 0}.quick-grid button:last-child>small{margin-left:0}
 .quick-grid b{font-size:16px;line-height:1.5}.quick-grid small{font-size:14px;line-height:1.6;margin-top:6px}
 .progress-panel{padding:8px 17px 22px;gap:20px}.ring{width:108px;height:108px}.ring b{font-size:29px}.ring small{font-size:14px}
 .legend>span{font-size:14px;line-height:1.5}.legend{gap:14px;min-width:0}
 .alert-line b,.calm b,.gentle-note h3{font-size:15px;line-height:1.55}.alert-line small,.calm p,.gentle-note p{font-size:14px;line-height:1.65}
 .filters{gap:10px;padding:16px}.search-box{min-height:46px;flex-basis:100%;max-width:none}
 .search-box input,.filters select,.export-button{font-size:16px;line-height:1.4}
 .search-box input{padding:11px 0}.filters select{padding:11px;min-height:46px;max-width:none}
 .export-button{min-height:44px;padding:10px 12px}
 th{font-size:14px;line-height:1.4;padding:15px 16px}td{font-size:16px;line-height:1.6;padding:17px 16px}
 .main-cell{font-size:16px;min-width:235px;max-width:370px}.main-cell small{max-width:335px}
 .row-actions{gap:5px}.row-actions .icon-button{width:44px;height:44px}
 .table-footer,.card-caption{font-size:14px;line-height:1.6}
 .muted,.overdue,.wa{font-size:14px;line-height:1.5}.wa svg{width:17px;height:17px}
 .empty{padding:35px 22px}.empty h3{font-size:18px;line-height:1.4}.empty p{font-size:15px;line-height:1.7}
 .info-card{padding:22px}.info-card>p,.soft-box,.hint{font-size:15px;line-height:1.7}
 .info-card>h3{font-size:25px;line-height:1.4}.info-hero h2{font-size:30px;line-height:1.4}
 dl>div{font-size:15px;line-height:1.6;flex-wrap:wrap;gap:5px;padding:15px 0}
 dt{flex:1 1 140px;color:#90769f}dd{flex:1 1 150px;color:#7a608b;text-align:left}
 .mini-row{padding:17px 16px;gap:12px}.mini-row time{font-size:13px;line-height:1.5}
 .theme-preview{height:160px}.theme-preview b{font-size:29px}.theme-preview span{font-size:14px}
 .color-fields{flex-wrap:wrap;gap:18px}.color-fields label{font-size:15px;line-height:1.5;min-width:120px}
 .color-fields small{font-size:14px}.color-fields input{width:54px;height:40px}
 .button-row{flex-wrap:wrap;gap:12px}.count-buttons{flex-wrap:wrap;gap:8px}
 .count-buttons button{font-size:15px;min-height:44px;padding:9px 12px}
 .timeline-row time{font-size:15px;min-width:44px}.timeline-row h3{font-size:16px;line-height:1.55}
 .timeline-row p{font-size:14px;line-height:1.65}.timeline-row>.secondary{font-size:14px;min-height:44px;padding:10px 12px;margin-left:68px}
 .section-progress b{font-size:14px;line-height:1.5;width:130px}.section-progress span{font-size:14px;width:45px}
 .export-card{padding:20px;min-height:155px}.export-card b{font-size:16px;line-height:1.4}
 .export-card small{font-size:14px;line-height:1.6}.export-card>svg:last-child{width:18px;right:16px}
 .modal-head h2{font-size:22px;line-height:1.3}.modal-head .eyebrow{font-size:12px}
 .field>span{font-size:15px;line-height:1.4;color:#795c8c}
 .field input,.field select,.field textarea,.custom-field-row input{font-size:17px;min-height:48px;line-height:1.5;padding:11px 12px}
 .field textarea{min-height:115px}.checkbox-field{font-size:15px;line-height:1.6}.checkbox-field input{width:20px;height:20px}
 .modal-footer button{font-size:15px;min-height:46px}.custom-fields h3,.custom-fields p{font-size:15px;line-height:1.6}
 .attachment-section>b{font-size:16px}.attachment-section>small,.attachment-list button{font-size:14px;line-height:1.6}
 .form-error,.toast{font-size:15px;line-height:1.6}.page-footer{font-size:13px;line-height:1.7}
 .landing-card>p{font-size:16px;line-height:1.7}.landing-card>small{font-size:13px;line-height:1.6}
 .landing-details{font-size:15px;line-height:1.5;gap:12px}
 .auth-title{font-size:21px;line-height:1.35}.auth-card h1{font-size:39px}
 .auth-form .field input,.reset-link-panel textarea{font-size:17px;min-height:48px}
 .auth-form .primary{font-size:16px;min-height:48px}
 .password-input>.icon-button{width:40px;height:40px;top:4px;right:4px}
 .auth-card>.text-button,.auth-links .text-button{font-size:15px;min-height:44px}
 .auth-note,.auth-note b,.auth-note span,.auth-message,.auth-description,.reset-link-panel form>p{font-size:15px;line-height:1.65}
 .recovery-success p{font-size:16px;line-height:1.7}
}
@media screen and (max-width:767px){.event-banner>div:first-child{min-width:0;flex:1}.event-banner h2{white-space:normal;overflow-wrap:anywhere}.task-line,.agenda-line{flex-wrap:wrap}.agenda-line>div{min-width:0;flex:1 1 170px}.legend>span{flex-wrap:wrap}.info-grid{grid-template-columns:1fr}}
