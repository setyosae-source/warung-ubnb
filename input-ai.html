<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Input AI — Warung UBNB</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
  --green: #16a34a;
  --green-dark: #14532d;
  --green-light: #dcfce7;
  --green-mid: #22c55e;
  --amber: #d97706;
  --amber-light: #fef3c7;
  --red: #dc2626;
  --red-light: #fee2e2;
  --blue: #2563eb;
  --blue-light: #dbeafe;
  --bg: #f0fdf4;
  --surface: #ffffff;
  --border: #d1fae5;
  --border-dark: #86efac;
  --text: #14532d;
  --text-body: #166534;
  --text-muted: #6b7280;
  --radius: 16px;
  --radius-sm: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: hidden; }

body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
}

/* HEADER */
.header {
  background: linear-gradient(135deg, #14532d 0%, #166534 50%, #15803d 100%);
  padding: 20px 16px 24px;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 160px; height: 160px;
  background: rgba(255,255,255,0.06);
  border-radius: 50%;
}
.header::after {
  content: '';
  position: absolute;
  bottom: -20px; left: 40px;
  width: 100px; height: 100px;
  background: rgba(255,255,255,0.04);
  border-radius: 50%;
}
.header-content { position: relative; z-index: 1; }
.header-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.2);
  color: #bbf7d0;
  padding: 4px 12px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}
.header h1 {
  font-size: 22px;
  font-weight: 800;
  color: white;
  line-height: 1.2;
  margin-bottom: 4px;
}
.header p {
  font-size: 13px;
  color: #86efac;
  font-weight: 400;
}

/* MAIN */
.main { padding: 16px; max-width: 600px; margin: 0 auto; }

/* CARD */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
  border: 1.5px solid var(--border);
  box-shadow: 0 2px 12px rgba(22,163,74,0.06);
}
.card-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-title .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green-mid);
}

/* TEXTAREA */
.wa-input {
  width: 100%;
  min-height: 160px;
  border: 2px solid var(--border-dark);
  border-radius: var(--radius-sm);
  padding: 14px;
  font-size: 14px;
  font-family: 'JetBrains Mono', monospace;
  line-height: 1.7;
  color: var(--text-body);
  background: #f0fdf4;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.wa-input:focus {
  border-color: var(--green);
  background: white;
  box-shadow: 0 0 0 3px rgba(22,163,74,0.12);
}
.wa-input::placeholder { color: #9ca3af; font-family: 'Sora', sans-serif; }

/* BTN EKSTRAK */
.btn-ekstrak {
  width: 100%;
  height: 52px;
  background: linear-gradient(135deg, #16a34a, #15803d);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 700;
  font-family: 'Sora', sans-serif;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 12px;
  box-shadow: 0 4px 16px rgba(22,163,74,0.3);
  transition: all 0.2s;
}
.btn-ekstrak:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(22,163,74,0.4); }
.btn-ekstrak:active { transform: scale(0.98); }
.btn-ekstrak:disabled { background: #9ca3af; box-shadow: none; cursor: not-allowed; transform: none; }

/* LOADING */
.loading {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 24px;
  color: var(--text-muted);
  font-size: 13px;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border-dark);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* TABEL KONFIRMASI */
.konfirmasi-wrap {
  display: none;
}

.item-konfirmasi {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  overflow: hidden;
  transition: all 0.2s;
}
.item-konfirmasi.matched { border-color: #86efac; }
.item-konfirmasi.manual { border-color: #fde68a; }
.item-konfirmasi.skip { border-color: #e5e7eb; opacity: 0.5; }

.item-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  cursor: pointer;
}
.item-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.icon-match { background: var(--green-light); }
.icon-manual { background: var(--amber-light); }
.icon-skip { background: #f3f4f6; }

.item-info { flex: 1; min-width: 0; }
.item-wa { font-size: 12px; color: var(--text-muted); }
.item-nama { font-size: 14px; font-weight: 600; color: var(--text); }
.item-harga {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--green);
  flex-shrink: 0;
}

.status-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 99px;
  flex-shrink: 0;
}
.badge-match { background: var(--green-light); color: var(--green-dark); }
.badge-manual { background: var(--amber-light); color: var(--amber); }
.badge-skip { background: #f3f4f6; color: #6b7280; }

.item-body {
  padding: 0 14px 14px;
  border-top: 1px solid #f0fdf4;
  display: none;
}
.item-body.open { display: block; }

.field-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  align-items: center;
}
.field-row label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  min-width: 60px;
  flex-shrink: 0;
}
.field-input {
  flex: 1;
  height: 36px;
  border: 1.5px solid var(--border-dark);
  border-radius: 8px;
  padding: 0 10px;
  font-size: 13px;
  font-family: 'Sora', sans-serif;
  color: var(--text);
  background: var(--bg);
  outline: none;
  transition: border-color 0.2s;
}
.field-input:focus { border-color: var(--green); background: white; }

.action-row {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.btn-sm {
  height: 30px;
  padding: 0 12px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
  font-family: 'Sora', sans-serif;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: all 0.15s;
}
.btn-pakai { background: var(--green-light); color: var(--green-dark); border-color: #86efac; }
.btn-manual { background: var(--amber-light); color: var(--amber); border-color: #fde68a; }
.btn-skip { background: #f3f4f6; color: #6b7280; border-color: #e5e7eb; }
.btn-sm:hover { opacity: 0.8; }

/* SUMMARY BAR */
.summary-bar {
  display: none;
  background: linear-gradient(135deg, #14532d, #166534);
  color: white;
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  text-align: center;
}
.sum-val { font-size: 20px; font-weight: 800; }
.sum-lbl { font-size: 10px; color: #86efac; margin-top: 2px; }

/* SIMPAN SECTION */
.simpan-section {
  display: none;
}

.metode-btns {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.metode-btn {
  flex: 1;
  height: 44px;
  border: 2px solid var(--border-dark);
  border-radius: var(--radius-sm);
  background: var(--bg);
  font-size: 12px;
  font-weight: 600;
  font-family: 'Sora', sans-serif;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.metode-btn.active-tunai {
  background: var(--green-light);
  border-color: var(--green);
  color: var(--green-dark);
}
.metode-btn.active-belum {
  background: var(--amber-light);
  border-color: var(--amber);
  color: var(--amber);
}

.field-row-full {
  margin-bottom: 10px;
}
.field-row-full label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.field-row-full input, .field-row-full select {
  width: 100%;
  height: 42px;
  border: 1.5px solid var(--border-dark);
  border-radius: var(--radius-sm);
  padding: 0 12px;
  font-size: 13px;
  font-family: 'Sora', sans-serif;
  color: var(--text);
  background: var(--bg);
  outline: none;
}
.field-row-full input:focus, .field-row-full select:focus {
  border-color: var(--green);
  background: white;
}

/* BTN SIMPAN */
.btn-simpan {
  width: 100%;
  height: 56px;
  background: linear-gradient(135deg, #16a34a, #15803d);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 800;
  font-family: 'Sora', sans-serif;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(22,163,74,0.35);
  transition: all 0.2s;
  margin-top: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.btn-simpan:hover { transform: translateY(-1px); }
.btn-simpan:active { transform: scale(0.98); }
.btn-simpan:disabled { background: #9ca3af; box-shadow: none; cursor: not-allowed; transform: none; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  background: #1a1a1a;
  color: white;
  padding: 12px 22px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
  z-index: 9999;
  white-space: nowrap;
  max-width: 90vw;
  text-overflow: ellipsis;
  overflow: hidden;
}
.toast.show { opacity: 1; }
.toast.success { background: var(--green-dark); }
.toast.error { background: var(--red); }

/* SUCCESS SCREEN */
.success-screen {
  display: none;
  text-align: center;
  padding: 40px 20px;
}
.success-icon {
  width: 80px; height: 80px;
  background: var(--green-light);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  margin: 0 auto 16px;
  animation: popIn 0.4s ease;
}
@keyframes popIn {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.success-title { font-size: 22px; font-weight: 800; color: var(--green-dark); margin-bottom: 6px; }
.success-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
.btn-ulang {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 46px;
  padding: 0 24px;
  border: 2px solid var(--border-dark);
  border-radius: 99px;
  background: var(--surface);
  font-size: 14px;
  font-weight: 600;
  font-family: 'Sora', sans-serif;
  color: var(--green-dark);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-ulang:hover { background: var(--green-light); }

/* MATCH SELECT */
.match-select {
  width: 100%;
  margin-top: 8px;
  padding: 8px 10px;
  border: 1.5px dashed var(--border-dark);
  border-radius: 8px;
  background: #f0fdf4;
  font-size: 12px;
  font-family: 'Sora', sans-serif;
  color: var(--text);
  outline: none;
  cursor: pointer;
}
.match-select:focus { border-color: var(--green); background: white; }

.expand-toggle {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  margin-top: 4px;
  user-select: none;
}

/* Separator */
.sep {
  height: 1px;
  background: var(--border);
  margin: 14px 0;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-content">
    <div class="header-badge">🤖 AI-Powered</div>
    <h1>Input dari WA</h1>
    <p>Paste list belanja → AI ekstrak → langsung simpan ke sistem</p>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- STEP 1: INPUT WA -->
  <div id="step-input">
    <div class="card">
      <div class="card-title"><div class="dot"></div> Teks Pesanan WhatsApp</div>
      <textarea class="wa-input" id="wa-text" placeholder="Paste atau ketik list pesanan di sini...

Contoh:
- minyak yg 2 ltr 2 bungkus
- gula merah 1/2 kg
- gula putih 1 kg
- telor 1 kg
- Supermi 5"></textarea>
      <button class="btn-ekstrak" id="btn-ekstrak" onclick="mulaiEkstrak()">
        ✨ Ekstrak dengan AI
      </button>
    </div>

    <!-- LOADING -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>AI sedang membaca pesanan...</span>
    </div>
  </div>

  <!-- STEP 2: KONFIRMASI -->
  <div class="konfirmasi-wrap" id="step-konfirmasi">

    <div class="card" style="padding: 14px 16px;">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="card-title" style="margin:0"><div class="dot"></div> Hasil Ekstraksi AI</div>
        <button onclick="resetAll()" style="background:none;border:none;font-size:12px;color:var(--text-muted);cursor:pointer;font-family:'Sora',sans-serif">← Ulang</button>
      </div>
    </div>

    <!-- SUMMARY BAR -->
    <div class="summary-bar" id="summary-bar">
      <div class="summary-grid">
        <div><div class="sum-val" id="sum-match">0</div><div class="sum-lbl">Cocok di DB</div></div>
        <div><div class="sum-val" id="sum-manual">0</div><div class="sum-lbl">Input Manual</div></div>
        <div><div class="sum-val" id="sum-total">Rp 0</div><div class="sum-lbl">Total Estimasi</div></div>
      </div>
    </div>

    <!-- DAFTAR ITEM -->
    <div id="item-list"></div>

    <div class="sep"></div>

    <!-- SIMPAN SECTION -->
    <div class="simpan-section" id="simpan-section">
      <div class="card">
        <div class="card-title"><div class="dot"></div> Detail Transaksi</div>

        <div class="field-row-full">
          <label>Nama Pelanggan (opsional)</label>
          <input type="text" id="inp-pelanggan" placeholder="Kosongkan jika tidak diketahui"/>
        </div>

        <div class="field-row-full">
          <label>Metode Pembayaran</label>
          <div class="metode-btns">
            <button class="metode-btn active-tunai" id="btn-tunai" onclick="setMetode('tunai')">💵 Tunai</button>
            <button class="metode-btn" id="btn-belum" onclick="setMetode('belum')">⏳ Bayar Nanti</button>
          </div>
        </div>

        <div class="field-row-full" id="kas-wrap">
          <label>Kas Penerima</label>
          <select id="inp-kas">
            <option value="1">Kas Utama</option>
          </select>
        </div>

        <div class="field-row-full">
          <label>Tanggal Transaksi</label>
          <input type="date" id="inp-tgl"/>
        </div>

        <div style="background:var(--green-light);border-radius:var(--radius-sm);padding:12px 14px;margin-top:4px">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:13px;color:var(--text-body);font-weight:500">Total Penjualan</span>
            <span style="font-size:20px;font-weight:800;color:var(--green-dark);font-family:'JetBrains Mono',monospace" id="total-display">Rp 0</span>
          </div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:3px" id="item-count-display">0 item aktif</div>
        </div>

        <button class="btn-simpan" id="btn-simpan" onclick="simpanTransaksi()">
          💾 Simpan Transaksi
        </button>
      </div>
    </div>
  </div>

  <!-- SUCCESS -->
  <div class="success-screen" id="success-screen">
    <div class="card">
      <div class="success-icon">✅</div>
      <div class="success-title">Transaksi Tersimpan!</div>
      <div class="success-sub" id="success-detail">-</div>
      <button class="btn-ulang" onclick="resetAll()">↩ Input Lagi</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
// ===== CONFIG =====
const SURL = 'https://skltbmcrqutevmtcxqxj.supabase.co';
const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrbHRibWNycXV0ZXZtdGN4cXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzM5ODIsImV4cCI6MjA5MTI0OTk4Mn0._nogUZg5UylVyP45QTGYw69u76pNxGryj9hZORIfE_A';
const { createClient } = supabase;
const sb = createClient(SURL, SKEY);

// ===== STATE =====
let aBarang = [];  // dari DB
let extractedItems = []; // hasil AI
let metode = 'tunai';

const fmt = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const toast = (m, type = '') => {
  const el = document.getElementById('toast');
  el.textContent = m;
  el.className = 'toast show ' + type;
  setTimeout(() => el.className = 'toast', 2800);
};

// ===== INIT =====
window.onload = async () => {
  document.getElementById('inp-tgl').value = new Date().toISOString().slice(0, 10);
  await loadBarang();
  await loadKas();
};

async function loadBarang() {
  const { data } = await sb.from('barang').select('id,nama,harga,stok,satuan,kategori').order('nama');
  aBarang = data || [];
}

async function loadKas() {
  const { data } = await sb.from('kas').select('id,nama,saldo').order('id');
  const sel = document.getElementById('inp-kas');
  sel.innerHTML = (data || []).map(k =>
    `<option value="${k.id}" ${k.id === 1 ? 'selected' : ''}>${k.nama} (${fmt(k.saldo)})</option>`
  ).join('');
}

function setMetode(m) {
  metode = m;
  document.getElementById('btn-tunai').className = 'metode-btn' + (m === 'tunai' ? ' active-tunai' : '');
  document.getElementById('btn-belum').className = 'metode-btn' + (m === 'belum' ? ' active-belum' : '');
  document.getElementById('kas-wrap').style.display = m === 'tunai' ? 'block' : 'none';
}

// ===== EKSTRAK AI =====
async function mulaiEkstrak() {
  const teks = document.getElementById('wa-text').value.trim();
  if (!teks) { toast('Teks pesanan kosong', 'error'); return; }

  document.getElementById('btn-ekstrak').disabled = true;
  document.getElementById('loading').style.display = 'flex';

  // Build daftar produk DB untuk AI
  const produkDB = aBarang
    .filter(b => b.kategori === 'warung' || !b.kategori)
    .map(b => `ID:${b.id} | ${b.nama} | Rp${b.harga} | stok:${b.stok}`)
    .join('\n');

  const prompt = `Kamu adalah asisten kasir warung. Tugas kamu: parse list belanja dari WhatsApp dan cocokkan dengan produk di database.

LIST BELANJA:
${teks}

DATABASE PRODUK (format: ID | nama | harga | stok):
${produkDB}

Tugas:
1. Parse setiap item dari list belanja
2. Cocokkan dengan produk DB (fuzzy match, misal "minyak 2 ltr" → minyak goreng 2L, "gula putih" → Gula Pasir, "royco/roicho sapi" → Royco, "kara/sun kara" → Sun Kara CB, "telor" → Telur)
3. Tentukan qty (angka/satuan dari teks: "2 bungkus" = 2, "1/2 kg" = 0.5, "5 pcs" = 5)

Kembalikan JSON array berikut:
[
  {
    "teks_asli": "teks item dari WA",
    "nama_match": "nama produk di DB (atau null jika tidak cocok)",
    "id_match": angka_id_atau_null,
    "harga": harga_jual_dari_db_atau_0,
    "qty": angka,
    "satuan": "pcs/kg/bungkus/dll",
    "confidence": "high/medium/low",
    "catatan": "keterangan singkat jika perlu"
  }
]

PENTING: 
- Kembalikan HANYA JSON array, tanpa teks lain
- Jika tidak ada match, id_match = null dan harga = 0
- qty harus angka (bukan string)
- Untuk "1/2 kg" = qty 0.5
- "gula merah" = Gula Aren jika ada, atau buat item baru
- "tepung tapioka" = Tepung Tapioka Rose Brand jika ada
- "tepung beras" = cari yang mirip atau null
- "tepung ketan" = cari yang mirip atau null
- "kecap asin" = Kecap Bango atau Kecap ABC
- "supermi" = Supermie Ayam Bawang`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await resp.json();
    const raw = data.content?.[0]?.text || '[]';
    // Strip markdown fences jika ada
    const clean = raw.replace(/```json|```/g, '').trim();
    extractedItems = JSON.parse(clean);
    document.getElementById('loading').style.display = 'none';
    renderKonfirmasi();
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('btn-ekstrak').disabled = false;
    toast('Gagal ekstrak: ' + e.message, 'error');
  }
}

// ===== RENDER KONFIRMASI =====
function renderKonfirmasi() {
  document.getElementById('step-input').style.display = 'none';
  document.getElementById('step-konfirmasi').style.display = 'block';
  document.getElementById('summary-bar').style.display = 'block';
  document.getElementById('simpan-section').style.display = 'block';

  const listEl = document.getElementById('item-list');
  listEl.innerHTML = '';

  extractedItems.forEach((item, i) => {
    const matched = !!item.id_match;
    const el = document.createElement('div');
    el.className = 'item-konfirmasi' + (matched ? ' matched' : ' manual');
    el.id = `item-${i}`;

    // Icon
    const iconClass = matched ? 'icon-match' : 'icon-manual';
    const icon = matched ? '✅' : '⚠️';
    const badgeClass = matched ? 'badge-match' : 'badge-manual';
    const badgeText = matched ? (item.confidence === 'high' ? '✓ Cocok' : '~ Mirip') : 'Input Manual';

    // Harga display
    const hargaTotal = (item.harga || 0) * (item.qty || 1);

    el.innerHTML = `
      <div class="item-header" onclick="toggleItem(${i})">
        <div class="item-icon ${iconClass}">${icon}</div>
        <div class="item-info">
          <div class="item-wa">${item.teks_asli}</div>
          <div class="item-nama">${item.nama_match || '— belum diisi —'}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div class="item-harga">${hargaTotal > 0 ? fmt(hargaTotal) : '—'}</div>
          <span class="status-badge ${badgeClass}">${badgeText}</span>
        </div>
      </div>
      <div class="item-body" id="body-${i}">
        ${renderItemBody(item, i)}
      </div>
    `;
    listEl.appendChild(el);

    // Auto expand item yang butuh perhatian
    if (!matched || item.confidence !== 'high') {
      document.getElementById(`body-${i}`).classList.add('open');
    }
  });

  updateSummary();
}

function renderItemBody(item, i) {
  // Opsi produk DB untuk select
  const opts = aBarang
    .filter(b => b.kategori === 'warung' || !b.kategori)
    .map(b => `<option value="${b.id}" data-harga="${b.harga}" ${b.id === item.id_match ? 'selected' : ''}>${b.nama} — ${fmt(b.harga)}</option>`)
    .join('');

  return `
    <div class="field-row">
      <label>Nama</label>
      <input type="text" class="field-input" id="nama-${i}" value="${item.nama_match || ''}" 
        oninput="updateItem(${i},'nama',this.value)" placeholder="Nama produk"/>
    </div>
    <div style="margin-top:6px">
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">Atau pilih dari database:</div>
      <select class="match-select" onchange="pilihDariDB(${i},this)">
        <option value="">— pilih produk DB —</option>
        ${opts}
      </select>
    </div>
    <div class="field-row" style="margin-top:10px">
      <label>Qty</label>
      <input type="number" class="field-input" id="qty-${i}" value="${item.qty || 1}" min="0.5" step="0.5"
        oninput="updateItem(${i},'qty',parseFloat(this.value)||1)" style="max-width:80px"/>
      <input type="text" class="field-input" id="satuan-${i}" value="${item.satuan || 'pcs'}"
        oninput="updateItem(${i},'satuan',this.value)" style="max-width:70px" placeholder="satuan"/>
      <label>Harga</label>
      <input type="number" class="field-input" id="harga-${i}" value="${item.harga || 0}"
        oninput="updateItem(${i},'harga',parseInt(this.value)||0)"/>
    </div>
    <div class="action-row">
      <button class="btn-sm btn-skip" onclick="skipItem(${i})">✕ Skip</button>
      ${item.id_match ? '<button class="btn-sm btn-pakai" onclick="toggleItem(' + i + ')">✓ Simpan</button>' : ''}
    </div>
    ${item.catatan ? `<div style="font-size:11px;color:var(--text-muted);margin-top:6px">📝 ${item.catatan}</div>` : ''}
  `;
}

function pilihDariDB(i, sel) {
  const id = parseInt(sel.value);
  if (!id) return;
  const b = aBarang.find(x => x.id === id);
  if (!b) return;
  extractedItems[i].id_match = id;
  extractedItems[i].nama_match = b.nama;
  extractedItems[i].harga = b.harga;
  // Update input fields
  document.getElementById(`nama-${i}`).value = b.nama;
  document.getElementById(`harga-${i}`).value = b.harga;
  // Update header
  const card = document.getElementById(`item-${i}`);
  card.className = 'item-konfirmasi matched';
  card.querySelector('.item-nama').textContent = b.nama;
  card.querySelector('.status-badge').textContent = '✓ Dipilih';
  card.querySelector('.status-badge').className = 'status-badge badge-match';
  card.querySelector('.item-icon').className = 'item-icon icon-match';
  card.querySelector('.item-icon').textContent = '✅';
  updateHargaDisplay(i);
  updateSummary();
}

function toggleItem(i) {
  const body = document.getElementById(`body-${i}`);
  body.classList.toggle('open');
}

function updateItem(i, field, val) {
  extractedItems[i][field] = val;
  updateHargaDisplay(i);
  updateSummary();
}

function updateHargaDisplay(i) {
  const item = extractedItems[i];
  const total = (item.harga || 0) * (item.qty || 1);
  const card = document.getElementById(`item-${i}`);
  if (card) card.querySelector('.item-harga').textContent = total > 0 ? fmt(total) : '—';
}

function skipItem(i) {
  extractedItems[i]._skip = !extractedItems[i]._skip;
  const card = document.getElementById(`item-${i}`);
  card.className = 'item-konfirmasi' + (extractedItems[i]._skip ? ' skip' : (extractedItems[i].id_match ? ' matched' : ' manual'));
  updateSummary();
}

function updateSummary() {
  const aktif = extractedItems.filter(x => !x._skip);
  const matched = aktif.filter(x => x.id_match).length;
  const manual = aktif.filter(x => !x.id_match).length;
  const total = aktif.reduce((s, x) => s + (x.harga || 0) * (x.qty || 1), 0);

  document.getElementById('sum-match').textContent = matched;
  document.getElementById('sum-manual').textContent = manual;
  document.getElementById('sum-total').textContent = fmt(total);
  document.getElementById('total-display').textContent = fmt(total);
  document.getElementById('item-count-display').textContent = aktif.length + ' item aktif';
}

// ===== SIMPAN =====
async function simpanTransaksi() {
  const aktif = extractedItems.filter(x => !x._skip);
  if (!aktif.length) { toast('Tidak ada item aktif', 'error'); return; }

  const total = aktif.reduce((s, x) => s + (x.harga || 0) * (x.qty || 1), 0);
  if (!total) { toast('Total 0, cek harga item', 'error'); return; }

  const btn = document.getElementById('btn-simpan');
  btn.disabled = true;
  btn.innerHTML = '⏳ Menyimpan...';

  const pelanggan = document.getElementById('inp-pelanggan').value.trim() || 'Umum';
  const kasId = parseInt(document.getElementById('inp-kas').value) || 1;
  const tgl = document.getElementById('inp-tgl').value || new Date().toISOString().slice(0, 10);
  const tglISO = new Date(tgl + 'T' + new Date().toTimeString().slice(0, 8)).toISOString();

  // Build items
  const items = aktif.map(x => ({
    id: x.id_match || null,
    barang_id: x.id_match || null,
    nama: x.nama_match || x.teks_asli,
    qty: x.qty || 1,
    harga: x.harga || 0,
    hE: x.harga || 0,
    hpp: 0,
    is_manual: !x.id_match
  }));

  const payload = {
    items,
    total,
    bayar: metode === 'tunai' ? total : 0,
    kembali: 0,
    kasir: 'input-ai',
    pelanggan,
    metode_bayar: metode === 'tunai' ? 'tunai' : 'belum',
    status_bayar: metode === 'tunai' ? 'lunas' : 'belum',
    tgl_transaksi: tglISO,
    waktu: tglISO,
    kas_id: metode === 'tunai' ? kasId : null,
    hpp: 0
  };

  try {
    const { data: tx, error } = await sb.from('transaksi').insert([payload]).select().single();
    if (error) throw error;

    // Update stok untuk item yang matched
    for (const x of aktif) {
      if (x.id_match) {
        const b = aBarang.find(a => a.id === x.id_match);
        if (b && b.stok > 0) {
          const newStok = Math.max(0, b.stok - x.qty);
          await sb.from('barang').update({ stok: newStok }).eq('id', x.id_match);
        }
      }
    }

    // Mutasi kas kalau tunai
    if (metode === 'tunai') {
      await sb.from('kas_mutasi').insert([{
        kas_id: kasId,
        tipe: 'masuk',
        kategori: 'penjualan',
        jumlah: total,
        tanggal: tgl,
        keterangan: 'Penjualan WA: ' + pelanggan,
        operator: 'input-ai',
        ref_type: 'transaksi',
        ref_id: tx.id
      }]);
    }

    // Tampilkan sukses
    document.getElementById('step-konfirmasi').style.display = 'none';
    document.getElementById('success-screen').style.display = 'block';
    document.getElementById('success-detail').textContent =
      `#${tx.id} · ${aktif.length} item · ${fmt(total)} · ${pelanggan}`;

  } catch (e) {
    toast('Gagal simpan: ' + e.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '💾 Simpan Transaksi';
  }
}

function resetAll() {
  extractedItems = [];
  document.getElementById('wa-text').value = '';
  document.getElementById('btn-ekstrak').disabled = false;
  document.getElementById('step-input').style.display = 'block';
  document.getElementById('step-konfirmasi').style.display = 'none';
  document.getElementById('success-screen').style.display = 'none';
  document.getElementById('item-list').innerHTML = '';
  document.getElementById('inp-pelanggan').value = '';
  document.getElementById('inp-tgl').value = new Date().toISOString().slice(0, 10);
  loadKas();
}
</script>
