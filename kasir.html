<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Kasir - Warung UBNB</title>
<style>
:root{--green:#1D9E75;--green-dark:#0F6E56;--green-light:#E1F5EE;--red:#E24B4A;--red-light:#FCEBEB;--amber:#BA7517;--amber-light:#FAEEDA;--blue:#185FA5;--blue-light:#E6F1FB;--bg:#F4F6F4;--surface:#fff;--border:rgba(0,0,0,0.09);--text:#1a2e1a;--text-muted:#6b7c6b;--radius:12px;--radius-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{overflow-x:hidden;max-width:100%;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0F6E56,#1D9E75);}
.login-box{background:#fff;border-radius:24px;padding:40px 32px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.15);}
.login-logo{text-align:center;margin-bottom:32px;}
.login-logo .icon{font-size:48px;}
.login-logo h1{font-size:24px;font-weight:800;color:var(--green);margin-top:8px;}
.login-logo p{font-size:13px;color:var(--text-muted);}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:inherit;outline:none;transition:border-color 0.2s;}
.field input:focus{border-color:var(--green);}
.login-err{color:var(--red);font-size:13px;margin-bottom:12px;display:none;}
.btn-login{width:100%;padding:14px;background:var(--green);color:white;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-login:active{background:var(--green-dark);}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh;}
.topbar{background:var(--green);color:white;padding:0 12px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-title{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.user-info{font-size:12px;opacity:0.85;}
.btn-keluar{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:white;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}

/* TABS */
.page-tabs{display:flex;background:white;border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:90;}
.page-tab{flex:1;padding:14px 8px;border:none;background:none;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;font-family:inherit;transition:all 0.2s;}
.page-tab.active{color:var(--green);border-bottom-color:var(--green);}

/* CONTENT */
.page{display:none;padding:12px;}
.page.active{display:block;}

/* PRODUK GRID */
.search-wrap{position:relative;margin-bottom:12px;}
.search-wrap input{width:100%;padding:10px 14px 10px 38px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;outline:none;background:white;}
.search-wrap input:focus{border-color:var(--green);}
.search-wrap::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;}
.kat-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;}
.kat-tab{padding:6px 14px;border:1.5px solid var(--border);border-radius:99px;background:white;font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;}
.kat-tab.active{background:var(--green);color:white;border-color:var(--green);}
.produk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:80px;}
.prod-card{background:white;border-radius:var(--radius-sm);padding:12px;cursor:pointer;border:1.5px solid var(--border);transition:all 0.15s;position:relative;}
.prod-card:active{transform:scale(0.97);border-color:var(--green);}
.prod-ava{width:44px;height:44px;border-radius:8px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--green);margin-bottom:8px;overflow:hidden;}
.prod-ava img{width:100%;height:100%;object-fit:cover;}
.prod-nama{font-size:12px;font-weight:700;line-height:1.3;margin-bottom:4px;}
.prod-harga{font-size:13px;font-weight:800;color:var(--green);}
.prod-stok{font-size:10px;color:var(--text-muted);}
.prod-kat{font-size:10px;padding:2px 6px;border-radius:99px;background:var(--bg);display:inline-block;margin-top:3px;}
.empty{text-align:center;padding:40px 20px;color:var(--text-muted);}
.empty .ei{font-size:40px;margin-bottom:8px;}

/* KERANJANG */
.cart-fab{position:fixed;bottom:20px;right:16px;background:var(--green);color:white;width:56px;height:56px;border-radius:50%;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(29,158,117,0.4);display:none;align-items:center;justify-content:center;z-index:200;}
.cart-fab.show{display:flex;}
.cart-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:white;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;}

/* BOTTOM SHEET */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;display:none;opacity:0;transition:opacity 0.25s;}
.sheet-overlay.open{display:block;opacity:1;}
.sheet{position:fixed;bottom:0;left:0;right:0;background:white;border-radius:20px 20px 0 0;z-index:400;max-height:90vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform 0.3s ease;}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:12px auto 0;}
.sheet-title{font-size:16px;font-weight:800;padding:12px 16px 8px;}
.sheet-body{overflow-y:auto;flex:1;padding:0 12px;}
.sheet-foot{padding:12px 16px;border-top:1px solid var(--border);background:white;}

/* KERANJANG ITEMS */
.krow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);}
.kname{font-weight:600;font-size:13px;flex:1;}
.kprice{font-size:12px;color:var(--text-muted);}
.qty-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.qbtn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);background:white;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qbtn:active{background:var(--green);color:white;border-color:var(--green);}
.total-row{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;margin-bottom:12px;}
.total-big{font-size:20px;color:var(--green);}

/* FORM BELI */
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:4px;}
.form-group input,select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;outline:none;}
.form-group input:focus,.form-group select:focus{border-color:var(--green);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}

/* BUTTONS */
.btn{padding:12px 16px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity 0.15s;}
.btn:active{opacity:0.8;}
.btn.primary{background:var(--green);color:white;}
.btn.sec{background:var(--bg);color:var(--text);}
.btn.full{width:100%;}
.btn.danger{background:var(--red-light);color:var(--red);}

/* SD (searchable dropdown) */
.sd-wrap{position:relative;}
.sd-display{padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;cursor:pointer;background:white;display:flex;justify-content:space-between;align-items:center;}
.sd-display::after{content:'▾';color:var(--text-muted);}
.sd-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:white;border:1.5px solid var(--border);border-radius:var(--radius-sm);z-index:500;max-height:220px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.1);}
.sd-search-box{padding:8px;}
.sd-search-box input{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;}
.sd-option{padding:10px 12px;cursor:pointer;font-size:13px;}
.sd-option:hover{background:var(--bg);}
.sd-empty{padding:10px 12px;color:var(--text-muted);font-size:13px;}
.sd-add{padding:10px 12px;color:var(--green);font-size:13px;font-weight:600;cursor:pointer;border-top:1px solid var(--border);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:600;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:white;border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:16px;}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 12px;}
.modal-title{font-size:16px;font-weight:800;margin-bottom:16px;}
.irow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.irow label{width:80px;font-size:12px;font-weight:600;color:var(--text-muted);flex-shrink:0;}
.irow input,.irow select,.irow textarea{flex:1;padding:9px 11px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;}
.irow input:focus,.irow select:focus{border-color:var(--green);}
.sep{height:1px;background:var(--border);margin:12px 0;}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a2e1a;color:white;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.toast.err{background:var(--red);}

/* SUKSES */
.sukses-wrap{text-align:center;padding:24px 16px;}
.sukses-icon{font-size:64px;margin-bottom:12px;}
.sukses-title{font-size:20px;font-weight:800;color:var(--green);margin-bottom:4px;}
.kembalian-box{background:var(--green-light);border-radius:var(--radius-sm);padding:14px;margin:16px 0;font-size:15px;font-weight:700;color:var(--green);}

/* MARGIN INFO */
#beli-margin-info{font-size:12px;border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:10px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">🛒</div>
      <h1>Kasir UBNB</h1>
      <p>Sistem Kasir Digital</p>
    </div>
    <div class="login-err" id="login-err"></div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="inp-user" placeholder="Username" autocomplete="username"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="inp-pass" placeholder="Password" autocomplete="current-password"/>
    </div>
    <button class="btn-login" onclick="doLogin()">Masuk →</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-title">🛒 Kasir UBNB</div>
    <div class="topbar-right">
      <a href="portal.html" style="display:inline-block;background:rgba(147,51,234,0.2);color:#a78bfa;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;text-decoration:none">🏛️ Portal</a>
      <span class="user-info" id="user-badge"></span>
      <button class="btn-keluar" onclick="keluar()">Keluar</button>
    </div>
  </div>

  <!-- TAB NAVIGASI -->
  <div class="page-tabs">
    <button class="page-tab active" id="tab-jual" onclick="showTab('jual')">🛒 Penjualan</button>
    <button class="page-tab" id="tab-beli" onclick="showTab('beli')">📦 Pembelian</button>
  </div>

  <!-- PAGE JUAL -->
  <div class="page active" id="page-jual">
    <div class="search-wrap">
      <input type="text" id="jual-search" placeholder="Cari produk..." oninput="renderProduk()"/>
    </div>
    <div class="kat-tabs">
      <button class="kat-tab active" onclick="setKat('',this)">Semua</button>
      <button class="kat-tab" onclick="setKat('warung',this)">🏪 Warung</button>
      <button class="kat-tab" onclick="setKat('laundry',this)">🧺 Laundry</button>
      <button class="kat-tab" onclick="setKat('service',this)">🔧 Service</button>
      <button class="kat-tab" onclick="setKat('ppob',this)">⚡ PPOB</button>
    </div>
    <div class="produk-grid" id="produk-grid"></div>
  </div>

  <!-- PAGE BELI -->
  <div class="page" id="page-beli">
    <div style="background:white;border-radius:var(--radius);padding:14px;margin-bottom:12px;">
      <div style="font-weight:700;font-size:14px;margin-bottom:12px;">📦 Input Pembelian</div>
      <div class="form-group">
        <label>Barang</label>
        <div class="sd-wrap">
          <div class="sd-display" id="sdd-bprod" onclick="openSD('bprod')">Pilih barang...</div>
          <div class="sd-dropdown" id="sdl-bprod" style="display:none">
            <div class="sd-search-box"><input type="text" placeholder="Cari barang..." id="sds-bprod" oninput="filterBprod()" onclick="event.stopPropagation()"/></div>
            <div id="sdo-bprod"></div>
          </div>
        </div>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label>Qty beli</label>
          <input type="number" id="beli-qty" placeholder="0" min="1" oninput="updateMarginBeli()"/>
        </div>
        <div class="form-group">
          <label>Harga beli</label>
          <input type="number" id="beli-hb" placeholder="Rp" oninput="updateMarginBeli()"/>
        </div>
      </div>
      <div class="form-group">
        <label>Harga jual</label>
        <input type="number" id="beli-hj" placeholder="Rp" oninput="updateMarginBeli()"/>
      </div>
      <div id="beli-margin-info" style="display:none"></div>
      <div class="form-group">
        <label>Supplier</label>
        <div class="sd-wrap">
          <div class="sd-display" id="sdd-sup" onclick="openSD('sup')">Tanpa supplier</div>
          <div class="sd-dropdown" id="sdl-sup" style="display:none">
            <div class="sd-search-box"><input type="text" placeholder="Cari supplier..." id="sds-sup" oninput="filterSup()" onclick="event.stopPropagation()"/></div>
            <div id="sdo-sup"></div>
          </div>
        </div>
      </div>
      <button class="btn primary full" onclick="tambahItemBeli()">Tambah ke Keranjang Beli</button>
    </div>

    <!-- Keranjang Beli -->
    <div style="background:white;border-radius:var(--radius);padding:14px;margin-bottom:80px;">
      <div style="font-weight:700;font-size:14px;margin-bottom:10px;">🛒 Keranjang Beli</div>
      <div id="beli-list"><div class="empty"><div class="ei">📦</div>Belum ada item</div></div>
      <div class="sep"></div>
      <div class="total-row">
        <span>Total</span>
        <span class="total-big" id="beli-total">Rp 0</span>
      </div>
      <div class="form-group">
        <label>Catatan / No. Faktur</label>
        <input type="text" id="beli-catatan" placeholder="No. faktur (opsional)"/>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn sec" onclick="resetKeranjangBeli()" style="flex:1">Reset</button>
        <button class="btn primary" onclick="simpanBeli()" style="flex:2">💾 Simpan Pembelian</button>
      </div>
    </div>
  </div>

  <!-- FAB Keranjang Jual -->
  <button class="cart-fab" id="cart-fab" onclick="openSheet()">
    🛒
    <span class="cart-badge" id="cart-badge">0</span>
  </button>
</div>

<!-- SHEET KERANJANG JUAL -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()"></div>
<div class="sheet" id="cart-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">🛒 Keranjang Jual</div>
    <!-- Pelanggan -->
    <div class="sd-wrap" style="margin:0 4px 8px;padding:0 12px;">
      <div class="sd-display" id="sdd-pel" onclick="openSD('pel')" style="border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;background:white;cursor:pointer;">👤 Pelanggan (opsional)</div>
      <div class="sd-dropdown" id="sdl-pel" style="display:none">
        <div class="sd-search-box"><input type="text" placeholder="Cari anggota UBNB..." id="sds-pel" oninput="filterPel()" onclick="event.stopPropagation()"/></div>
        <div id="sdo-pel"></div>
      </div>
    </div>
  <div class="sheet-body">
    <div id="cart-list"></div>
  </div>
  <div class="sheet-foot">
    <div class="total-row">
      <span>Total</span>
      <span class="total-big" id="cart-total">Rp 0</span>
    </div>

    <!-- Metode Bayar -->
    <div style="display:flex;gap:6px;margin-bottom:10px;">
      <button class="btn sec" id="mbt-tunai" onclick="setMetode('tunai')" style="flex:1;font-size:12px;">💵 Tunai</button>
      <button class="btn sec" id="mbt-transfer" onclick="setMetode('transfer')" style="flex:1;font-size:12px;">💳 Transfer</button>
      <button class="btn sec" id="mbt-belum" onclick="setMetode('belum')" style="flex:1;font-size:12px;">📋 Belum</button>
    </div>
    <div id="bayar-wrap" style="margin-bottom:10px;">
      <input type="number" id="jual-bayar" placeholder="Nominal bayar (Rp)" style="width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;outline:none;" oninput="updateKembalian()"/>
      <div id="kembalian-info" style="font-size:13px;color:var(--green);font-weight:700;margin-top:6px;"></div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn danger" onclick="resetJual()" style="flex:1">Batal</button>
      <button class="btn primary" onclick="bayar()" style="flex:2">✅ Bayar</button>
    </div>
  </div>
</div>

<!-- MODAL LAUNDRY FORM -->
<div class="modal-overlay" id="modal-laundry">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">🧺 Detail Laundry</div>
    <input type="hidden" id="lf-id"/>
    <div class="irow"><label>Item</label><input type="text" id="lf-nama" readonly style="background:var(--bg)"/></div>
    <div class="irow"><label>Berat (kg)</label><input type="number" id="lf-berat" placeholder="0" step="0.5" min="0.5" oninput="hitungLaundry()"/></div>
    <div id="lf-total" style="padding:10px;background:var(--green-light);border-radius:var(--radius-sm);font-weight:700;color:var(--green);margin-bottom:10px;display:none"></div>
    <div class="irow"><label>Catatan</label><textarea id="lf-catatan" rows="2" style="flex:1;padding:8px;border:1.5px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;outline:none;"></textarea></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn sec" onclick="closeMod('modal-laundry')" style="flex:1">Batal</button>
      <button class="btn primary" onclick="simpanLaundry()" style="flex:2">Tambah</button>
    </div>
  </div>
</div>

<!-- MODAL SERVICE FORM -->
<div class="modal-overlay" id="modal-service">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">🔧 Detail Service</div>
    <input type="hidden" id="sf-id"/>
    <div class="irow"><label>Service</label><input type="text" id="sf-nama" readonly style="background:var(--bg)"/></div>
    <div class="irow">
      <label>Jenis</label>
      <select id="sf-jenis" style="flex:1;padding:9px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;">
        <option value="motor">🏍️ Motor</option>
        <option value="ac">❄️ AC</option>
      </select>
    </div>
    <div class="irow"><label>Merk</label><input type="text" id="sf-merk" placeholder="Honda, Daikin..."/></div>
    <div class="irow"><label>No. Unit</label><input type="text" id="sf-nounit" placeholder="B 1234 XYZ / SN-xxx"/></div>
    <div class="irow"><label>Keluhan</label><textarea id="sf-keluhan" rows="2" style="flex:1;padding:8px;border:1.5px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;outline:none;"></textarea></div>
    <div class="irow"><label>Teknisi</label><input type="text" id="sf-teknisi" placeholder="Nama teknisi"/></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn sec" onclick="closeMod('modal-service')" style="flex:1">Batal</button>
      <button class="btn primary" onclick="simpanService()" style="flex:2">Tambah</button>
    </div>
  </div>
</div>

<!-- MODAL LEVEL HARGA -->
<div class="modal-overlay" id="modal-level">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">🏷️ Pilih Level Harga</div>
    <input type="hidden" id="lv-id"/>
    <div id="lv-body"></div>
    <button class="btn sec full" onclick="closeMod('modal-level')" style="margin-top:4px">Batal</button>
  </div>
</div>

<!-- TOAST -->

function setKat(kat,btn){

  document.querySelectorAll('.kat-tab').forEach(b=>b.classList.remove('active'));

function renderProduk(){
  const q=(document.getElementById('jual-search').value||'').toLowerCase();
  let list=aB.filter(b=>b.kategori!=='ppob'||katFilter==='ppob');
  if(katFilter)list=list.filter(b=>b.kategori===katFilter||(katFilter===''&&b.kategori!=='ppob'));
  if(q)list=list.filter(b=>(b.nama||'').toLowerCase().includes(q)||(b.barcode||'').includes(q));
  list.sort((a,b)=>{
    if(a.kategori==='warung'||!a.kategori){
      const isWarungB=b.kategori==='warung'||!b.kategori;
      if(isWarungB){
        // Keduanya warung: ada stok dulu, lalu A-Z
        const adaA=(a.stok||0)>0?0:1;
        const adaB=(b.stok||0)>0?0:1;
        if(adaA!==adaB)return adaA-adaB;
      }
    }
    return a.nama.localeCompare(b.nama);
  });

  const el=document.getElementById('produk-grid');
  if(!list.length){el.innerHTML='<div class="empty"><div class="ei">📦</div>Tidak ada produk</div>';return;}

  const catIcons={warung:'🏪',ppob:'⚡',laundry:'🧺',service:'🔧'};
  const nonStokKat=['ppob','laundry','service'];

  el.innerHTML=list.map(b=>{
    const initials=(b.nama||'').substring(0,2).toUpperCase();
    const ava=b.foto_url?`<img src="${b.foto_url}" onerror="this.parentElement.innerHTML='${initials}'">`:`${initials}`;
    const nonStok=nonStokKat.includes(b.kategori);
    const stokBadge=nonStok?'':(b.stok<=0?`<div class="prod-stok" style="color:var(--red)">Habis</div>`:
      b.stok<=5?`<div class="prod-stok" style="color:var(--amber)">${b.stok} tersisa</div>`:
      `<div class="prod-stok">${b.stok} ${b.satuan||'pcs'}</div>`);
    const catBadge=b.kategori&&b.kategori!=='warung'?`<span class="prod-kat">${catIcons[b.kategori]||''} ${b.kategori}</span>`:'';
    return `<div class="prod-card" onclick="pilihProduk(${b.id})">
      <div class="prod-ava">${ava}</div>
      <div class="prod-nama">${b.nama}</div>
      <div class="prod-harga">${fmt(b.harga)}</div>
      ${stokBadge}${catBadge}
    </div>`;
  }).join('');
}

// ===== PILIH PRODUK =====
function pilihProduk(id){
  const b=aB.find(x=>x.id===id);if(!b)return;
  const nonStok=['ppob','laundry','service'].includes(b.kategori);
  if(b.stok<=0&&!nonStok){toast('Stok habis!',true);return;}

  if(b.kategori==='laundry'){openLaundryForm(b);return;}
  if(b.kategori==='service'){openServiceForm(b);return;}
  if(b.harga_levels&&b.harga_levels.length>0){openLevelPicker(b);return;}

  tambahKR({id:b.id,nama:b.nama,harga:b.harga,hE:b.harga,qty:1,kategori:b.kategori});
}

function tambahKR(item){
  const ex=KR.find(x=>x.id===item.id&&x._lvIdx===item._lvIdx);

  else{KR.push({...item,qty:item.qty||1});}

  toast(item.nama+' ditambahkan');

}

// ===== BAYAR =====
function setMetode(m){
  metodeBayar=m;
  ['tunai','transfer','belum'].forEach(x=>{
    const btn=document.getElementById('mbt-'+x);
    btn.className='btn '+(x===m?'primary':'sec');
    btn.style.flex='1';btn.style.fontSize='12px';
  });
  document.getElementById('bayar-wrap').style.display=m==='belum'?'none':'block';
}

function updateKembalian(){
  const total=KR.reduce((s,k)=>s+k.hE*k.qty,0);
  const bayar=parseInt(document.getElementById('jual-bayar').value)||0;
  const el=document.getElementById('kembalian-info');
  if(metodeBayar!=='belum'&&bayar>0){
    const kembalian=bayar-total;
    el.textContent=kembalian>=0?`Kembalian: ${fmt(kembalian)}`:`Kurang: ${fmt(Math.abs(kembalian))}`;
    el.style.color=kembalian>=0?'var(--green)':'var(--red)';
  } else el.textContent='';
}

async function bayar(){
  if(!KR.length){toast('Keranjang kosong',true);return;}
  const total=KR.reduce((s,k)=>s+k.hE*k.qty,0);
  const bayarVal=metodeBayar==='belum'?0:parseInt(document.getElementById('jual-bayar').value)||0;
  if(metodeBayar!=='belum'&&bayarVal<total){toast('Uang kurang!',true);return;}

  const ps=sdSel.pel;
  const pelNama=ps?.label||'Umum';
  const pelId=ps?.id||null;
  const anggotaId=ps?.anggota_id||null;
  const items=KR.map(k=>({id:k.id,nama:k.nama,qty:k.qty,harga:k.hE,hE:k.hE,dI:0,subtotal:k.hE*k.qty}));

  const payload={items,total,bayar:bayarVal,kembali:Math.max(0,bayarVal-total),kasir:CU.username,
    pelanggan:pelNama,pelanggan_id:pelId,anggota_id:anggotaId,metode_bayar:metodeBayar,
    status_bayar:metodeBayar==='belum'?'belum':'lunas',waktu:nowISO(),tgl_transaksi:nowISO()};

  const{data,error}=await sb.from('transaksi').insert([payload]).select().single();
  if(error){toast('Gagal: '+error.message,true);return;}

  // Update stok warung saja
  for(const k of KR){
    if(['ppob','laundry','service'].includes(k.kategori))continue;
    const b=aB.find(x=>x.id===k.id);
    if(b){await sb.from('barang').update({stok:Math.max(0,b.stok-(k.qty*(k._qtyPerUnit||1)))}).eq('id',b.id);}
  }

  // Simpan tracking laundry/service
  for(let i=0;i<KR.length;i++){
    const k=KR[i];
    if(k._laundryData){
      await sb.from('laundry_items').insert([{transaksi_id:data.id,item_idx:i,nama_item:k.nama,berat:k._laundryData.berat,status:'antri',tgl_masuk:nowISO(),catatan:k._laundryData.catatan||null,nama_pelanggan:pelNama,total_harga:k.hE}]);
    }
    if(k._serviceData){
      const sd=k._serviceData;
      await sb.from('service_items').insert([{transaksi_id:data.id,item_idx:i,jenis:sd.jenis,nama_item:k.nama,merk:sd.merk||null,no_unit:sd.no_unit||null,keluhan:sd.keluhan||null,status:'antri',teknisi:sd.teknisi||null,tgl_masuk:nowISO(),nama_pelanggan:pelNama,total_harga:k.hE}]);
    }
  }

  toast('Transaksi berhasil! '+fmt(total));
  closeSheet();
  resetJual();
  await lB();
  renderProduk();
}

// ===== KERANJANG BELI =====
function tambahItemBeli(){
  const p=sdSel.bprod;if(!p){toast('Pilih barang dulu',true);return;}
  const qty=parseFloat(document.getElementById('beli-qty').value)||0;
  const hb=parseInt(document.getElementById('beli-hb').value)||0;
  const hj=parseInt(document.getElementById('beli-hj').value)||0;
  if(qty<=0||hb<=0||hj<=0){toast('Qty, harga beli, harga jual wajib diisi',true);return;}
  const b=aB.find(x=>x.id===p.id);if(!b)return;

  const ex=KB.find(x=>x.id===p.id&&x.hb===hb);
  if(ex){ex.qty+=qty;ex.total=ex.qty*ex.hb;}
  else KB.push({id:p.id,nama:b.nama,qty,hb,hj,total:qty*hb});

  document.getElementById('beli-qty').value='';
  document.getElementById('beli-hb').value='';
  document.getElementById('sdd-bprod').textContent='Pilih barang...';
  sdSel.bprod=null;
  document.getElementById('beli-margin-info').style.display='none';
  renderKeranjangBeli();
  toast(b.nama+' ditambahkan');
}

function renderKeranjangBeli(){
  const el=document.getElementById('beli-list');
  const total=KB.reduce((s,k)=>s+k.total,0);
  document.getElementById('beli-total').textContent=fmt(total);
  if(!KB.length){el.innerHTML='<div class="empty"><div class="ei">📦</div>Belum ada item</div>';return;}
  el.innerHTML=KB.map((k,i)=>`
    <div class="krow">
      <div style="flex:1">
        <div class="kname">${k.nama}</div>
        <div class="kprice">Beli: ${fmt(k.hb)} | Jual: ${fmt(k.hj)}</div>
      </div>
      <div class="qty-ctrl">
        <button class="qbtn" onclick="ubahQtyBeli(${i},-1)">−</button>
        <span style="font-weight:700;min-width:20px;text-align:center">${fmtQty(k.qty)}</span>
        <button class="qbtn" onclick="ubahQtyBeli(${i},1)">+</button>
      </div>
    </div>`).join('');
}

function ubahQtyBeli(i,d){KB[i].qty=Math.max(0.1,KB[i].qty+d);KB[i].total=KB[i].qty*KB[i].hb;if(KB[i].qty<=0)KB.splice(i,1);renderKeranjangBeli();}
function resetKeranjangBeli(){KB=[];sdSel.sup=null;document.getElementById('sdd-sup').textContent='Tanpa supplier';document.getElementById('beli-catatan').value='';renderKeranjangBeli();}

function updateMarginBeli(){
  const hb=parseInt(document.getElementById('beli-hb').value)||0;
  const hj=parseInt(document.getElementById('beli-hj').value)||0;
  const el=document.getElementById('beli-margin-info');
  if(hb>0&&hj>0){
    const m=((hj-hb)/hb*100).toFixed(1);
    el.style.display='block';
    el.style.background=m<0?'var(--red-light)':'var(--green-light)';
    el.style.color=m<0?'var(--red)':'var(--green)';
    el.textContent=`Margin: ${m}% (${fmt(hj-hb)}/item)`;
  } else el.style.display='none';
}

async function simpanBeli(){
  if(!KB.length){toast('Keranjang beli kosong',true);return;}
  const total=KB.reduce((s,k)=>s+k.total,0);
  const sup=sdSel.sup;
  const items=KB.map(k=>({barang_id:k.id,nama:k.nama,qty:k.qty,harga_beli:k.hb,harga_jual:k.hj,subtotal:k.total}));
  const catatan=document.getElementById('beli-catatan').value;

  const{data,error}=await sb.from('pembelian').insert([{items,total,supplier:sup?.label||null,supplier_id:sup?.id||null,catatan,kasir:CU.username,tgl_beli:nowISO()}]).select().single();
  if(error){toast('Gagal: '+error.message,true);return;}

  // Update stok
  for(const k of KB){
    const b=aB.find(x=>x.id===k.id);
    if(b){
      await sb.from('barang').update({stok:b.stok+k.qty,harga:k.hj,harga_beli:k.hb}).eq('id',k.id);
      await sb.from('stok_batch').insert([{barang_id:k.id,qty_awal:k.qty,qty_sisa:k.qty,harga_beli:k.hb,harga_jual:k.hj,tgl_masuk:nowISO()}]);
    }
  }

  toast('Pembelian berhasil! '+fmt(total));
  resetKeranjangBeli();
  await lB();
  renderProduk();
  renderBprodDropdown();
}

    ...aSahamAnggota.map(a=>({id:null,anggota_id:a.id,label:a.nama,sub:a.no_anggota+' · '+a.kelompok}))
  ];
  document.getElementById('sdo-pel').innerHTML=items.map(i=>`<div class="sd-option" onclick='selSD("pel",${JSON.stringify(i)})'>${i.anggota_id?'⭐ ':''}${i.label}${i.sub?`<div style="font-size:10px;opacity:0.7">${i.sub}</div>`:''}</div>`).join('');
}
function renderSupDropdown(){
  const items=[{id:null,label:'Tanpa supplier'},...aSup.map(s=>({id:s.id,label:s.nama}))];
  document.getElementById('sdo-sup').innerHTML=items.map(i=>`<div class="sd-option" onclick='selSD("sup",${JSON.stringify(i)})'>${i.label}</div>`).join('');
}
function renderBprodDropdown(){
  const items=aB.map(b=>({id:b.id,label:b.nama}));
  document.getElementById('sdo-bprod').innerHTML=items.map(i=>`<div class="sd-option" onclick='selSD("bprod",${JSON.stringify(i)})'>${i.label}</div>`).join('');
}
function filterPel(){const q=(document.getElementById('sds-pel').value||'').toLowerCase();document.querySelectorAll('#sdo-pel .sd-option').forEach(el=>{el.style.display=el.textContent.toLowerCase().includes(q)?'':'none';});}
function filterSup(){const q=(document.getElementById('sds-sup').value||'').toLowerCase();document.querySelectorAll('#sdo-sup .sd-option').forEach(el=>{el.style.display=el.textContent.toLowerCase().includes(q)?'':'none';});}
function filterBprod(){const q=(document.getElementById('sds-bprod').value||'').toLowerCase();document.querySelectorAll('#sdo-bprod .sd-option').forEach(el=>{el.style.display=el.textContent.toLowerCase().includes(q)?'':'none';});}

// ===== BOTTOM SHEET =====
function openSheet(){document.getElementById('sheet-overlay').classList.add('open');document.getElementById('cart-sheet').classList.add('open');renderKeranjang();}
function closeSheet(){document.getElementById('sheet-overlay').classList.remove('open');document.getElementById('cart-sheet').classList.remove('open');}

// ===== MODAL =====
function openMod(id){document.getElementById(id).style.display='flex';}
function closeMod(id){document.getElementById(id).style.display='none';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-overlay[style*="flex"]').forEach(m=>m.style.display='none');});
</script>
</body>
