<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>KBM Perwira - UBNB</title>
<style>
:root{
  --green:#1a6640;--green-dark:#0f4428;--green-light:#e8f5ee;
  --gold:#c9a84c;--gold-dark:#9a7830;--gold-light:#fdf6e3;
  --blue:#1e5fa8;--blue-light:#dbeafe;
  --red:#dc2626;--red-light:#fee2e2;
  --amber:#d97706;--amber-light:#fef3c7;
  --purple:#7c3aed;--purple-light:#ede9fe;
  --bg:#f5f3ee;--surface:#ffffff;--surface2:#faf8f4;
  --border:#e0d8cc;--border-light:#ede8df;
  --text:#1c1a16;--text-2:#4a4540;--text-muted:#8a8078;
  --radius:12px;--radius-sm:8px;--radius-xs:5px;
  --shadow:0 2px 12px rgba(0,0,0,0.07);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans','Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;}

/* ===== LOGIN ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--green-dark) 0%,var(--green) 50%,#2d8a55 100%);padding:20px;}
.login-box{background:white;border-radius:18px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,0.25);}
.login-logo{text-align:center;margin-bottom:22px;}
.login-logo .icon{width:60px;height:60px;background:var(--gold-light);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:30px;border:2px solid #f0d898;}
.login-logo h1{font-size:18px;color:var(--green-dark);font-weight:800;}
.login-logo p{font-size:11px;color:var(--text-muted);margin-top:3px;}
.role-tabs{display:flex;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:18px;gap:2px;}
.role-tab{flex:1;padding:8px 4px;border:none;background:transparent;color:var(--text-muted);font-weight:700;font-size:11px;border-radius:6px;cursor:pointer;font-family:inherit;}
.role-tab.active{background:white;color:var(--green);box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:5px;}
.field input{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;outline:none;transition:border .15s;}
.field input:focus{border-color:var(--green);}
.btn-login{width:100%;padding:11px;background:var(--green);color:white;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;}
.btn-login:hover{background:var(--green-dark);}
.login-err{color:var(--red);font-size:12px;margin-top:8px;text-align:center;display:none;background:var(--red-light);padding:7px;border-radius:5px;}
.login-info{font-size:11px;color:var(--text-muted);text-align:center;margin-top:14px;line-height:1.5;}

/* ===== APP ===== */
#app{display:none;flex-direction:column;min-height:100vh;}
.topbar{background:linear-gradient(135deg,var(--green-dark),var(--green));color:white;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}
.topbar-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#user-badge{background:rgba(255,255,255,0.18);padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;}
#role-badge{background:var(--gold);color:var(--green-dark);padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;}
#scope-badge{background:rgba(255,255,255,0.25);padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;}
.btn-keluar{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:white;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;}

/* ===== TABS ===== */
.page-tabs{display:flex;background:white;border-bottom:2px solid var(--border);position:sticky;top:46px;z-index:90;overflow-x:auto;}
.page-tab{flex:1;min-width:80px;padding:12px 6px;border:none;background:none;font-size:11px;font-weight:700;color:var(--text-muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:inherit;white-space:nowrap;}
.page-tab.active{color:var(--green);border-bottom-color:var(--green);}

.page{display:none;padding:12px;}
.page.active{display:block;}

/* ===== CARD ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;}
.card-title{font-size:13px;font-weight:800;color:var(--green-dark);margin-bottom:10px;display:flex;align-items:center;gap:6px;}

/* ===== STAT PILLS ===== */
.stats-pill{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center;}
.stat-pill{display:inline-flex;align-items:center;gap:5px;background:white;border:1px solid var(--border);border-radius:99px;padding:5px 12px;font-size:11px;font-weight:600;color:var(--text-2);box-shadow:var(--shadow);}
.stat-pill .v{font-weight:800;color:var(--green-dark);font-size:13px;}

/* ===== BUTTONS ===== */
.btn{padding:8px 14px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--green);color:white;}
.btn-primary:hover{background:var(--green-dark);}
.btn-secondary{background:white;color:var(--text);border:1.5px solid var(--border);}
.btn-danger{background:var(--red);color:white;}
.btn-amber{background:#fef3c7;border:1.5px solid var(--amber);color:var(--amber);}
.btn-sm{padding:5px 10px;font-size:11px;}

/* ===== TABLE ===== */
.tbl{width:100%;border-collapse:collapse;font-size:12px;background:white;}
.tbl th{background:var(--green-light);color:var(--green-dark);font-weight:700;padding:8px 10px;text-align:left;border-bottom:1.5px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:0.3px;}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--border-light);}
.tbl tr:hover{background:var(--surface2);}

/* ===== BADGE ===== */
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;}
.badge-green{background:var(--green-light);color:var(--green-dark);}
.badge-gold{background:var(--gold-light);color:var(--gold-dark);}
.badge-blue{background:var(--blue-light);color:var(--blue);}
.badge-red{background:var(--red-light);color:var(--red);}
.badge-gray{background:var(--bg);color:var(--text-muted);}

/* ===== MODAL ===== */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:white;border-radius:var(--radius);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,0.3);}
.modal-header{padding:14px 18px;border-bottom:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-header h3{font-size:14px;font-weight:800;color:var(--green-dark);}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);}
.modal-body{padding:18px;}
.modal-footer{padding:12px 18px;border-top:1.5px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}

/* ===== SEARCH ===== */
.search-box{margin-bottom:10px;}
.search-box input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none;}

/* ===== EMPTY STATE ===== */
.empty{text-align:center;padding:40px 20px;color:var(--text-muted);}
.empty .icon{font-size:48px;opacity:0.4;margin-bottom:8px;}

/* ===== LOADING ===== */
.loader{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== UTILITY ===== */
.flex{display:flex;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.gap-1{gap:4px;}.gap-2{gap:8px;}.gap-3{gap:12px;}
.mt-1{margin-top:4px;}.mt-2{margin-top:8px;}.mt-3{margin-top:12px;}
.mb-1{margin-bottom:4px;}.mb-2{margin-bottom:8px;}.mb-3{margin-bottom:12px;}
.text-muted{color:var(--text-muted);}
.text-sm{font-size:11px;}.text-xs{font-size:10px;}
.fw-700{font-weight:700;}.fw-800{font-weight:800;}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green-dark);color:white;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:600;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,0.2);opacity:0;pointer-events:none;transition:opacity 0.2s,transform 0.2s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.toast.error{background:var(--red);}
.toast.warn{background:var(--amber);}

/* ===== MOBILE OPTIMIZATIONS ===== */
@media (max-width:600px){
  .page{padding:10px;}
  .card{padding:12px;}
  .modal{max-width:100%;margin:0;border-radius:var(--radius) var(--radius) 0 0;align-self:flex-end;}
  .modal-overlay{align-items:flex-end;padding:0;}
}
</style>
</head>
<body>

<!-- ====================================================== -->
<!-- LOGIN SCREEN                                            -->
<!-- ====================================================== -->
<div id="login-screen" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">📚</div>
      <h1>KBM Perwira</h1>
      <p>Kegiatan Belajar Mengajar Generus<br/>UBNB Desa Perwira</p>
    </div>

    <!-- ROLE SELECTOR -->
    <div class="role-tabs">
      <button id="tab-pengurus" class="role-tab active" onclick="switchRole('pengurus')">👔 Pengurus</button>
      <button id="tab-guru" class="role-tab" onclick="switchRole('guru')">👨‍🏫 Guru</button>
      <button id="tab-keluarga" class="role-tab" onclick="switchRole('keluarga')">👨‍👩‍👧 Keluarga</button>

    <div id="form-staff">

        <label>Kode Akses</label>
        <input type="password" id="inp-kel-kode" placeholder="6 digit"/>

<!-- ====================================================== -->
<!-- APP (after login)                                       -->
<!-- ====================================================== -->
<div id="app">
  <!-- TOPBAR -->
  <div class="topbar">

    <div class="topbar-right">
      <span id="role-badge">—</span>
      <span id="scope-badge" style="display:none;">—</span>
      <span id="user-badge">—</span>
      <button class="btn-keluar" onclick="keluar()">Keluar</button>
    </div>
  </div>

  <!-- DYNAMIC TABS (rendered per role) -->
  <div id="page-tabs" class="page-tabs"></div>

  <!-- PAGES (rendered per role) -->
  <div id="pages"></div>
</div>

<!-- ====================================================== -->
<!-- MODALS                                                  -->
<!-- ====================================================== -->

<!-- MODAL: Assign Murid ke Jenjang -->
<div id="modal-assign" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3>📥 Daftarkan Murid ke Jenjang</h3>
      <button class="modal-close" onclick="closeModal('modal-assign')">×</button>
    </div>

<!-- MODAL: Naik Kelas -->
<div id="modal-naik" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3>⬆️ Naik Kelas / Pindah Jenjang</h3>
      <button class="modal-close" onclick="closeModal('modal-naik')">×</button>
    </div>
    <div class="modal-body">
      <div id="modal-naik-body"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-naik')">Batal</button>
      <button class="btn btn-primary" onclick="submitNaikKelas()">Konfirmasi</button>
    </div>

</div>

<!-- MODAL: Form Jenjang (CRUD) -->
<div id="modal-jenjang" class="modal-overlay">

          <input type="number" id="f-jenjang-usia-min" min="0"/>

          <label>Usia Max</label>
          <input type="number" id="f-jenjang-usia-max" min="0"/>

  </div>
</div>

<!-- MODAL: Assign Guru ke Jenjang -->
<div id="modal-guru" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3>👨‍🏫 Tugaskan Guru</h3>
      <button class="modal-close" onclick="closeModal('modal-guru')">×</button>
    </div>
    <div class="modal-body">
      <div id="modal-guru-body"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-guru')">Batal</button>
      <button class="btn btn-primary" onclick="submitGuru()">Simpan</button>
    </div>
  </div>
</div>

<!-- TOAST NOTIFICATION -->
<div id="toast" class="toast"></div>

<!-- LIBRARIES & SCRIPTS                                     -->
<!-- ====================================================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ubnb-auth.js"></script>
<script>
// ===== KONFIGURASI =====
const SURL='https://skltbmcrqutevmtcxqxj.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrbHRibWNycXV0ZXZtdGN4cXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzM5ODIsImV4cCI6MjA5MTI0OTk4Mn0._nogUZg5UylVyP45QTGYw69u76pNxGryj9hZORIfE_A';
const {createClient}=supabase;
const sb=createClient(SURL,SKEY);

// ===== STATE GLOBAL =====
let CU=null;                          // Current user object
let CURRENT_ROLE='pengurus';          // pengurus | guru | keluarga
let LOGIN_ROLE='pengurus';            // pilihan tab login
let CURRENT_TAB='dashboard';          // tab aktif
let DATA={                            // cache data
  jenjang:[],
  murid:[],
  calonMurid:[],
  guru:[],
  jamaahMap:{},                       // did -> jamaah object (untuk lookup cepat)
};

// Mapping kelompok: users.kelompok_scope='PW4' <-> jamaah_desa.kelompok='4'
const KELOMPOK_LIST=[
  {kode:'1',singkat:'PW1',lengkap:'Perwirasari'},
  {kode:'2',singkat:'PW2',lengkap:'Alinda'},
  {kode:'3',singkat:'PW3',lengkap:'Bulak Perwira'},
  {kode:'4',singkat:'PW4',lengkap:'Vila Indah Permai'},
];
function scopeToKode(scope){
  if(!scope)return null;
  const m=KELOMPOK_LIST.find(k=>k.singkat===scope);
  return m?m.kode:scope;  // fallback: return as-is
}
function kodeToSingkat(kode){
  if(!kode)return '';
  const m=KELOMPOK_LIST.find(k=>k.kode===String(kode));
  return m?m.singkat:String(kode);
}

// ===== UTILITY =====
function $(id){return document.getElementById(id);}
function el(tag,attrs={},...children){
  const e=document.createElement(tag);
  Object.entries(attrs||{}).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k.startsWith('on'))e[k.toLowerCase()]=v;
    else if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else e.setAttribute(k,v);
  });
  children.flat().forEach(c=>{
    if(c==null)return;
    if(typeof c==='string'||typeof c==='number')e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(d){if(!d)return'';const dt=new Date(d);return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});}
function calcUsia(tgl){if(!tgl)return null;const d=new Date(tgl),n=new Date();let a=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a;}
function toast(msg,type=''){const t=$('toast');t.textContent=msg;t.className='toast '+(type?type:'')+' show';setTimeout(()=>t.classList.remove('show'),2500);}
function showModal(id){$(id).classList.add('show');}
function closeModal(id){$(id).classList.remove('show');}
function setLE(m){const e=$('login-err');e.textContent=m;e.style.display=m?'block':'none';}

// ===== LOGIN =====
function switchRole(role){
  LOGIN_ROLE=role;
  ['pengurus','guru','keluarga'].forEach(r=>{
    $('tab-'+r).classList.toggle('active',r===role);
  });
  // Pengurus & guru pakai form staff, keluarga pakai form keluarga
  $('form-staff').style.display=(role==='keluarga')?'none':'block';
  $('form-keluarga').style.display=(role==='keluarga')?'block':'none';
  setLE('');
}

async function doLoginStaff(){
  const u=$('inp-user').value.trim();
  const p=$('inp-pass').value.trim();
  if(!u||!p){setLE('Isi username dan password');return;}
  try{
    const userData=await UBNBAuth.login(sb,u,p);
    // Ambil kelompok_scope
    const {data:userFull}=await sb.from('users').select('kelompok_scope,role').eq('id',userData.id).single();
    if(userFull){
      userData.kelompok_scope=userFull.kelompok_scope;
      userData.role=userFull.role||userData.role;
    }
    userData._login_as=LOGIN_ROLE;  // simpan tab login yang dipilih
    
    // Validasi: kalau pilih tab "guru" tapi role-nya bukan guru/admin, tolak
    if(LOGIN_ROLE==='guru'){
      const isGuru=['guru','pengurus_desa','pengurus_kelompok','pemilik','admin'].includes(userData.role);
      if(!isGuru){setLE('User Anda tidak memiliki akses guru');return;}
    }
    
    CU=UBNBAuth.saveSession('wu_kbm_perwira',userData);
    CU.kelompok_scope=userData.kelompok_scope;
    CU._login_as=LOGIN_ROLE;
    UBNBAuth.saveSSO(CU);
    init();
  }catch(e){setLE(e.message||'Username atau password salah');}
}

async function doLoginKeluarga(){
  const nama=$('inp-kel-nama').value.trim();
  const kode=$('inp-kel-kode').value.trim();
  if(!nama||!kode){setLE('Isi nama keluarga dan kode akses');return;}
  try{
    const {data,error}=await sb.from('keluarga_akses')
      .select('*')
      .ilike('nama_keluarga',nama)
      .eq('kode_akses',kode)
      .maybeSingle();
    if(error)throw error;
    if(!data){setLE('Nama keluarga atau kode akses salah');return;}
    CU={
      _login_as:'keluarga',
      nama_keluarga:data.nama_keluarga,
      kode_akses:data.kode_akses,
      did_kk:data.did_kk||null,
    };
    sessionStorage.setItem('wu_kbm_perwira_keluarga',JSON.stringify(CU));
    init();
  }catch(e){setLE('Gagal login: '+(e.message||e));}
}

function keluar(){
  if(typeof UBNBAuth!=='undefined')UBNBAuth.clearAllSessions();
  sessionStorage.removeItem('wu_kbm_perwira_keluarga');
  location.reload();
}

// ===== INIT (after login) =====
async function init(){
  $('login-screen').style.display='none';
  $('app').style.display='flex';
  
  // Tentukan CURRENT_ROLE dari _login_as
  CURRENT_ROLE=CU._login_as||'pengurus';
  
  // Set badges
  if(CURRENT_ROLE==='keluarga'){
    $('user-badge').textContent='👨‍👩‍👧 '+CU.nama_keluarga;
    $('role-badge').textContent='Keluarga';
  }else{
    $('user-badge').textContent='@'+(CU.username||'user');
    $('role-badge').textContent=(CURRENT_ROLE==='guru'?'Guru':'Pengurus');
    if(CU.kelompok_scope){
      $('scope-badge').textContent='📍 '+CU.kelompok_scope;
      $('scope-badge').style.display='inline-block';
    }
  }
  
  // Render tabs sesuai role
  renderTabs();
  
  // Load data awal
  await loadInitialData();
  
  // Render tab pertama
  switchTab(getDefaultTab());
}

function getDefaultTab(){
  if(CURRENT_ROLE==='pengurus')return 'dashboard';
  if(CURRENT_ROLE==='guru')return 'kelas';
  return 'anak';  // keluarga
}

function renderTabs(){
  const tabs=getTabsForRole(CURRENT_ROLE);
  const cont=$('page-tabs');
  cont.innerHTML='';
  tabs.forEach(t=>{
    const btn=el('button',{
      class:'page-tab',
      id:'tab-'+t.id,
      onclick:()=>switchTab(t.id),
    },t.icon+' '+t.label);
    cont.appendChild(btn);
  });
}

function getTabsForRole(role){
  if(role==='pengurus'){
    return [
      {id:'dashboard',icon:'🏠',label:'Dashboard'},
      {id:'jenjang',icon:'📚',label:'Jenjang'},
      {id:'murid',icon:'👥',label:'Murid'},
      {id:'guru',icon:'👨‍🏫',label:'Guru'},
      {id:'kebijakan',icon:'📋',label:'Kebijakan'},
    ];
  }
  if(role==='guru'){
    return [
      {id:'kelas',icon:'🏠',label:'Kelas Saya'},
      {id:'murid',icon:'👥',label:'Murid'},
    ];
  }
  // keluarga
  return [
    {id:'anak',icon:'👨‍👩‍👧',label:'Anak Saya'},
  ];
}

function switchTab(tabId){
  CURRENT_TAB=tabId;
  // Active state
  document.querySelectorAll('.page-tab').forEach(b=>b.classList.remove('active'));
  const btn=$('tab-'+tabId);
  if(btn)btn.classList.add('active');
  
  // Render page
  const pages=$('pages');
  pages.innerHTML='<div class="page active" id="page-'+tabId+'"></div>';
  const renderer=PAGE_RENDERERS[tabId];
  if(renderer)renderer($('page-'+tabId));
  else $('page-'+tabId).innerHTML='<div class="empty"><div class="icon">🚧</div><p>Halaman belum tersedia</p></div>';
}

// ===== LOAD INITIAL DATA =====
async function loadInitialData(){
  try{
    // Konversi scope (PW4) ke kode angka (4) untuk filter jamaah_desa.kelompok
    const scopeKode=(CU.kelompok_scope&&CU.kelompok_scope!=='ALL')?scopeToKode(CU.kelompok_scope):null;
    
    // Jenjang (semua role butuh)
    const {data:jng}=await sb.from('ubnb_kbm_jenjang')
      .select('*').eq('aktif',true).order('urutan');
    DATA.jenjang=jng||[];
    
    // Murid (filter sesuai role/scope)
    let qMurid=sb.from('v_kbm_murid_detail').select('*').eq('status','aktif');
    if(CURRENT_ROLE==='pengurus'&&scopeKode){
      qMurid=qMurid.eq('kelompok',scopeKode);
    }
    const {data:mr}=await qMurid.order('nama_lengkap');
    DATA.murid=mr||[];
    
    // Calon murid (jamaah belum di-roster) - hanya pengurus
    if(CURRENT_ROLE==='pengurus'){
      let qCalon=sb.from('v_kbm_calon_murid').select('*');
      if(scopeKode){
        qCalon=qCalon.eq('kelompok',scopeKode);
      }
      const {data:cm}=await qCalon.order('nama_lengkap').limit(500);
      DATA.calonMurid=cm||[];
    }
    
    // Guru-Jenjang (pengurus & guru)
    if(CURRENT_ROLE!=='keluarga'){
      const {data:gj}=await sb.from('ubnb_kbm_guru_jenjang')
        .select('*').eq('aktif',true);
      DATA.guru=gj||[];
    }
  }catch(e){
    console.error('loadInitialData error:',e);
    toast('Gagal memuat data: '+(e.message||e),'error');
  }
}

function editJenjang(id){
  const j=DATA.jenjang.find(x=>x.id===id);

  $('modal-jenjang-title').textContent='Edit '+j.nama;
  $('f-jenjang-id').value=j.id;
  $('f-jenjang-nama').value=j.nama||'';
  $('f-jenjang-urutan').value=j.urutan||'';
  $('f-jenjang-usia-min').value=j.usia_min||'';
  $('f-jenjang-usia-max').value=j.usia_max||'';
  $('f-jenjang-desk').value=j.deskripsi||'';

async function submitJenjang(){
  const id=$('f-jenjang-id').value;
  const payload={
    nama:$('f-jenjang-nama').value.trim(),
    urutan:parseInt($('f-jenjang-urutan').value)||0,
    usia_min:parseInt($('f-jenjang-usia-min').value)||null,
    usia_max:parseInt($('f-jenjang-usia-max').value)||null,
    deskripsi:$('f-jenjang-desk').value.trim()||null,
  };
  if(!payload.nama){toast('Nama wajib diisi','error');return;}
  try{
    if(id){
      const {error}=await sb.from('ubnb_kbm_jenjang').update(payload).eq('id',id);
      if(error)throw error;
      toast('Jenjang diperbarui');
    }else{
      payload.created_by=CU.username||'unknown';
      const {error}=await sb.from('ubnb_kbm_jenjang').insert(payload);
      if(error)throw error;
      toast('Jenjang ditambahkan');
    }
    closeModal('modal-jenjang');
    await loadInitialData();
    switchTab('jenjang');
  }catch(e){toast('Gagal: '+(e.message||e),'error');}
}

function renderMuridList(list,view){
  if(!list||list.length===0){
    return '<div class="empty"><div class="icon">📭</div><p>Belum ada data</p></div>';
  }
  return '<table class="tbl"><thead><tr>'+
    '<th>Nama</th><th>Usia</th><th>KK / Kelompok</th>'+
    (view==='aktif'?'<th>Jenjang</th>':'')+
    '<th></th></tr></thead><tbody>'+
    list.map(m=>{
      const usia=view==='aktif'?m.usia:m.usia;
      const nama=view==='aktif'?m.nama_lengkap:m.nama_lengkap;
      const action=view==='aktif'?
        (CURRENT_ROLE==='pengurus'?`<button class="btn btn-amber btn-sm" onclick="bukaModalNaik(${m.id})">⬆️ Pindah</button>`:'')
        :
        `<button class="btn btn-primary btn-sm" onclick="bukaModalAssign('${escapeHtml(m.did)}')">+ Daftarkan</button>`;
      return `<tr>
        <td><b>${escapeHtml(nama||'-')}</b></td>
        <td>${usia!=null?usia+' thn':'-'}</td>
        <td>${escapeHtml(m.nama_kk||'-')}<div class="text-xs text-muted">${escapeHtml(kodeToSingkat(m.kelompok))}</div></td>
        ${view==='aktif'?`<td><span class="badge badge-green">${escapeHtml(m.nama_jenjang||'-')}</span></td>`:''}
        <td>${action}</td>
      </tr>`;
    }).join('')+
  '</tbody></table>';
}

function filterMurid(q){
  q=(q||'').toLowerCase();
  const view=window._muridView||'aktif';
  const src=(view==='aktif')?DATA.murid:DATA.calonMurid;
  const filtered=q?src.filter(m=>(m.nama_lengkap||'').toLowerCase().includes(q)||(m.nama_kk||'').toLowerCase().includes(q)):src;
  $('murid-list').innerHTML=renderMuridList(filtered,view);
}

// Modal: Daftarkan calon murid ke jenjang
function bukaModalAssign(did){
  const calon=DATA.calonMurid.find(c=>c.did===did);
  if(!calon){toast('Calon murid tidak ditemukan','error');return;}
  
  // Suggest jenjang berdasarkan usia
  let suggestedId='';
  if(calon.usia!=null){
    const match=DATA.jenjang.find(j=>(j.usia_min==null||calon.usia>=j.usia_min)&&(j.usia_max==null||calon.usia<=j.usia_max));
    if(match)suggestedId=match.id;
  }
  
  $('modal-assign-body').innerHTML=`
    <input type="hidden" id="f-assign-did" value="${escapeHtml(did)}"/>
    <div class="card" style="background:var(--green-light);margin-bottom:12px;">
      <div><b>${escapeHtml(calon.nama_lengkap||'-')}</b></div>
      <div class="text-sm text-muted">
        Usia: ${calon.usia!=null?calon.usia+' thn':'?'} • 
        Kelompok: ${escapeHtml(kodeToSingkat(calon.kelompok))} •
        KK: ${escapeHtml(calon.nama_kk||'-')}
      </div>
    </div>
    <div class="field">
      <label>Pilih Jenjang ${suggestedId?'<span class="text-xs" style="color:var(--green);">(otomatis dari usia)</span>':''}</label>
      <select id="f-assign-jenjang" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;">
        <option value="">— Pilih jenjang —</option>
        ${DATA.jenjang.map(j=>`<option value="${j.id}" ${j.id==suggestedId?'selected':''}>${escapeHtml(j.nama)} (${j.usia_min||'?'}-${j.usia_max||'?'} thn)</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Catatan (opsional)</label>
      <input type="text" id="f-assign-catatan" placeholder="Misal: pindahan dari TPA lain"/>
    </div>
  `;
  showModal('modal-assign');
}

async function submitAssign(){
  const did=$('f-assign-did').value;
  const jenjang_id=parseInt($('f-assign-jenjang').value);
  const catatan=$('f-assign-catatan').value.trim();
  if(!jenjang_id){toast('Pilih jenjang dulu','error');return;}
  
  const calon=DATA.calonMurid.find(c=>c.did===did);
  if(!calon){toast('Data calon tidak ditemukan','error');return;}
  
  try{
    const {error}=await sb.from('ubnb_kbm_murid').insert({
      jamaah_did:did,
      jenjang_id:jenjang_id,
      kelompok:calon.kelompok,
      tanggal_masuk:new Date().toISOString().slice(0,10),
      status:'aktif',
      catatan:catatan||null,
      created_by:CU.username||'unknown',
    });
    if(error)throw error;
    toast('Murid berhasil didaftarkan');
    closeModal('modal-assign');
    await loadInitialData();
    window._muridView='aktif';
    switchTab('murid');
  }catch(e){
    if(e.message&&e.message.includes('uniq_kbm_murid_aktif')){
      toast('Murid sudah terdaftar','error');
    }else{
      toast('Gagal: '+(e.message||e),'error');
    }
  }
}

// Modal: Naik kelas / pindah jenjang
function bukaModalNaik(muridId){
  const m=DATA.murid.find(x=>x.id===muridId);
  if(!m)return;
  
  // Cari jenjang berikutnya (urutan +1)
  const current=DATA.jenjang.find(j=>j.id===m.jenjang_id);
  const next=current?DATA.jenjang.find(j=>j.urutan===current.urutan+1):null;
  
  $('modal-naik-body').innerHTML=`
    <input type="hidden" id="f-naik-murid-id" value="${m.id}"/>
    <div class="card" style="background:var(--gold-light);margin-bottom:12px;">
      <div><b>${escapeHtml(m.nama_lengkap)}</b></div>
      <div class="text-sm text-muted">
        Saat ini di: <b>${escapeHtml(current?current.nama:'(belum)')}</b> • 
        Usia: ${m.usia!=null?m.usia+' thn':'?'}
      </div>
    </div>
    <div class="field">
      <label>Pindah ke Jenjang ${next?'<span class="text-xs" style="color:var(--green);">(otomatis: '+escapeHtml(next.nama)+')</span>':''}</label>
      <select id="f-naik-jenjang" style="width:100%;padding:9px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;">
        <option value="">— Pilih jenjang baru —</option>
        ${DATA.jenjang.filter(j=>j.id!==m.jenjang_id).map(j=>`<option value="${j.id}" ${next&&j.id===next.id?'selected':''}>${escapeHtml(j.nama)} (${j.usia_min||'?'}-${j.usia_max||'?'} thn)</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Alasan</label>
      <input type="text" id="f-naik-alasan" placeholder="Misal: kenaikan kelas tahun ajaran 2026/2027"/>
    </div>
  `;
  showModal('modal-naik');
}

async function submitNaikKelas(){
  const muridId=parseInt($('f-naik-murid-id').value);
  const jenjangBaruId=parseInt($('f-naik-jenjang').value);
  const alasan=$('f-naik-alasan').value.trim();
  if(!jenjangBaruId){toast('Pilih jenjang baru','error');return;}
  
  try{
    // Update jenjang_id (trigger akan auto-log ke history)
    const {error}=await sb.from('ubnb_kbm_murid')
      .update({jenjang_id:jenjangBaruId})
      .eq('id',muridId);
    if(error)throw error;
    
    // Update alasan di history record terbaru (kalau ada)
    if(alasan){
      const {data:hist}=await sb.from('ubnb_kbm_jenjang_history')
        .select('id').eq('murid_id',muridId).order('id',{ascending:false}).limit(1);
      if(hist&&hist[0]){
        await sb.from('ubnb_kbm_jenjang_history')
          .update({alasan:alasan,oleh:CU.username||'unknown'})
          .eq('id',hist[0].id);
      }
    }
    
    toast('Murid berhasil pindah jenjang');
    closeModal('modal-naik');
    await loadInitialData();
    switchTab('murid');
  }catch(e){toast('Gagal: '+(e.message||e),'error');}
}

      </table>
    </div>
  `;
}

function bukaModalGuru(username,nama){
  const myAssign=DATA.guru.filter(a=>a.username===username);
  $('modal-guru-body').innerHTML=`
    <input type="hidden" id="f-guru-username" value="${escapeHtml(username)}"/>
    <div class="card" style="background:var(--green-light);margin-bottom:12px;">
      <div><b>@${escapeHtml(username)}</b></div>
      <div class="text-sm text-muted">${escapeHtml(nama)}</div>
    </div>
    <div class="field">
      <label>Pilih Jenjang yang Ditangani</label>
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${DATA.jenjang.map(j=>{
          const checked=myAssign.some(a=>a.jenjang_id===j.id);
          return `<label style="display:flex;align-items:center;gap:8px;padding:8px;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;">
            <input type="checkbox" class="f-guru-jenjang" value="${j.id}" ${checked?'checked':''}/>
            <span><b>${escapeHtml(j.nama)}</b> <span class="text-xs text-muted">(${j.usia_min||'?'}-${j.usia_max||'?'} thn)</span></span>
          </label>`;
        }).join('')}
      </div>
    </div>
  `;
  showModal('modal-guru');
}

async function submitGuru(){
  const username=$('f-guru-username').value;
  const checked=Array.from(document.querySelectorAll('.f-guru-jenjang:checked')).map(c=>parseInt(c.value));
  const myAssign=DATA.guru.filter(a=>a.username===username);
  const current=myAssign.map(a=>a.jenjang_id);
  
  // Hitung diff
  const toAdd=checked.filter(id=>!current.includes(id));
  const toRemove=myAssign.filter(a=>!checked.includes(a.jenjang_id));
  
  try{
    if(toRemove.length){
      const ids=toRemove.map(a=>a.id);
      const {error}=await sb.from('ubnb_kbm_guru_jenjang').delete().in('id',ids);
      if(error)throw error;
    }
    if(toAdd.length){
      const payload=toAdd.map(jid=>({
        username:username,
        jenjang_id:jid,
        kelompok:null,
        aktif:true,
        ditugaskan_oleh:CU.username||'unknown',
      }));
      const {error}=await sb.from('ubnb_kbm_guru_jenjang').insert(payload);
      if(error)throw error;
    }
    toast('Penugasan diperbarui');
    closeModal('modal-guru');
    await loadInitialData();
    switchTab('guru');
  }catch(e){toast('Gagal: '+(e.message||e),'error');}
}

      <p class="text-sm" style="line-height:1.6;">Tombol absen harian, input pencapaian, dan catatan perkembangan akan tersedia di <b>Fase 2-3</b>.</p>

}

// ----- ANAK SAYA (Keluarga) -----
async function renderAnakKeluarga(c){
  // Cari anak-anak berdasarkan nama_keluarga atau did_kk
  let anak=[];
  try{
    if(CU.did_kk){
      // Cari jamaah dengan did_kk = nama KK keluarga
      const {data:jm}=await sb.from('jamaah_desa').select('did,nama_lengkap,tgl_lahir')
        .ilike('nama_kk',CU.nama_keluarga);
      const dids=(jm||[]).map(x=>x.did);
      if(dids.length){
        const {data:mr}=await sb.from('v_kbm_murid_detail').select('*').in('jamaah_did',dids).eq('status','aktif');
        anak=mr||[];
      }
    }else{
      // Fallback: pakai nama_keluarga
      const {data:jm}=await sb.from('jamaah_desa').select('did').ilike('nama_kk',CU.nama_keluarga);
      const dids=(jm||[]).map(x=>x.did);
      if(dids.length){
        const {data:mr}=await sb.from('v_kbm_murid_detail').select('*').in('jamaah_did',dids).eq('status','aktif');
        anak=mr||[];
      }
    }
  }catch(e){console.error(e);}
  
  c.innerHTML=`
    <div class="card">
      <div class="card-title">👨‍👩‍👧 Anak Saya di KBM Perwira</div>
      ${anak.length===0?
        '<div class="empty"><div class="icon">📭</div><p>Belum ada anak yang terdaftar di KBM</p><p class="text-sm mt-2">Hubungi pengurus untuk informasi pendaftaran.</p></div>'
        :
        anak.map(a=>`<div style="border:1.5px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;">
          <div style="font-weight:800;">${escapeHtml(a.nama_lengkap)}</div>
          <div class="text-sm text-muted">${a.usia!=null?a.usia+' tahun':''}</div>
          <div class="mt-2">
            <span class="badge badge-green">📚 ${escapeHtml(a.nama_jenjang||'-')}</span>
          </div>
        </div>`).join('')
      }
    </div>
    
    <div class="card" style="background:var(--gold-light);border-color:var(--gold);">
      <div class="card-title">ℹ️ Info Fase 1</div>
      <p class="text-sm" style="line-height:1.6;">Fitur lihat absen, pencapaian, dan raport anak akan tersedia di <b>Fase 2-4</b>.</p>
    </div>
  `;
}

// ===== SESSION RESTORE =====
document.addEventListener('DOMContentLoaded',async ()=>{
  // Cek session keluarga dulu
  const sk=sessionStorage.getItem('wu_kbm_perwira_keluarga');
  if(sk){
    try{CU=JSON.parse(sk);init();return;}catch(e){}
  }
  
  // Cek session staff (pengurus/guru)
  if(typeof UBNBAuth!=='undefined'){
    try{
      const cu=await UBNBAuth.verifySession(sb,'wu_kbm_perwira');
      if(cu){
        const {data:userFull}=await sb.from('users').select('kelompok_scope,role').eq('id',cu.id).single();
        if(userFull){cu.kelompok_scope=userFull.kelompok_scope;cu.role=userFull.role||cu.role;}
        CU=cu;
        if(!CU._login_as)CU._login_as='pengurus';
        init();
        return;
      }
    }catch(e){console.warn('Session check failed:',e);}
  }
  
  // Setup enter key on login
  ['inp-user','inp-pass'].forEach(id=>{
    const e=$(id);
    if(e)e.addEventListener('keydown',ev=>{if(ev.key==='Enter')doLoginStaff();});
  });
  ['inp-kel-nama','inp-kel-kode'].forEach(id=>{
    const e=$(id);
    if(e)e.addEventListener('keydown',ev=>{if(ev.key==='Enter')doLoginKeluarga();});
  });
});
</script>
