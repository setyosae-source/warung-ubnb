<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d3b2f">
<title>Panitia Sholat Idul Adha 1447 H — Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --emerald:#0d3b2f;
    --emerald-2:#164e3e;
    --emerald-3:#1f6650;
    --gold:#c9a96e;
    --gold-2:#a88848;
    --gold-soft:#e9d9b3;
    --cream:#faf6ee;
    --cream-2:#f3ebd9;
    --ink:#1a2820;
    --muted:#5f6b62;
    --line:#e0d4b8;
    --red:#b04848;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:80px}
  body{
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 10% 5%, rgba(201,169,110,0.08), transparent 40%),
      radial-gradient(circle at 90% 95%, rgba(13,59,47,0.06), transparent 40%);
    background-attachment:fixed;
    min-height:100vh;
  }
  .hero{
    background:linear-gradient(135deg, var(--emerald) 0%, var(--emerald-2) 100%);
    color:var(--cream);
    padding:36px 24px 48px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(45deg, transparent 0 20px, rgba(201,169,110,0.04) 20px 21px),
      repeating-linear-gradient(-45deg, transparent 0 20px, rgba(201,169,110,0.04) 20px 21px);
    pointer-events:none;
  }
  .hero-orn{font-family:'Amiri',serif;font-size:24px;color:var(--gold);margin-bottom:8px}
  .hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(24px,5vw,34px);font-weight:600;color:var(--cream);position:relative}
  .hero h2{font-family:'Cormorant Garamond',serif;font-size:clamp(16px,3.5vw,22px);color:var(--gold-soft);font-weight:500;font-style:italic;position:relative;margin-top:4px}
  .hero-div{margin:14px auto;width:100px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative}
  .hero-div::after{content:"✦";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--emerald);padding:0 6px;color:var(--gold);font-size:10px}
  .hero-sub{font-size:13px;color:var(--gold-soft);font-weight:500;position:relative}

  .container{max-width:820px;margin:0 auto;padding:0 16px 100px}

  /* Status bar */
  .status-bar{
    position:sticky;top:0;z-index:50;
    background:var(--cream);
    border-bottom:1px solid var(--line);
    padding:10px 16px;
    display:flex;align-items:center;gap:10px;
    font-size:13px;
    box-shadow:0 2px 8px rgba(13,59,47,0.06);
  }
  .status-dot{width:8px;height:8px;border-radius:50%;background:#999;flex-shrink:0}
  .status-dot.ok{background:#2ea36f;box-shadow:0 0 8px rgba(46,163,111,0.5)}
  .status-dot.err{background:var(--red)}
  .status-text{flex:1;color:var(--muted)}
  .btn-print{
    padding:6px 12px;
    border:1px solid var(--line);
    background:var(--cream);
    border-radius:6px;
    color:var(--emerald);
    font-size:12px;font-weight:600;
    cursor:pointer;
  }
  .print-menu{position:relative}
  .print-dropdown{
    position:absolute;top:100%;right:0;margin-top:4px;
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:0 8px 24px rgba(13,59,47,0.15);
    min-width:240px;
    display:none;z-index:60;
    overflow:hidden;
  }
  .print-dropdown.show{display:block}
  .print-dropdown button{
    display:block;width:100%;text-align:left;
    padding:10px 14px;
    border:none;background:transparent;
    font-family:inherit;font-size:13px;color:var(--emerald);
    cursor:pointer;
  }
  .print-dropdown button:hover{background:var(--gold-soft)}
  .print-dropdown button+button{border-top:1px solid var(--line)}

  /* Section */
  .section{margin-top:32px}
  .section-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .section-num{width:38px;height:38px;border:1.5px solid var(--gold);color:var(--gold-2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:18px;background:var(--cream)}
  .section-label{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--emerald)}
  .section-line{flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}

  /* Position card */
  .pos{
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:10px;
    overflow:hidden;
    transition:all .25s;
  }
  .pos.is-open{border-color:var(--gold);box-shadow:0 4px 16px rgba(201,169,110,0.18)}
  .pos-head{
    width:100%;background:transparent;border:none;
    padding:14px 16px;text-align:left;cursor:pointer;
    display:flex;align-items:center;gap:12px;font-family:inherit;color:inherit;
  }
  .pos-head:hover{background:rgba(201,169,110,0.06)}
  .pos-icon{
    width:34px;height:34px;
    background:linear-gradient(135deg,var(--emerald),var(--emerald-3));
    color:var(--gold-soft);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:14px;
  }
  .pos-meta{flex:1;min-width:0}
  .pos-title{font-weight:600;color:var(--emerald);font-size:15px}
  .pos-default{font-size:12px;color:var(--muted);font-style:italic;margin-top:1px}
  .pos-assigned{font-size:13px;color:var(--gold-2);font-weight:600;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px}
  .pos-assigned .chip{
    background:var(--gold-soft);
    color:var(--emerald);
    padding:2px 10px;
    border-radius:999px;
    font-size:12px;font-weight:600;
  }
  .pos-assigned .chip.manual{background:#dcc596;color:var(--emerald)}
  .pos-assigned .empty{color:#aaa;font-style:italic;font-weight:400}
  .pos-chev{color:var(--gold);font-size:14px;transition:transform .3s;flex-shrink:0;align-self:flex-start;margin-top:6px}
  .pos.is-open .pos-chev{transform:rotate(180deg)}

  .pos-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
  .pos.is-open .pos-body{max-height:4000px}
  .pos-body-inner{padding:6px 18px 16px;border-top:1px dashed var(--line)}

  .label{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--gold-2);font-weight:600;margin:12px 0 8px}

  /* PIC selector */
  .pic-area{background:rgba(201,169,110,0.06);border:1px dashed var(--gold-soft);border-radius:8px;padding:10px}

  /* Draggable cards (vertical list inside editor) */
  .pic-list{display:flex;flex-direction:column;gap:6px;min-height:6px;margin-bottom:10px}
  .pic-card{
    background:var(--emerald);
    color:var(--gold-soft);
    border-radius:10px;
    padding:8px 10px 8px 6px;
    display:flex;align-items:center;gap:8px;
    font-size:14px;font-weight:500;
    cursor:grab;
    user-select:none;
    transition:transform .15s, box-shadow .15s;
  }
  .pic-card:active{cursor:grabbing}
  .pic-card.manual{background:var(--gold-2)}
  .pic-card.dragging{opacity:0.4;transform:scale(0.98)}
  .pic-card.drag-over{box-shadow:0 0 0 2px var(--gold);transform:translateY(2px)}
  .pic-card .handle{
    color:rgba(233,217,179,0.6);
    font-size:18px;line-height:1;
    padding:0 4px;
    cursor:grab;
    flex-shrink:0;
  }
  .pic-card.manual .handle{color:rgba(255,255,255,0.5)}
  .pic-card .num{
    background:rgba(255,255,255,0.15);
    width:22px;height:22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;flex-shrink:0;
  }
  .pic-card .nm{flex:1;min-width:0;word-break:break-word}
  .pic-card .rm{
    width:22px;height:22px;border-radius:50%;
    background:rgba(255,255,255,0.18);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:13px;line-height:1;flex-shrink:0;
  }
  .pic-card .rm:hover{background:rgba(255,255,255,0.32)}
  .pic-empty{color:#999;font-size:13px;font-style:italic;padding:6px 0;text-align:center}

  .pic-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .btn{
    padding:7px 12px;
    border-radius:7px;
    font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:var(--cream);color:var(--emerald);
    font-family:inherit;
  }
  .btn:hover{background:var(--gold-soft);border-color:var(--gold)}
  .btn-primary{background:var(--emerald);color:var(--gold-soft);border-color:var(--emerald)}
  .btn-primary:hover{background:var(--emerald-3);color:#fff}
  .btn-sm{padding:5px 10px;font-size:12px}

  /* Note input */
  .note-input{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:13px;font-family:inherit;background:var(--cream);
    resize:vertical;min-height:32px;
    margin-top:8px;
  }
  .note-input:focus{outline:none;border-color:var(--gold)}

  /* Jobdesc */
  .jd ul{list-style:none;padding:0}
  .jd li{position:relative;padding:6px 0 6px 22px;font-size:13.5px;color:var(--ink);line-height:1.6}
  .jd li::before{content:"";position:absolute;left:4px;top:13px;width:6px;height:6px;background:var(--gold);border-radius:50%;transform:rotate(45deg)}

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;
    background:rgba(13,59,47,0.55);
    backdrop-filter:blur(4px);
    display:none;align-items:flex-end;justify-content:center;
    z-index:200;
    padding:0;
  }
  .modal-backdrop.show{display:flex}
  .modal{
    background:var(--cream);
    width:100%;max-width:600px;
    border-radius:16px 16px 0 0;
    max-height:90vh;
    display:flex;flex-direction:column;
    animation:slideUp .3s ease;
  }
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  @media(min-width:768px){
    .modal-backdrop{align-items:center}
    .modal{border-radius:16px;max-height:85vh}
  }
  .modal-head{
    padding:16px 20px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }
  .modal-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--emerald)}
  .modal-close{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;line-height:1;width:32px;height:32px;border-radius:50%}
  .modal-close:hover{background:rgba(0,0,0,0.05)}
  .modal-body{padding:14px 20px;overflow-y:auto;flex:1}
  .modal-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

  .search-input{
    width:100%;padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:15px;font-family:inherit;background:var(--cream);
  }
  .search-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,110,0.15)}

  .filter-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .filter-pill{
    padding:5px 12px;font-size:12px;
    border:1px solid var(--line);background:var(--cream);
    border-radius:999px;cursor:pointer;color:var(--muted);
    font-family:inherit;font-weight:500;
  }
  .filter-pill.active{background:var(--emerald);color:var(--gold-soft);border-color:var(--emerald)}

  .result-list{margin-top:12px}
  .result-item{
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:6px;
    cursor:pointer;
    display:flex;align-items:center;gap:10px;
    transition:all .15s;
  }
  .result-item:hover{border-color:var(--gold);background:rgba(201,169,110,0.05)}
  .result-item.selected{background:var(--gold-soft);border-color:var(--gold)}
  .result-name{flex:1;font-weight:500;font-size:14px;color:var(--ink)}
  .result-meta{font-size:11px;color:var(--muted)}
  .result-check{
    width:22px;height:22px;border-radius:50%;
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:transparent;font-weight:700;font-size:14px;
    flex-shrink:0;
  }
  .result-item.selected .result-check{background:var(--emerald);border-color:var(--emerald);color:var(--gold-soft)}

  .manual-section{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
  .manual-section .label{margin-top:0}
  .manual-input{
    width:100%;padding:10px 12px;
    border:1px solid var(--line);border-radius:8px;
    font-size:14px;font-family:inherit;background:var(--cream);
  }
  .manual-input:focus{outline:none;border-color:var(--gold)}
  .manual-help{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}

  /* Toast */
  .toast{
    position:fixed;
    bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--emerald);color:var(--gold-soft);
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;
    box-shadow:0 6px 20px rgba(13,59,47,0.3);
    z-index:300;opacity:0;transition:all .3s ease;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.err{background:var(--red)}

  /* Loading */
  .loading-skeleton{
    background:linear-gradient(90deg,var(--cream-2) 0%,var(--cream) 50%,var(--cream-2) 100%);
    background-size:200% 100%;
    animation:shimmer 1.5s infinite;
    border-radius:7px;height:18px;margin:4px 0;
  }
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* ============ PRINT: PROPOSAL/REPORT STYLE ============ */
  @media print{
    @page{ size:A4; margin:1.8cm 2cm 2cm 2cm; }

    /* Hide UI chrome */
    .status-bar, .modal-backdrop, .pic-actions, .toast,
    .pos-chev, .note-input, .pic-card .handle, .pic-card .rm,
    #topBtn { display:none !important; }

    body{
      background:#fff !important;
      background-image:none !important;
      font-family:'Plus Jakarta Sans', Georgia, serif !important;
      color:#000 !important;
      font-size:10.5pt;
      line-height:1.45;
    }

    /* Cover header — compact */
    .hero{
      background:#fff !important;
      color:#000 !important;
      padding:0 0 12pt 0 !important;
      margin-bottom:14pt;
      border-bottom:2pt solid #000 !important;
      text-align:center;
    }
    .hero::before{ display:none !important; }
    .hero-orn{ color:#000 !important; font-size:18pt !important; margin-bottom:4pt !important; }
    .hero h1{
      color:#000 !important;
      font-family:'Cormorant Garamond', serif !important;
      font-size:20pt !important; font-weight:700 !important;
      letter-spacing:0.5pt !important;
      margin-bottom:2pt !important;
    }
    .hero h2{
      color:#222 !important;
      font-family:'Cormorant Garamond', serif !important;
      font-size:13pt !important; font-style:italic !important;
      font-weight:500 !important;
      margin-bottom:6pt !important;
    }
    .hero-div{ display:none !important; }
    .hero-sub{ color:#000 !important; font-size:9.5pt !important; font-weight:600 !important; letter-spacing:1pt !important; }
    .hero-loc{ display:none !important; }

    /* Container — no extra padding */
    .container{ padding:0 !important; max-width:100% !important; }

    /* Section heads — compact */
    .section{ margin-top:10pt !important; }
    .section-head{ margin-bottom:6pt !important; gap:8pt !important; }
    .section-num{
      width:22pt !important; height:22pt !important;
      border:1pt solid #000 !important; color:#000 !important;
      background:#fff !important;
      font-size:12pt !important;
    }
    .section-label{
      color:#000 !important;
      font-size:14pt !important;
      font-weight:700 !important;
      font-family:'Cormorant Garamond', serif !important;
    }
    .section-line{ background:#000 !important; height:0.5pt !important; }
    .section + p, .section-head + p{ font-size:9pt !important; color:#333 !important; margin-bottom:8pt !important; padding:0 !important; font-style:italic !important; }

    /* Position card — proposal row style */
    .pos{
      border:none !important;
      border-bottom:0.5pt solid #999 !important;
      border-radius:0 !important;
      box-shadow:none !important;
      margin-bottom:0 !important;
      padding:0 !important;
      background:#fff !important;
      break-inside:avoid;
      page-break-inside:avoid;
    }
    .pos-head{
      padding:5pt 0 !important;
      gap:8pt !important;
      background:transparent !important;
    }
    .pos-icon{
      background:#000 !important;
      color:#fff !important;
      width:18pt !important; height:18pt !important;
      font-size:8pt !important;
      flex-shrink:0;
    }
    .pos-meta{ display:flex; align-items:baseline; gap:8pt; flex-wrap:wrap; }
    .pos-title{
      color:#000 !important;
      font-size:10.5pt !important;
      font-weight:700 !important;
      letter-spacing:0.2pt;
      min-width:160pt;
    }
    .pos-default{ display:none !important; }
    .pos-assigned{
      margin-top:0 !important;
      gap:3pt 6pt !important;
      flex:1;
    }
    .pos-assigned .chip{
      background:transparent !important;
      color:#000 !important;
      padding:0 !important;
      border-radius:0 !important;
      font-size:10pt !important;
      font-weight:500 !important;
    }
    .pos-assigned .chip+.chip::before{
      content:" · ";
      color:#666;
      padding:0 2pt;
    }
    .pos-assigned .empty{ color:#999 !important; font-size:9pt !important; }

    /* Body / jobdesc */
    .pos-body{ max-height:none !important; }
    .pos-body-inner{ padding:2pt 0 6pt 28pt !important; border-top:none !important; }
    .pic-area{ background:transparent !important; border:none !important; padding:0 !important; }

    /* Hide pic-list in print — chips already shown in header */
    .pic-list{ display:none !important; }

    /* Labels: smaller, inline-ish */
    .label{
      font-size:7.5pt !important;
      letter-spacing:0.8pt !important;
      color:#000 !important;
      margin:4pt 0 2pt 0 !important;
      font-weight:700 !important;
    }
    .label span{ display:none !important; }

    /* Jobdesc list — tighter */
    .jd ul{ margin:0 !important; padding-left:14pt !important; }
    .jd li{
      padding:1pt 0 1pt 0 !important;
      font-size:9.5pt !important;
      line-height:1.4 !important;
      color:#000 !important;
      list-style-type:disc !important;
      list-style-position:outside !important;
    }
    .jd li::before{ display:none !important; }

    /* TOC and footer */
    .toc{ display:none !important; }
    .footer{ font-size:8pt !important; margin-top:14pt !important; padding:8pt 0 0 0 !important; border-top:0.5pt solid #000 !important; }
    .footer-orn{ display:none !important; }

    /* Lampiran section */
    .lamp{
      background:#fff !important;
      border:none !important;
      border-bottom:0.5pt dashed #999 !important;
      border-radius:0 !important;
      padding:4pt 0 !important;
      margin-bottom:0 !important;
      break-inside:avoid;
    }
    .lamp h3{
      color:#000 !important;
      font-size:10pt !important;
      font-weight:700 !important;
      margin-bottom:2pt !important;
      font-family:'Plus Jakarta Sans', sans-serif !important;
    }
    .lamp ul{ padding-left:14pt !important; margin:0 !important; }
    .lamp li{
      font-size:9pt !important;
      padding:1pt 0 !important;
      list-style-type:square !important;
    }
    .lamp li::before{ display:none !important; }
  }

  /* Print: STRUKTUR ONLY — hide jobdesc */
  body.print-struktur .pos-body{ display:none !important; }
  @media print{
    body.print-struktur .pos-body,
    body.print-struktur .pos .pos-body,
    body.print-struktur .pos.is-open .pos-body{
      display:none !important;
      max-height:0 !important;
      overflow:hidden !important;
      visibility:hidden !important;
      height:0 !important;
      padding:0 !important;
      margin:0 !important;
    }
    body.print-struktur .pos-head{ padding:3pt 0 !important; }
    body.print-struktur .pos{ border-bottom:0.5pt solid #ccc !important; }
  }
  /* Print: LENGKAP — show jobdesc */
  body.print-lengkap .pos-body{ max-height:none !important; }
  body.print-lengkap .pic-actions,
  body.print-lengkap .note-input,
  body.print-lengkap .pic-list{ display:none !important; }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-orn">﷽</div>
  <h1>Panitia Sholat Idul Adha</h1>

// ============ UTILITAS UI ============
function $(id){return document.getElementById(id)}
function setStatus(text, type){
  const dot = $('statusDot');
  dot.className = 'status-dot ' + (type||'');
  $('statusText').textContent = text;
}
function toast(msg, isErr){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr?' err':'') + ' show';
  setTimeout(()=>t.classList.remove('show'), 2400);
}

// ============ PRINT ============
function togglePrintMenu(e){
  e.stopPropagation();
  $('printDropdown').classList.toggle('show');
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.print-menu')) $('printDropdown').classList.remove('show');
});

function doPrint(mode){
  $('printDropdown').classList.remove('show');

  // Track detached elements for restoration
  const detached = []; // [{parent, node, nextSibling}]

  if(mode === 'lengkap'){
    document.querySelectorAll('.pos').forEach(el=>el.classList.add('is-open'));
  } else if(mode === 'struktur'){
    document.querySelectorAll('.pos').forEach(el=>el.classList.remove('is-open'));
    // DETACH pos-body completely from DOM
    document.querySelectorAll('.pos-body').forEach(el=>{
      detached.push({
        parent: el.parentNode,
        node: el,
        nextSibling: el.nextSibling
      });
      el.parentNode.removeChild(el);
    });
  }

  document.body.classList.add('print-'+mode);

  const restore = ()=>{
    document.body.classList.remove('print-struktur','print-lengkap');
    // Re-attach in original positions
    detached.forEach(({parent, node, nextSibling})=>{
      if(nextSibling && nextSibling.parentNode === parent){
        parent.insertBefore(node, nextSibling);
      } else {
        parent.appendChild(node);
      }
    });
    detached.length = 0;
  };

  const onAfter = ()=>{
    restore();
    window.removeEventListener('afterprint', onAfter);
  };
  window.addEventListener('afterprint', onAfter);

  // Call print immediately (no delay) — DOM already modified synchronously above
  window.print();

  // Fallback restore for browsers that don't fire afterprint
  setTimeout(restore, 3000);
}

  const {data, error} = await supa
    .from('jamaah_desa')
    .select('did, nama, kelompok_nama, jenis_kelamin')
    .order('nama');

  setStatus(`Terhubung · ${JAMAAH.length} jamaah dimuat`, 'ok');
}

    .order('posisi_id')
    .order('urutan')
    .order('id');
  if(error){ console.error(error); return; }
  ASSIGNMENTS = {};
  for(const row of (data||[])){
    if(!ASSIGNMENTS[row.posisi_id]) ASSIGNMENTS[row.posisi_id] = [];
    ASSIGNMENTS[row.posisi_id].push(row);
  }
  renderAllChips();
}

function renderAllChips(){
  for(const sec of Object.values(STRUCTURE)){
    for(const p of sec.positions){
      renderChips(p.id);
    }
  }
}

function renderChips(posId){
  const list = (ASSIGNMENTS[posId] || []).slice().sort((a,b)=>(a.urutan||0)-(b.urutan||0));
  ASSIGNMENTS[posId] = list; // keep sorted
  const headEl = $('chips-'+posId);
  const listEl = $('list-'+posId);

  if(list.length===0){
    headEl.innerHTML = '<span class="empty">belum ditentukan</span>';
    if(listEl) listEl.innerHTML = '<div class="pic-empty">Belum ada PIC dipilih</div>';
  } else {
    // Header: SEMUA chip tampil
    headEl.innerHTML = list.map(a=>{
      const name = a.nama_manual || jamaahName(a.jamaah_did);
      const cls = a.nama_manual ? 'chip manual' : 'chip';
      return `<span class="${cls}">${escapeHtml(name)}</span>`;
    }).join('');

    // Editor: draggable cards
    if(listEl){
      listEl.innerHTML = list.map((a,i)=>{
        const name = a.nama_manual || jamaahName(a.jamaah_did);
        const cls = a.nama_manual ? 'pic-card manual' : 'pic-card';
        return `<div class="${cls}" draggable="true" data-id="${a.id}" data-pos="${posId}">
          <span class="handle">≡</span>
          <span class="num">${i+1}</span>
          <span class="nm">${escapeHtml(name)}</span>
          <span class="rm" onclick="event.stopPropagation();removePic(${a.id})">×</span>
        </div>`;
      }).join('');
      attachDragHandlers(listEl);
    }

    // Catatan: ambil yang pertama
    const notes = list.map(a=>a.catatan).filter(Boolean);
    const noteEl = $('note-'+posId);
    if(noteEl) noteEl.value = notes.join(' · ');
  }
}

// ============ DRAG & DROP ============
let dragSrc = null;

function attachDragHandlers(container){
  const cards = container.querySelectorAll('.pic-card');
  cards.forEach(card=>{
    card.addEventListener('dragstart', e=>{
      dragSrc = card;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', card.dataset.id);
    });
    card.addEventListener('dragend', ()=>{
      card.classList.remove('dragging');
      container.querySelectorAll('.pic-card').forEach(c=>c.classList.remove('drag-over'));
    });
    card.addEventListener('dragover', e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if(dragSrc && dragSrc !== card) card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', ()=>card.classList.remove('drag-over'));
    card.addEventListener('drop', async e=>{
      e.preventDefault();
      card.classList.remove('drag-over');
      if(!dragSrc || dragSrc === card) return;
      const posId = container.dataset.pos;
      // Determine insertion: before or after target based on Y position
      const rect = card.getBoundingClientRect();
      const midpoint = rect.top + rect.height/2;
      const after = e.clientY > midpoint;
      if(after) card.after(dragSrc);
      else card.before(dragSrc);
      await persistOrder(posId);
    });

    // Touch support
    let touchSrc = null, touchClone = null, touchStartY = 0;
    card.addEventListener('touchstart', e=>{
      if(e.target.classList.contains('rm')) return;
      touchSrc = card;
      touchStartY = e.touches[0].clientY;
      card.classList.add('dragging');
    }, {passive:true});
    card.addEventListener('touchmove', e=>{
      if(!touchSrc) return;
      e.preventDefault();
      const y = e.touches[0].clientY;
      const el = document.elementFromPoint(e.touches[0].clientX, y);
      const target = el && el.closest('.pic-card');
      container.querySelectorAll('.pic-card').forEach(c=>{
        if(c!==touchSrc) c.classList.remove('drag-over');
      });
      if(target && target !== touchSrc && target.parentElement === container){
        target.classList.add('drag-over');
      }
    }, {passive:false});
    card.addEventListener('touchend', async e=>{
      if(!touchSrc) return;
      const y = e.changedTouches[0].clientY;
      const el = document.elementFromPoint(e.changedTouches[0].clientX, y);
      const target = el && el.closest('.pic-card');
      container.querySelectorAll('.pic-card').forEach(c=>c.classList.remove('drag-over'));
      touchSrc.classList.remove('dragging');
      if(target && target !== touchSrc && target.parentElement === container){
        const rect = target.getBoundingClientRect();
        const after = y > rect.top + rect.height/2;
        if(after) target.after(touchSrc);
        else target.before(touchSrc);
        const posId = container.dataset.pos;
        await persistOrder(posId);
      }
      touchSrc = null;
    });
  });
}

async function persistOrder(posId){
  const container = $('list-'+posId);
  const cards = Array.from(container.querySelectorAll('.pic-card'));
  // Update local order first
  const newOrder = [];
  for(let i=0; i<cards.length; i++){
    const id = parseInt(cards[i].dataset.id);
    const row = ASSIGNMENTS[posId].find(a=>a.id===id);
    if(row){ row.urutan = i; newOrder.push(row); }
  }
  ASSIGNMENTS[posId] = newOrder;

  // Update num badges immediately
  cards.forEach((c,i)=>{ const n = c.querySelector('.num'); if(n) n.textContent = i+1; });

  // Save to DB
  setStatus('Menyimpan urutan…');
  let allOk = true;
  for(let i=0; i<newOrder.length; i++){
    const {error} = await supa.from('panitia_idul_adha_1447h').update({urutan:i}).eq('id', newOrder[i].id);
    if(error){ allOk=false; console.error(error); }
  }
  if(allOk){
    setStatus(`Terhubung · ${JAMAAH.length} jamaah dimuat`, 'ok');
    // Re-render header chips for this position
    const headEl = $('chips-'+posId);
    headEl.innerHTML = newOrder.map(a=>{
      const name = a.nama_manual || jamaahName(a.jamaah_did);
      const cls = a.nama_manual ? 'chip manual' : 'chip';
      return `<span class="${cls}">${escapeHtml(name)}</span>`;
    }).join('');
    toast('Urutan tersimpan');
  } else {
    setStatus('Gagal simpan urutan', 'err');
    toast('Gagal simpan urutan', true);
  }
}

function jamaahName(did){
  const j = JAMAAH.find(x=>x.did===did);
  return j ? j.nama : '(jamaah tidak ditemukan)';
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// ============ PICKER MODAL ============
function openPicker(posId, posTitle){
  activePosId = posId;
  $('modalPosTitle').textContent = 'PIC: ' + posTitle;
  $('searchInput').value = '';
  $('manualInput').value = '';

  // Build filter pills
  const pills = [
    {key:'all', label:'Semua'},
    {key:'Laki-laki', label:'Laki-laki'},
    {key:'Perempuan', label:'Perempuan'},
    ...allKelompok.map(k=>({key:'kel:'+k, label:k}))
  ];
  $('filterRow').innerHTML = pills.map(p=>
    `<button class="filter-pill${pickerFilter===p.key?' active':''}" data-key="${p.key}" onclick="setFilter('${p.key}')">${p.label}</button>`
  ).join('');

  // Pre-select existing
  pickerSelection = {};
  const cur = ASSIGNMENTS[posId] || [];
  for(const a of cur){
    if(a.jamaah_did) pickerSelection[a.jamaah_did] = jamaahName(a.jamaah_did);
  }

  filterJamaah();
  $('picModal').classList.add('show');
  document.body.style.overflow='hidden';
}

function closePicker(){
  $('picModal').classList.remove('show');
  document.body.style.overflow='';
  activePosId = null;
}

function setFilter(key){
  pickerFilter = key;
  document.querySelectorAll('.filter-pill').forEach(el=>{
    el.classList.toggle('active', el.dataset.key===key);
  });
  filterJamaah();
}

function filterJamaah(){
  const q = $('searchInput').value.toLowerCase().trim();
  let list = JAMAAH;

  if(pickerFilter==='Laki-laki') list = list.filter(j=>j.jenis_kelamin==='Laki-laki');
  else if(pickerFilter==='Perempuan') list = list.filter(j=>j.jenis_kelamin==='Perempuan');
  else if(pickerFilter.startsWith('kel:')){
    const k = pickerFilter.slice(4);
    list = list.filter(j=>j.kelompok_nama===k);
  }

  if(q) list = list.filter(j => (j.nama||'').toLowerCase().includes(q));

  list = list.slice(0, 80); // max 80 result for performance

  const html = list.map(j=>{
    const sel = pickerSelection[j.did] ? ' selected' : '';
    return `<div class="result-item${sel}" onclick="toggleSelect('${j.did}','${escapeJs(j.nama)}')">
      <div class="result-check">✓</div>
      <div class="result-name">${escapeHtml(j.nama)}</div>
      <div class="result-meta">${escapeHtml(j.kelompok_nama||'')} · ${j.jenis_kelamin==='Laki-laki'?'L':'P'}</div>
    </div>`;
  }).join('');

  $('resultList').innerHTML = html || '<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">Tidak ada hasil</div>';
}

function escapeJs(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}

function toggleSelect(did, nama){
  if(pickerSelection[did]) delete pickerSelection[did];
  else pickerSelection[did] = nama;
  filterJamaah();
}

let pendingManual = []; // nama manual yg ditambah saat modal terbuka

function addManual(){
  const v = $('manualInput').value.trim();
  if(!v){ toast('Isi nama dulu', true); return; }
  pendingManual.push(v);
  $('manualInput').value = '';
  toast('Ditambahkan: '+v);
}

async function savePicker(){
  if(!activePosId) return;
  const posId = activePosId;

  // Cek apakah ada PIC existing yang dihapus (tidak ada di selection baru)
  const existing = ASSIGNMENTS[posId] || [];
  const existingDids = existing.filter(a=>a.jamaah_did).map(a=>a.jamaah_did);
  const existingManual = existing.filter(a=>a.nama_manual).map(a=>a.nama_manual);
  const newDids = Object.keys(pickerSelection);
  const removedDids = existingDids.filter(d => !newDids.includes(d));
  const removedManual = existingManual.filter(m => !pendingManual.includes(m));
  const hasRemoval = removedDids.length > 0 || removedManual.length > 0;

  let auth = null;
  if(hasRemoval){
    auth = await askDeleteAuth();
    if(!auth.ok) return;
  }

  setStatus('Menyimpan…');

  // Build list of removed items for audit
  const removedItems = [];
  for(const d of removedDids) removedItems.push({nama: jamaahName(d), did: d});
  for(const m of removedManual) removedItems.push({nama: m, did: null});

  // Delete existing for this position
  const {error:delErr} = await supa.from('panitia_idul_adha_1447h').delete().eq('posisi_id', posId);
  if(delErr){ setStatus('Gagal hapus lama: '+delErr.message, 'err'); toast('Gagal simpan', true); return; }

  // Log audit if there was removal
  if(hasRemoval && auth){
    await logAudit('edit_remove', posId, removedItems, auth);
  }

  // Insert new with urutan
  // Preserve existing order for items still selected; new items get appended
  const existingOrdered = (existing||[]).slice().sort((a,b)=>(a.urutan||0)-(b.urutan||0));
  const rows = [];
  let urutanCounter = 0;

  // 1. Existing jamaah_did yang masih dipilih, urutan dipertahankan
  for(const a of existingOrdered){
    if(a.jamaah_did && pickerSelection[a.jamaah_did]){
      rows.push({ posisi_id: posId, jamaah_did: a.jamaah_did, nama_manual: null, urutan: urutanCounter++ });
    } else if(a.nama_manual && pendingManual.includes(a.nama_manual)){
      rows.push({ posisi_id: posId, jamaah_did: null, nama_manual: a.nama_manual, urutan: urutanCounter++ });
    }
  }
  // 2. Jamaah baru (belum di existing)
  const existingDidsSet = new Set(existingOrdered.filter(a=>a.jamaah_did).map(a=>a.jamaah_did));
  for(const did of Object.keys(pickerSelection)){
    if(!existingDidsSet.has(did)){
      rows.push({ posisi_id: posId, jamaah_did: did, nama_manual: null, urutan: urutanCounter++ });
    }
  }
  // 3. Manual baru
  const existingManualSet = new Set(existingOrdered.filter(a=>a.nama_manual).map(a=>a.nama_manual));
  for(const m of pendingManual){
    if(!existingManualSet.has(m)){
      rows.push({ posisi_id: posId, jamaah_did: null, nama_manual: m, urutan: urutanCounter++ });
    }
  }

  if(rows.length>0){
    const {data, error} = await supa.from('panitia_idul_adha_1447h').insert(rows).select();
    if(error){ setStatus('Gagal simpan: '+error.message, 'err'); toast('Gagal simpan', true); return; }
    ASSIGNMENTS[posId] = data;
  } else {
    ASSIGNMENTS[posId] = [];
  }

  pendingManual = [];
  renderChips(posId);
  setStatus(`Terhubung · ${JAMAAH.length} jamaah dimuat`, 'ok');
  toast('Tersimpan ✓');
  closePicker();
}

// ============ AUDIT HELPERS ============
let cachedIP = null;
async function getIP(){
  if(cachedIP) return cachedIP;
  try{
    const r = await fetch('https://api.ipify.org?format=json');
    const j = await r.json();
    cachedIP = j.ip || 'unknown';
  }catch(e){ cachedIP = 'unknown'; }
  return cachedIP;
}

// Returns {ok, nama, ip} after asking for name+code. ok=false means cancelled or wrong code.
async function askDeleteAuth(){
  const nama = prompt('Nama:');
  if(nama===null) return {ok:false};
  if(!nama.trim()){ toast('Operasi dibatalkan', true); return {ok:false}; }
  const k = prompt('Kode:');
  if(k===null) return {ok:false};
  if(k !== 'pw354'){ toast('Operasi dibatalkan', true); return {ok:false}; }
  const ip = await getIP();
  return {ok:true, nama:nama.trim(), ip};
}

async function logAudit(action, posId, items, pelaku){
  // items: array of {nama, did} or null for clear
  try{
    const rows = [];
    if(!items || items.length===0){
      rows.push({
        action, posisi_id: posId,
        nama_dihapus: null, jamaah_did_dihapus: null,
        pelaku_nama: pelaku.nama, pelaku_ip: pelaku.ip,
        pelaku_ua: (navigator.userAgent||'').slice(0,200)
      });
    } else {
      for(const it of items){
        rows.push({
          action, posisi_id: posId,
          nama_dihapus: it.nama || null,
          jamaah_did_dihapus: it.did || null,
          pelaku_nama: pelaku.nama, pelaku_ip: pelaku.ip,
          pelaku_ua: (navigator.userAgent||'').slice(0,200)
        });
      }
    }
    await supa.from('panitia_audit_log').insert(rows);
  }catch(e){ console.error('audit log failed', e); }
}

async function removePic(rowId){
  const auth = await askDeleteAuth();
  if(!auth.ok) return;

  // Find item info before delete
  let item = null, posId = null;
  for(const pid of Object.keys(ASSIGNMENTS)){
    const found = ASSIGNMENTS[pid].find(a=>a.id===rowId);
    if(found){
      item = {
        nama: found.nama_manual || jamaahName(found.jamaah_did),
        did: found.jamaah_did
      };
      posId = pid;
      break;
    }
  }

  const {error} = await supa.from('panitia_idul_adha_1447h').delete().eq('id', rowId);
  if(error){ toast('Gagal hapus: '+error.message, true); return; }

  await logAudit('remove_pic', posId, item?[item]:null, auth);

  for(const pid of Object.keys(ASSIGNMENTS)){
    ASSIGNMENTS[pid] = ASSIGNMENTS[pid].filter(a=>a.id!==rowId);
    renderChips(pid);
  }
  toast('Dihapus');
}

async function clearPos(posId){
  const auth = await askDeleteAuth();
  if(!auth.ok) return;

  // Capture items before delete
  const items = (ASSIGNMENTS[posId]||[]).map(a=>({
    nama: a.nama_manual || jamaahName(a.jamaah_did),
    did: a.jamaah_did
  }));

  const {error} = await supa.from('panitia_idul_adha_1447h').delete().eq('posisi_id', posId);
  if(error){ toast('Gagal: '+error.message, true); return; }

  await logAudit('clear_pos', posId, items, auth);

  ASSIGNMENTS[posId] = [];
  renderChips(posId);
  toast('Dikosongkan');
}

async function saveNote(posId){
  const note = $('note-'+posId).value.trim();
  const list = ASSIGNMENTS[posId] || [];
  if(list.length===0){
    // No PIC yet — create a row with only note
    if(!note) return;
    const {data, error} = await supa.from('panitia_idul_adha_1447h').insert([{posisi_id:posId, catatan:note}]).select();
    if(error){ toast('Gagal simpan catatan', true); return; }
    ASSIGNMENTS[posId] = data;
    renderChips(posId);
    toast('Catatan tersimpan');
    return;
  }
  // Update first row's catatan
  const firstId = list[0].id;
  const {error} = await supa.from('panitia_idul_adha_1447h').update({catatan:note}).eq('id', firstId);
  if(error){ toast('Gagal simpan catatan', true); return; }
  list[0].catatan = note;
  toast('Catatan tersimpan');
}

// ============ INIT ============
async function init(){
  renderStructure();
  await loadJamaah();
  await loadAssignments();
}

// Close modal on backdrop click
document.addEventListener('click', e=>{
  if(e.target.id==='picModal') closePicker();
});

init();
</script>
