    --emerald-2:#164e3e;
    --emerald-3:#1f6650;
    --gold:#c9a96e;
    --gold-2:#a88848;
    --gold-soft:#e9d9b3;
    --cream:#faf6ee;
    --cream-2:#f3ebd9;

  body{

  .hero{

  .hero-orn{font-family:'Amiri',serif;font-size:24px;color:var(--gold);margin-bottom:8px}
  .hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(24px,5vw,34px);font-weight:600;color:var(--cream);position:relative}
  .hero h2{font-family:'Cormorant Garamond',serif;font-size:clamp(16px,3.5vw,22px);color:var(--gold-soft);font-weight:500;font-style:italic;position:relative;margin-top:4px}
  .hero-div{margin:14px auto;width:100px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative}
  .hero-div::after{content:"✦";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--emerald);padding:0 6px;color:var(--gold);font-size:10px}
  .hero-sub{font-size:13px;color:var(--gold-soft);font-weight:500;position:relative}

  .container{max-width:820px;margin:0 auto;padding:0 16px 100px}

  /* Status bar */
  .status-bar{
    position:sticky;top:0;z-index:50;
    background:var(--cream);
    border-bottom:1px solid var(--line);
    padding:10px 16px;
    display:flex;align-items:center;gap:10px;
    font-size:13px;
    box-shadow:0 2px 8px rgba(13,59,47,0.06);

  .status-dot{width:8px;height:8px;border-radius:50%;background:#999;flex-shrink:0}
  .status-dot.ok{background:#2ea36f;box-shadow:0 0 8px rgba(46,163,111,0.5)}
  .status-dot.err{background:var(--red)}
  .status-text{flex:1;color:var(--muted)}
  .btn-print{
    padding:6px 12px;
    border:1px solid var(--line);
    background:var(--cream);
    border-radius:6px;

  .pos-icon{

    background:linear-gradient(135deg,var(--emerald),var(--emerald-3));
    color:var(--gold-soft);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:14px;
  }
  .pos-meta{flex:1;min-width:0}
  .pos-title{font-weight:600;color:var(--emerald);font-size:15px}
  .pos-default{font-size:12px;color:var(--muted);font-style:italic;margin-top:1px}
  .pos-assigned{font-size:13px;color:var(--gold-2);font-weight:600;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px}

    color:var(--emerald);
    padding:2px 10px;
    border-radius:999px;
    font-size:12px;font-weight:600;

  .pos-body-inner{padding:6px 18px 16px;border-top:1px dashed var(--line)}

  .label{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--gold-2);font-weight:600;margin:12px 0 8px}

  .pic-chips{display:flex;flex-wrap:wrap;gap:6px;min-height:24px;margin-bottom:8px}
  .pic-chip{
    background:var(--emerald);color:var(--gold-soft);
    padding:4px 8px 4px 12px;border-radius:999px;font-size:13px;
    display:inline-flex;align-items:center;gap:6px;

    width:18px;height:18px;border-radius:50%;
    background:rgba(255,255,255,0.18);
    display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:12px;line-height:1;

  .pic-chip.manual{background:var(--gold-2)}
  .pic-empty{color:#999;font-size:13px;font-style:italic;padding:6px 0}

  .pic-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .btn{
    padding:7px 12px;
    border-radius:7px;
    font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:var(--cream);color:var(--emerald);
    font-family:inherit;

  .btn-primary{background:var(--emerald);color:var(--gold-soft);border-color:var(--emerald)}

    border-radius:7px;

    margin-top:8px;

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;
    background:rgba(13,59,47,0.55);
    backdrop-filter:blur(4px);
    display:none;align-items:flex-end;justify-content:center;
    z-index:200;
    padding:0;

  .modal{
    background:var(--cream);
    width:100%;max-width:600px;
    border-radius:16px 16px 0 0;
    max-height:90vh;
    display:flex;flex-direction:column;
    animation:slideUp .3s ease;
  }

  @media(min-width:768px){
    .modal-backdrop{align-items:center}
    .modal{border-radius:16px;max-height:85vh}

  .modal-head{
    padding:16px 20px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
  }
  .modal-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--emerald)}
  .modal-close{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;line-height:1;width:32px;height:32px;border-radius:50%}

  .modal-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

  }
  .filter-pill.active{background:var(--emerald);color:var(--gold-soft);border-color:var(--emerald)}

  .result-list{margin-top:12px}
  .result-item{
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:6px;
    cursor:pointer;
    display:flex;align-items:center;gap:10px;
    transition:all .15s;

  .result-item:hover{border-color:var(--gold);background:rgba(201,169,110,0.05)}
  .result-item.selected{background:var(--gold-soft);border-color:var(--gold)}
  .result-name{flex:1;font-weight:500;font-size:14px;color:var(--ink)}
  .result-meta{font-size:11px;color:var(--muted)}

    width:22px;height:22px;border-radius:50%;
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:transparent;font-weight:700;font-size:14px;
    flex-shrink:0;
  }
  .result-item.selected .result-check{background:var(--emerald);border-color:var(--emerald);color:var(--gold-soft)}

  .manual-section{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}

  .manual-input{
    width:100%;padding:10px 12px;
    border:1px solid var(--line);border-radius:8px;
    font-size:14px;font-family:inherit;background:var(--cream);

  .manual-help{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}

  /* Toast */
  .toast{
    position:fixed;
    bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--emerald);color:var(--gold-soft);
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;
    box-shadow:0 6px 20px rgba(13,59,47,0.3);
    z-index:300;opacity:0;transition:all .3s ease;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast.err{background:var(--red)}

  /* Loading */
  .loading-skeleton{
    background:linear-gradient(90deg,var(--cream-2) 0%,var(--cream) 50%,var(--cream-2) 100%);

    animation:shimmer 1.5s infinite;
    border-radius:7px;height:18px;margin:4px 0;
  }
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* Print */
  @media print{
    .status-bar, .modal-backdrop, .pic-actions, .toast, .pos-chev{display:none !important}
    .pos-body{max-height:none !important}
    .pos{break-inside:avoid;page-break-inside:avoid}
    body{background:#fff;background-image:none}
    .hero{background:#fff;color:#000;border-bottom:2px solid #000}
    .hero h1, .hero h2, .hero-sub{color:#000}
  }
</style>
</head>

// ============ STATE ============
let JAMAAH = []; // semua data jamaah
let ASSIGNMENTS = {}; // {posisi_id: [{id, did, nama_manual, catatan}]}
let activePosId = null;
let pickerSelection = {}; // {did: nama} sementara saat modal terbuka
let pickerFilter = 'all'; // all / Laki-laki / Perempuan / PW1-PW4
let allKelompok = [];

// ============ UTILITAS UI ============
function $(id){return document.getElementById(id)}
function setStatus(text, type){
  const dot = $('statusDot');
  dot.className = 'status-dot ' + (type||'');
  $('statusText').textContent = text;
}
function toast(msg, isErr){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr?' err':'') + ' show';
  setTimeout(()=>t.classList.remove('show'), 2400);
}

// ============ RENDER STRUCTURE ============
function renderStructure(){
  const main = $('mainContent');
  let html = '';
  for(const [key, sec] of Object.entries(STRUCTURE)){
    html += `<section class="section">
      <div class="section-head">
        <div class="section-num">${key}</div>
        <div class="section-label">${sec.title}</div>
        <div class="section-line"></div>
      </div>
      <p style="color:var(--muted);font-size:13px;padding:0 4px 12px">${sec.desc}</p>`;

    for(const p of sec.positions){
      html += `<article class="pos" id="${p.id}" data-pos="${p.id}">
        <button class="pos-head" onclick="togglePos('${p.id}')">
          <div class="pos-icon">${p.icon}</div>
          <div class="pos-meta">
            <div class="pos-title">${p.title}</div>
            <div class="pos-default">Default: ${p.def}</div>
            <div class="pos-assigned" id="chips-${p.id}"><span class="empty">belum ditentukan</span></div>
          </div>
          <div class="pos-chev">▾</div>
        </button>
        <div class="pos-body"><div class="pos-body-inner">
          <div class="label">PIC / Petugas</div>
          <div class="pic-area">
            <div class="pic-chips" id="chipsFull-${p.id}"></div>
            <div class="pic-actions">
              <button class="btn btn-sm btn-primary" onclick="openPicker('${p.id}','${p.title.replace(/'/g,"\\'")}')">＋ Pilih PIC</button>
              <button class="btn btn-sm" onclick="clearPos('${p.id}')">Kosongkan</button>
            </div>
            <textarea class="note-input" id="note-${p.id}" placeholder="Catatan (opsional)…" onchange="saveNote('${p.id}')"></textarea>
          </div>
          <div class="label">Tugas & Tanggung Jawab</div>
          <div class="jd"><ul>${p.jd.map(j=>'<li>'+j+'</li>').join('')}</ul></div>
        </div></div>
      </article>`;
    }
    html += '</section>';
  }
  main.innerHTML = html;
}

function togglePos(id){
  $(id).classList.toggle('is-open');
}

// ============ LOAD DATA ============
async function loadJamaah(){
  setStatus('Memuat data jamaah…');
  const {data, error} = await supa
    .from('jamaah_desa')
    .select('did, nama, kelompok_nama, jenis_kelamin')
    .order('nama');
  if(error){ setStatus('Gagal memuat jamaah: '+error.message, 'err'); return; }
  JAMAAH = data || [];
  allKelompok = [...new Set(JAMAAH.map(j=>j.kelompok_nama).filter(Boolean))].sort();
  setStatus(`Terhubung · ${JAMAAH.length} jamaah dimuat`, 'ok');
}

async function loadAssignments(){
  const {data, error} = await supa
    .from('panitia_idul_adha_1447h')
    .select('*')
    .order('created_at');
  if(error){ console.error(error); return; }
  ASSIGNMENTS = {};
  for(const row of (data||[])){
    if(!ASSIGNMENTS[row.posisi_id]) ASSIGNMENTS[row.posisi_id] = [];
    ASSIGNMENTS[row.posisi_id].push(row);
  }
  renderAllChips();
}

function renderAllChips(){
  for(const sec of Object.values(STRUCTURE)){
    for(const p of sec.positions){
      renderChips(p.id);
    }
  }
}

function renderChips(posId){
  const list = ASSIGNMENTS[posId] || [];
  const headEl = $('chips-'+posId);
  const fullEl = $('chipsFull-'+posId);

  if(list.length===0){
    headEl.innerHTML = '<span class="empty">belum ditentukan</span>';
    fullEl.innerHTML = '<div class="pic-empty">Belum ada PIC dipilih</div>';
  } else {
    // Header: tampilkan max 3 chip ringkas
    const top = list.slice(0,3).map(a=>`<span class="chip">${escapeHtml(a.nama_manual || jamaahName(a.jamaah_did))}</span>`).join('');
    const extra = list.length>3 ? `<span class="chip">+${list.length-3}</span>` : '';
    headEl.innerHTML = top + extra;

    // Full view: semua chip dengan tombol X
    fullEl.innerHTML = list.map(a=>{
      const name = a.nama_manual || jamaahName(a.jamaah_did);
      const cls = a.nama_manual ? 'pic-chip manual' : 'pic-chip';
      return `<span class="${cls}">${escapeHtml(name)}<span class="x" onclick="removePic(${a.id})">×</span></span>`;
    }).join('');

    // Catatan: ambil yang pertama (atau gabungan)
    const notes = list.map(a=>a.catatan).filter(Boolean);
    const noteEl = $('note-'+posId);
    if(noteEl) noteEl.value = notes.join(' · ');
  }
}

function jamaahName(did){
  const j = JAMAAH.find(x=>x.did===did);
  return j ? j.nama : '(jamaah tidak ditemukan)';
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// ============ PICKER MODAL ============
function openPicker(posId, posTitle){
  activePosId = posId;
  $('modalPosTitle').textContent = 'PIC: ' + posTitle;
  $('searchInput').value = '';
  $('manualInput').value = '';

  // Build filter pills
  const pills = [
    {key:'all', label:'Semua'},
    {key:'Laki-laki', label:'Laki-laki'},
    {key:'Perempuan', label:'Perempuan'},
    ...allKelompok.map(k=>({key:'kel:'+k, label:k}))
  ];
  $('filterRow').innerHTML = pills.map(p=>
    `<button class="filter-pill${pickerFilter===p.key?' active':''}" data-key="${p.key}" onclick="setFilter('${p.key}')">${p.label}</button>`
  ).join('');

  // Pre-select existing
  pickerSelection = {};
  const cur = ASSIGNMENTS[posId] || [];
  for(const a of cur){
    if(a.jamaah_did) pickerSelection[a.jamaah_did] = jamaahName(a.jamaah_did);
  }

  filterJamaah();
  $('picModal').classList.add('show');
  document.body.style.overflow='hidden';
}

function closePicker(){
  $('picModal').classList.remove('show');
  document.body.style.overflow='';
  activePosId = null;
}

function setFilter(key){
  pickerFilter = key;
  document.querySelectorAll('.filter-pill').forEach(el=>{
    el.classList.toggle('active', el.dataset.key===key);
  });
  filterJamaah();
}

function filterJamaah(){
  const q = $('searchInput').value.toLowerCase().trim();
  let list = JAMAAH;

  if(pickerFilter==='Laki-laki') list = list.filter(j=>j.jenis_kelamin==='Laki-laki');
  else if(pickerFilter==='Perempuan') list = list.filter(j=>j.jenis_kelamin==='Perempuan');
  else if(pickerFilter.startsWith('kel:')){
    const k = pickerFilter.slice(4);
    list = list.filter(j=>j.kelompok_nama===k);
  }

  if(q) list = list.filter(j => (j.nama||'').toLowerCase().includes(q));

  list = list.slice(0, 80); // max 80 result for performance

  const html = list.map(j=>{
    const sel = pickerSelection[j.did] ? ' selected' : '';
    return `<div class="result-item${sel}" onclick="toggleSelect('${j.did}','${escapeJs(j.nama)}')">
      <div class="result-check">✓</div>
      <div class="result-name">${escapeHtml(j.nama)}</div>
      <div class="result-meta">${escapeHtml(j.kelompok_nama||'')} · ${j.jenis_kelamin==='Laki-laki'?'L':'P'}</div>
    </div>`;
  }).join('');

  $('resultList').innerHTML = html || '<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">Tidak ada hasil</div>';
}

function escapeJs(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}

function toggleSelect(did, nama){
  if(pickerSelection[did]) delete pickerSelection[did];
  else pickerSelection[did] = nama;
  filterJamaah();
}

let pendingManual = []; // nama manual yg ditambah saat modal terbuka

function addManual(){
  const v = $('manualInput').value.trim();
  if(!v){ toast('Isi nama dulu', true); return; }
  pendingManual.push(v);
  $('manualInput').value = '';
  toast('Ditambahkan: '+v);
}

async function savePicker(){
  if(!activePosId) return;
  const posId = activePosId;

  // Cek apakah ada PIC existing yang dihapus (tidak ada di selection baru)
  const existing = ASSIGNMENTS[posId] || [];
  const existingDids = existing.filter(a=>a.jamaah_did).map(a=>a.jamaah_did);
  const existingManual = existing.filter(a=>a.nama_manual).map(a=>a.nama_manual);
  const newDids = Object.keys(pickerSelection);
  const removedDids = existingDids.filter(d => !newDids.includes(d));
  const removedManual = existingManual.filter(m => !pendingManual.includes(m));
  const hasRemoval = removedDids.length > 0 || removedManual.length > 0;

  if(hasRemoval){
    const k = prompt('Kode:');
    if(k !== 'pw354'){ if(k!==null) toast('Operasi dibatalkan', true); return; }
  }

  setStatus('Menyimpan…');

  // Delete existing for this position
  const {error:delErr} = await supa.from('panitia_idul_adha_1447h').delete().eq('posisi_id', posId);
  if(delErr){ setStatus('Gagal hapus lama: '+delErr.message, 'err'); toast('Gagal simpan', true); return; }

  // Insert new
  const rows = [];
  for(const did of Object.keys(pickerSelection)){
    rows.push({ posisi_id: posId, jamaah_did: did, nama_manual: null });
  }
  for(const m of pendingManual){
    rows.push({ posisi_id: posId, jamaah_did: null, nama_manual: m });
  }

  if(rows.length>0){
    const {data, error} = await supa.from('panitia_idul_adha_1447h').insert(rows).select();
    if(error){ setStatus('Gagal simpan: '+error.message, 'err'); toast('Gagal simpan', true); return; }
    ASSIGNMENTS[posId] = data;
  } else {
    ASSIGNMENTS[posId] = [];
  }

  pendingManual = [];
  renderChips(posId);
  setStatus(`Terhubung · ${JAMAAH.length} jamaah dimuat`, 'ok');
  toast('Tersimpan ✓');
  closePicker();
}

async function removePic(rowId){
  const k = prompt('Kode:');
  if(k !== 'pw354'){ if(k!==null) toast('Operasi dibatalkan', true); return; }
  const {error} = await supa.from('panitia_idul_adha_1447h').delete().eq('id', rowId);
  if(error){ toast('Gagal hapus: '+error.message, true); return; }
  for(const posId of Object.keys(ASSIGNMENTS)){
    ASSIGNMENTS[posId] = ASSIGNMENTS[posId].filter(a=>a.id!==rowId);
    renderChips(posId);
  }
  toast('Dihapus');
}

async function clearPos(posId){
  const k = prompt('Kode:');
  if(k !== 'pw354'){ if(k!==null) toast('Operasi dibatalkan', true); return; }
  const {error} = await supa.from('panitia_idul_adha_1447h').delete().eq('posisi_id', posId);
  if(error){ toast('Gagal: '+error.message, true); return; }
  ASSIGNMENTS[posId] = [];
  renderChips(posId);
  toast('Dikosongkan');
}

async function saveNote(posId){
  const note = $('note-'+posId).value.trim();
  const list = ASSIGNMENTS[posId] || [];
  if(list.length===0){
    // No PIC yet — create a row with only note
    if(!note) return;
    const {data, error} = await supa.from('panitia_idul_adha_1447h').insert([{posisi_id:posId, catatan:note}]).select();
    if(error){ toast('Gagal simpan catatan', true); return; }
    ASSIGNMENTS[posId] = data;
    renderChips(posId);
    toast('Catatan tersimpan');
    return;
  }
  // Update first row's catatan
  const firstId = list[0].id;
  const {error} = await supa.from('panitia_idul_adha_1447h').update({catatan:note}).eq('id', firstId);
  if(error){ toast('Gagal simpan catatan', true); return; }
  list[0].catatan = note;
  toast('Catatan tersimpan');
}

// ============ INIT ============
async function init(){
  renderStructure();
  await loadJamaah();
  await loadAssignments();
}

// Close modal on backdrop click
document.addEventListener('click', e=>{
  if(e.target.id==='picModal') closePicker();
});

init();
</script>
