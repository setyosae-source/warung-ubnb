async function sha256(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(v)));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}

function signedHtml(html,signers,d){const doc=new DOMParser().parseFromString('<div id="root">'+html+'</div>','text/html');const root=doc.getElementById('root');for(const role of ['pemodal','ketua','bendahara']){const x=signers?.[role],slot=root.querySelector(`[data-signature-slot="${role}"]`),meta=root.querySelector(`[data-signature-meta="${role}"]`);if(slot&&x?.status==='signed'&&x.signature_data){const max=role==='ketua'?'112px':'150px',mh=role==='ketua'?'68px':'58px';slot.innerHTML=`<img src="${x.signature_data}" alt="TTD ${esc(roleLabel(role))}" style="display:block;max-width:${max};max-height:${mh};width:auto;height:auto;object-fit:contain;margin:auto">`;if(meta)meta.textContent='Signed digital · '+fmt(x.signed_at)}else if(slot){slot.textContent='Menunggu TTD Digital';if(meta)meta.textContent=''}}if(d?.status==='complete'){const v=document.createElement('div');v.className='verify-band';v.innerHTML=`<strong>DOKUMEN DITANDATANGANI DIGITAL LENGKAP</strong><br>Kode verifikasi: ${esc(d.verify_code)}<br>Hash dokumen: ${esc(d.document_hash)}<br>Selesai: ${fmt(d.completed_at)}`;root.appendChild(v)}return root.innerHTML}

async function verifikasiPIN(){const pin=document.getElementById('pin').value.trim(),er=document.getElementById('pin-err');er.classList.add('hidden');if(!/^\d{6}$/.test(pin)){er.textContent='PIN harus 6 digit.';er.classList.remove('hidden');return}try{tokenHash=await sha256(token);pinHash=await sha256(pin);const{data,error}=await sb.rpc('bmt_get_penyertaan_signer',{p_token_hash:tokenHash,p_pin_hash:pinHash});if(error)throw error;if(!data?.ok)throw new Error(data?.message||'Verifikasi gagal');document.getElementById('pin-card').classList.add('hidden');document.getElementById('status-card').classList.remove('hidden');renderData(data)}catch(e){er.textContent=e.message||String(e);er.classList.remove('hidden')}}
async function reloadData(){if(!tokenHash||!pinHash)return;try{const{data,error}=await sb.rpc('bmt_get_penyertaan_signer',{p_token_hash:tokenHash,p_pin_hash:pinHash});if(error)throw error;if(data?.ok)renderData(data)}catch(e){console.warn(e)}}
function startPoll(){stopPoll();pollTimer=setInterval(reloadData,15000)}function stopPoll(){if(pollTimer)clearInterval(pollTimer);pollTimer=null}
let ctx=null,drawing=false,last=null;
function initCanvas(){const c=document.getElementById('sig');const ratio=Math.max(1,window.devicePixelRatio||1);const rect=c.getBoundingClientRect();c.width=Math.round(rect.width*ratio);c.height=Math.round(rect.height*ratio);ctx=c.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=2.3;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';clearSig();if(c.dataset.bound)return;c.dataset.bound='1';c.addEventListener('pointerdown',e=>{drawing=true;hasInk=true;c.setPointerCapture(e.pointerId);const r=c.getBoundingClientRect();last={x:e.clientX-r.left,y:e.clientY-r.top}});c.addEventListener('pointermove',e=>{if(!drawing)return;const r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top};ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});const up=()=>{drawing=false;last=null};c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up)}
function clearSig(){const c=document.getElementById('sig');if(!ctx)ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);hasInk=false}
async function kirimTtd(){if(!current||!tokenHash||!pinHash)return;if(!document.getElementById('agree').checked){alert('Centang persetujuan terlebih dahulu.');return}if(!hasInk){alert('Tanda tangan masih kosong.');return}const btn=document.getElementById('btn-sign');btn.disabled=true;btn.textContent='Menyimpan...';try{const sig=document.getElementById('sig').toDataURL('image/png');const sigHash=await sha256(sig);const{data,error}=await sb.rpc('bmt_complete_penyertaan_signer',{p_token_hash:tokenHash,p_pin_hash:pinHash,p_signer_name:current.signer_name,p_consent_text:current.consent_text,p_signature_data:sig,p_signature_sha256:sigHash,p_user_agent:navigator.userAgent});if(error)throw error;if(!data?.ok)throw new Error(data?.message||'Gagal menyimpan tanda tangan');await reloadData();alert(data.status==='complete'?'Tanda tangan tersimpan. Dokumen sekarang lengkap.':'Tanda tangan berhasil disimpan. Menunggu pihak lain menandatangani.')}catch(e){alert(e.message||String(e))}finally{btn.disabled=false;btn.textContent='✅ Tandatangani Dokumen'}}
async function modeVerify(){try{const{data,error}=await sb.rpc('bmt_verify_penyertaan_signed',{p_verify_code:verifyCode});if(error)throw error;if(!data?.ok)throw new Error(data?.message||'Dokumen tidak dapat diverifikasi');document.getElementById('status-card').classList.remove('hidden');renderData(data)}catch(e){document.getElementById('status-card').classList.remove('hidden');setMsg(e.message||String(e),'err')}}

async function captureDokumen(){
  const src=document.getElementById('paper');
  if(!src||!src.innerHTML.trim())throw new Error('Dokumen belum tersedia');
  if(typeof html2canvas!=='function')throw new Error('Mesin render belum termuat. Periksa koneksi internet lalu muat ulang halaman.');
  await tungguGambarDokumen(src);

  // Penting untuk Android: jangan memakai scrollY negatif. Pada beberapa browser Samsung/Chrome
  // hal itu membuat canvas berukuran benar tetapi seluruh isinya putih.
  const rect=src.getBoundingClientRect();
  const scale=(navigator.deviceMemory&&navigator.deviceMemory<=2)?1.35:1.7;
  const opts={
    backgroundColor:'#ffffff',scale,useCORS:true,allowTaint:false,logging:false,imageTimeout:5000,
    width:Math.ceil(src.scrollWidth||rect.width),height:Math.ceil(src.scrollHeight||rect.height),
    onclone:doc=>gayaCapturePeny(doc,doc.getElementById('paper'))
  };
  let c=await html2canvas(src,opts);
  if(canvasAdaIsi(c))return c;

  // Fallback khusus mobile: render salinan pada posisi 0,0 agar tidak terpengaruh scroll/overflow halaman.
  const stage=document.createElement('div');stage.id='capture-stage-peny';
  stage.style.width=Math.max(600,Math.round(rect.width||650))+'px';
  const clone=src.cloneNode(true);clone.id='paper-capture-fallback';clone.style.maxWidth='none';clone.style.width='100%';clone.style.margin='0';
  stage.appendChild(clone);document.body.appendChild(stage);
  try{
    await tungguGambarDokumen(clone);
    const r2=clone.getBoundingClientRect();
    c=await html2canvas(clone,{backgroundColor:'#ffffff',scale,useCORS:true,allowTaint:false,logging:false,imageTimeout:5000,width:Math.ceil(clone.scrollWidth||r2.width),height:Math.ceil(clone.scrollHeight||r2.height),scrollX:0,scrollY:0,onclone:doc=>gayaCapturePeny(doc,doc.getElementById('paper-capture-fallback'))});
  }finally{stage.remove()}
  if(!canvasAdaIsi(c))throw new Error('Render dokumen masih kosong. Tutup halaman, buka kembali link, lalu coba lagi.');
  return c;
}
function canvasAdaIsi(c){
  try{
    const probe=document.createElement('canvas');probe.width=40;probe.height=60;
    const px=probe.getContext('2d',{willReadFrequently:true});px.fillStyle='#fff';px.fillRect(0,0,40,60);px.drawImage(c,0,0,40,60);
    const d=px.getImageData(0,0,40,60).data;let nonWhite=0;
    for(let i=0;i<d.length;i+=4){if(d[i+3]>10&&(d[i]<242||d[i+1]<242||d[i+2]<242))nonWhite++}
    return nonWhite>8;
  }catch(e){return true}
}
function potongCanvasA4(c){
  // Rasio area cetak A4 dengan margin 7 mm kiri/kanan dan 8 mm atas/bawah.
  const usableW=196,usableH=281;
  const pagePx=Math.max(1,Math.floor(c.width*(usableH/usableW)));
  const out=[];
  for(let y=0;y<c.height;y+=pagePx){
    const h=Math.min(pagePx,c.height-y),pc=document.createElement('canvas');pc.width=c.width;pc.height=h;
    const x=pc.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,pc.width,pc.height);x.drawImage(c,0,y,c.width,h,0,0,c.width,h);
    out.push(pc);
  }
  return out;
}
async function downloadJPG(){

    const c=await captureDokumen();
    const a=document.createElement('a');a.download=`penyertaan-${current?.no_penyertaan||'signed'}.jpg`;a.href=c.toDataURL('image/jpeg',.94);document.body.appendChild(a);a.click();a.remove();
  }catch(e){alert('Gagal membuat JPG: '+(e.message||e))}
}
async function downloadPDF(){
  const btn=[...document.querySelectorAll('#final-actions button')].find(b=>b.textContent.includes('Simpan PDF'));
  const old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='⏳ Membuat PDF...'}
  try{
    const c=await captureDokumen();
    const JsPDF=window.jspdf?.jsPDF;
    if(!JsPDF)throw new Error('Mesin PDF belum termuat. Periksa koneksi internet lalu muat ulang halaman.');
    const pages=potongCanvasA4(c);
    const pdf=new JsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
    const marginX=7,marginY=8,usableW=196;
    pages.forEach((pc,i)=>{
      if(i)pdf.addPage('a4','portrait');
      const hMm=pc.height*usableW/pc.width;
      // JPEG dipilih agar Android tidak kehabisan memori ketika dokumen panjang.
      const img=pc.toDataURL('image/jpeg',.94);
      pdf.addImage(img,'JPEG',marginX,marginY,usableW,hMm,undefined,'FAST');
    });
    pdf.setProperties({title:`Penyertaan ${current?.no_penyertaan||''}`,subject:'Akad Penyertaan BMT UBNB Perwira'});
    pdf.save(`penyertaan-${current?.no_penyertaan||'signed'}.pdf`);
  }catch(e){alert('Gagal membuat PDF: '+(e.message||e))}
  finally{if(btn){btn.disabled=false;btn.textContent=old||'⬇️ Simpan PDF'}}
}
async function printDokumen(){
  const buttons=[...document.querySelectorAll('#final-actions button')];
  const btn=buttons.find(b=>b.textContent.includes('Print'));const old=btn?.textContent;
  if(btn){btn.disabled=true;btn.textContent='⏳ Menyiapkan Print...'}
  try{
    const c=await captureDokumen(),pages=potongCanvasA4(c),host=document.getElementById('print-raster-host');
    host.innerHTML='';
    pages.forEach(pc=>{const img=document.createElement('img');img.className='print-raster-page';img.alt='Halaman dokumen penyertaan';img.src=pc.toDataURL('image/jpeg',.96);host.appendChild(img)});
    // Print raster: warna/header/tabel menjadi bagian dari gambar, tidak bergantung opsi "background graphics" Android.
    document.documentElement.classList.add('printing-raster');
    const cleanup=()=>{document.documentElement.classList.remove('printing-raster');host.innerHTML=''};
    window.addEventListener('afterprint',cleanup,{once:true});
    setTimeout(()=>{window.print();setTimeout(()=>{if(document.documentElement.classList.contains('printing-raster'))cleanup()},15000)},120);
  }catch(e){alert('Gagal menyiapkan print: '+(e.message||e))}
  finally{if(btn){btn.disabled=false;btn.textContent=old||'🖨️ Print'}}
}
