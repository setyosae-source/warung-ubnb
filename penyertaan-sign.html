<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TTD Digital Penyertaan — BMT UBNB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--h:#0f4c2a;--h2:#1a6640;--e:#c8963e;--bg:#f5f5f0;--b:#ddd8cc;--m:#6b7280;--r:#dc2626;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#1a1a1a}.top{background:linear-gradient(135deg,var(--h),var(--h2));color:white;padding:16px;text-align:center}.top h1{font-size:17px;margin:0;color:#f0d080}.top p{font-size:11px;margin:4px 0 0;opacity:.8}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--b);border-radius:10px;padding:15px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}.hidden{display:none!important}label{display:block;font-size:11px;font-weight:bold;color:var(--h);margin-bottom:5px}input{width:100%;padding:12px;border:2px solid var(--b);border-radius:8px;font-size:16px}button{border:0;border-radius:8px;padding:11px 14px;font-weight:bold;cursor:pointer}.primary{background:var(--h);color:white}.sec{background:white;border:1px solid var(--b);color:#222}.gold{background:var(--e);color:white}.danger{background:var(--r);color:white}.full{width:100%}.msg{font-size:12px;line-height:1.5;padding:10px 12px;border-radius:8px;background:#eff6ff;border:1px solid #93c5fd;color:#1e40af;margin-bottom:10px}.msg.ok{background:#f0fdf4;border-color:#86efac;color:#166534}.msg.warn{background:#fffbeb;border-color:#fbbf24;color:#92400e}.msg.err{background:#fef2f2;border-color:#fca5a5;color:#991b1b}.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.role{border:1px solid var(--b);border-radius:8px;padding:8px 5px;text-align:center;font-size:10px;background:white}.role strong{display:block;color:var(--h);margin-bottom:3px}.role.signed{background:#f0fdf4;border-color:#86efac}.role.pending{background:#fffbeb;border-color:#fbbf24}#paper{background:white;width:100%;max-width:650px;margin:0 auto;padding:18px;box-shadow:0 4px 20px rgba(0,0,0,.15);font-size:9pt;line-height:1.5;border-top:5px solid #1a5c3a}.paper-wrap{background:#e8e4df;padding:12px;border-radius:8px;overflow:auto}.ppr-header{background:linear-gradient(135deg,#1a5c3a,#2e8b57);color:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;border-radius:4px}.ppr-header h2{font-size:13pt;margin:0}.ppr-header p{font-size:7.5pt;opacity:.8;margin:2px 0 0}.ppr-header h3{font-size:11pt;color:#f0d080;margin:0;text-align:right}.ppr-no{font-size:7pt;opacity:.8;text-align:right}.ppr-sec{background:#f0f7f4;color:#1a5c3a;font-size:7.5pt;font-weight:bold;letter-spacing:1px;text-transform:uppercase;padding:5px 9px;border-left:4px solid #1a5c3a;margin:10px 0 0;border-bottom:1px solid #c8e6d8}table.ppr-data{width:100%;border-collapse:collapse}table.ppr-data td{padding:5px 7px;border:1px solid #ddd;font-size:8.5pt}table.ppr-data td.lbl{background:#f5f5f0;color:#666;width:29%;font-size:7.5pt}table.ppr-data td.hl{background:#edf7f0;font-weight:bold;color:#1a5c3a}.ppr-footer{text-align:center;font-size:6.5pt;color:#999;margin-top:10px;font-style:italic}.verify-band{margin-top:10px;border:1px dashed #1a5c3a;background:#f0fdf4;padding:7px 9px;font-size:6.8pt;color:#166534;word-break:break-all}.sig-box{border:2px dashed #b7b7b7;border-radius:8px;background:white;touch-action:none;width:100%;height:180px;display:block}.consent{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5;margin:10px 0}.consent input{width:auto;margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1;min-width:130px}.meta{font-size:11px;color:var(--m);line-height:1.45}@media(max-width:600px){.wrap{padding:8px}#paper{padding:12px;font-size:8pt}.paper-wrap{padding:5px}.ppr-header{padding:9px 10px}.progress{grid-template-columns:1fr 1fr 1fr}}@media print{body{background:white}.top,.no-print,.card.no-print{display:none!important}.wrap{max-width:none;padding:0}.paper-wrap{padding:0;background:white}#paper{box-shadow:none;border-top:0;max-width:none;padding:0}@page{size:A4 portrait;margin:10mm}}
</style>
</head>
<body>
<div class="top"><h1>✍️ Tanda Tangan Digital Penyertaan</h1><p>BMT UBNB PERWIRA · Akad Syariah</p></div>
<div class="wrap">
  <div id="pin-card" class="card no-print hidden"><div class="msg">Masukkan PIN 6 digit yang dikirim bersama link pribadi Anda.</div><label>PIN Verifikasi</label><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"><button class="primary full" style="margin-top:10px" onclick="verifikasiPIN()">Buka Dokumen</button><div id="pin-err" class="msg err hidden" style="margin-top:10px"></div></div>
  <div id="status-card" class="card no-print hidden"><div id="main-status" class="msg"></div><div id="roles" class="progress"></div><div id="who" class="meta"></div></div>
  <div id="doc-card" class="card hidden" style="padding:0;background:transparent;border:0;box-shadow:none"><div class="paper-wrap"><div id="paper"></div></div></div>
  <div id="sign-card" class="card no-print hidden"><h3 style="margin:0 0 6px;color:var(--h);font-size:15px">Bubuhkan Tanda Tangan</h3><div id="consent-text" class="meta"></div><canvas id="sig" class="sig-box"></canvas><div class="actions"><button class="sec" onclick="clearSig()">↺ Hapus</button></div><label class="consent"><input type="checkbox" id="agree"><span>Saya menyatakan telah membaca dokumen sampai selesai dan menyetujui pernyataan persetujuan di atas. Tanda tangan ini saya bubuhkan sendiri secara sadar.</span></label><button id="btn-sign" class="primary full" onclick="kirimTtd()">✅ Tandatangani Dokumen</button></div>
  <div id="final-actions" class="card no-print hidden"><div class="msg ok">✅ Dokumen lengkap. Semua pihak telah menandatangani. Dokumen final dapat disimpan oleh masing-masing pihak.</div><div class="actions"><button class="primary" onclick="downloadPDF()">⬇️ Simpan PDF</button><button class="gold" onclick="downloadJPG()">🖼️ Simpan JPG</button><button class="sec" onclick="window.print()">🖨️ Print</button></div></div>
</div>
<script>
const SURL='https://skltbmcrqutevmtcxqxj.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrbHRibWNycXV0ZXZtdGN4cXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzM5ODIsImV4cCI6MjA5MTI0OTk4Mn0._nogUZg5UylVyP45QTGYw69u76pNxGryj9hZORIfE_A';
const sb=supabase.createClient(SURL,SKEY);
let token=new URLSearchParams(location.search).get('t')||'';
let verifyCode=new URLSearchParams(location.search).get('v')||'';
let tokenHash='',pinHash='',current=null,pollTimer=null,hasInk=false;
const roleLabel=r=>r==='pemodal'?'Pemodal / Shahibul Maal':r==='ketua'?'Ketua UBNB':'Bendahara UBNB';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>{if(!v)return'';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})};
async function sha256(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(v)));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function setMsg(text,cls=''){const e=document.getElementById('main-status');e.className='msg '+cls;e.textContent=text}
function renderRoles(d){const sg=d?.signers||{};document.getElementById('roles').innerHTML=['pemodal','ketua','bendahara'].map(r=>{const x=sg[r]||{},st=x.status||'pending';return `<div class="role ${st==='signed'?'signed':'pending'}"><strong>${roleLabel(r)}</strong>${st==='signed'?'✅ Signed':'⏳ Menunggu'}${x.signed_at?`<div style="font-size:8px;margin-top:2px">${fmt(x.signed_at)}</div>`:''}</div>`}).join('')}
function signedHtml(html,signers,d){const doc=new DOMParser().parseFromString('<div id="root">'+html+'</div>','text/html');const root=doc.getElementById('root');for(const role of ['pemodal','ketua','bendahara']){const x=signers?.[role],slot=root.querySelector(`[data-signature-slot="${role}"]`),meta=root.querySelector(`[data-signature-meta="${role}"]`);if(slot&&x?.status==='signed'&&x.signature_data){const max=role==='ketua'?'112px':'150px',mh=role==='ketua'?'68px':'58px';slot.innerHTML=`<img src="${x.signature_data}" alt="TTD ${esc(roleLabel(role))}" style="display:block;max-width:${max};max-height:${mh};width:auto;height:auto;object-fit:contain;margin:auto">`;if(meta)meta.textContent='Signed digital · '+fmt(x.signed_at)}else if(slot){slot.textContent='Menunggu TTD Digital';if(meta)meta.textContent=''}}if(d?.status==='complete'){const v=document.createElement('div');v.className='verify-band';v.innerHTML=`<strong>DOKUMEN DITANDATANGANI DIGITAL LENGKAP</strong><br>Kode verifikasi: ${esc(d.verify_code)}<br>Hash dokumen: ${esc(d.document_hash)}<br>Selesai: ${fmt(d.completed_at)}`;root.appendChild(v)}return root.innerHTML}
function renderData(d){current=d;renderRoles(d);document.getElementById('doc-card').classList.remove('hidden');document.getElementById('paper').innerHTML=signedHtml(d.document_html,d.signers,d);const role=d.signer_role;document.getElementById('who').innerHTML=role?`Anda masuk sebagai <strong>${esc(roleLabel(role))}</strong> — ${esc(d.signer_name)} · No. Penyertaan <strong>${esc(d.no_penyertaan)}</strong>`:`Dokumen final · No. Penyertaan <strong>${esc(d.no_penyertaan)}</strong>`;if(d.status==='complete'){setMsg('Dokumen lengkap — 3/3 pihak sudah menandatangani.','ok');document.getElementById('sign-card').classList.add('hidden');document.getElementById('final-actions').classList.remove('hidden');stopPoll()}else if(role&&d.signer_status==='signed'){setMsg(`Tanda tangan Anda sudah tersimpan. Menunggu pihak lain (${d.sign_count}/3). Halaman akan memeriksa status otomatis.`,'warn');document.getElementById('sign-card').classList.add('hidden');document.getElementById('final-actions').classList.add('hidden');startPoll()}else if(role){setMsg(`Dokumen siap ditandatangani sebagai ${roleLabel(role)}. Status saat ini ${d.sign_count}/3.`,'');document.getElementById('consent-text').textContent=d.consent_text||'';document.getElementById('sign-card').classList.remove('hidden');document.getElementById('final-actions').classList.add('hidden');setTimeout(initCanvas,20)}else{setMsg('Dokumen belum lengkap.','warn')}}
async function verifikasiPIN(){const pin=document.getElementById('pin').value.trim(),er=document.getElementById('pin-err');er.classList.add('hidden');if(!/^\d{6}$/.test(pin)){er.textContent='PIN harus 6 digit.';er.classList.remove('hidden');return}try{tokenHash=await sha256(token);pinHash=await sha256(pin);const{data,error}=await sb.rpc('bmt_get_penyertaan_signer',{p_token_hash:tokenHash,p_pin_hash:pinHash});if(error)throw error;if(!data?.ok)throw new Error(data?.message||'Verifikasi gagal');document.getElementById('pin-card').classList.add('hidden');document.getElementById('status-card').classList.remove('hidden');renderData(data)}catch(e){er.textContent=e.message||String(e);er.classList.remove('hidden')}}
async function reloadData(){if(!tokenHash||!pinHash)return;try{const{data,error}=await sb.rpc('bmt_get_penyertaan_signer',{p_token_hash:tokenHash,p_pin_hash:pinHash});if(error)throw error;if(data?.ok)renderData(data)}catch(e){console.warn(e)}}
function startPoll(){stopPoll();pollTimer=setInterval(reloadData,15000)}function stopPoll(){if(pollTimer)clearInterval(pollTimer);pollTimer=null}
let ctx=null,drawing=false,last=null;
function initCanvas(){const c=document.getElementById('sig');const ratio=Math.max(1,window.devicePixelRatio||1);const rect=c.getBoundingClientRect();c.width=Math.round(rect.width*ratio);c.height=Math.round(rect.height*ratio);ctx=c.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=2.3;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';clearSig();if(c.dataset.bound)return;c.dataset.bound='1';c.addEventListener('pointerdown',e=>{drawing=true;hasInk=true;c.setPointerCapture(e.pointerId);const r=c.getBoundingClientRect();last={x:e.clientX-r.left,y:e.clientY-r.top}});c.addEventListener('pointermove',e=>{if(!drawing)return;const r=c.getBoundingClientRect(),p={x:e.clientX-r.left,y:e.clientY-r.top};ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});const up=()=>{drawing=false;last=null};c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up)}
function clearSig(){const c=document.getElementById('sig');if(!ctx)ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);hasInk=false}
async function kirimTtd(){if(!current||!tokenHash||!pinHash)return;if(!document.getElementById('agree').checked){alert('Centang persetujuan terlebih dahulu.');return}if(!hasInk){alert('Tanda tangan masih kosong.');return}const btn=document.getElementById('btn-sign');btn.disabled=true;btn.textContent='Menyimpan...';try{const sig=document.getElementById('sig').toDataURL('image/png');const sigHash=await sha256(sig);const{data,error}=await sb.rpc('bmt_complete_penyertaan_signer',{p_token_hash:tokenHash,p_pin_hash:pinHash,p_signer_name:current.signer_name,p_consent_text:current.consent_text,p_signature_data:sig,p_signature_sha256:sigHash,p_user_agent:navigator.userAgent});if(error)throw error;if(!data?.ok)throw new Error(data?.message||'Gagal menyimpan tanda tangan');await reloadData();alert(data.status==='complete'?'Tanda tangan tersimpan. Dokumen sekarang lengkap.':'Tanda tangan berhasil disimpan. Menunggu pihak lain menandatangani.')}catch(e){alert(e.message||String(e))}finally{btn.disabled=false;btn.textContent='✅ Tandatangani Dokumen'}}
async function modeVerify(){try{const{data,error}=await sb.rpc('bmt_verify_penyertaan_signed',{p_verify_code:verifyCode});if(error)throw error;if(!data?.ok)throw new Error(data?.message||'Dokumen tidak dapat diverifikasi');document.getElementById('status-card').classList.remove('hidden');renderData(data)}catch(e){document.getElementById('status-card').classList.remove('hidden');setMsg(e.message||String(e),'err')}}
async function downloadJPG(){const el=document.getElementById('paper');const c=await html2canvas(el,{backgroundColor:'#fff',scale:2,useCORS:true,logging:false});const a=document.createElement('a');a.download=`penyertaan-${current?.no_penyertaan||'signed'}.jpg`;a.href=c.toDataURL('image/jpeg',.94);a.click()}
async function downloadPDF(){const el=document.getElementById('paper');const opt={margin:[8,7,8,7],filename:`penyertaan-${current?.no_penyertaan||'signed'}.pdf`,image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}};await html2pdf().set(opt).from(el).save()}
(function init(){if(verifyCode){modeVerify();return}if(!token){document.getElementById('status-card').classList.remove('hidden');setMsg('Link tanda tangan tidak lengkap.','err');return}document.getElementById('pin-card').classList.remove('hidden');document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')verifikasiPIN()})})();
</script>
</body></html>
