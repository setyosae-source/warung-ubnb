}

 function build(children,date,sessions,reports=[],exceptions=[],name='',group=''){
 const ranks={H:4,S:3,I:2,TK:1,'-':0};const state={H:'Hadir',S:'Sakit',I:'Izin',TK:'Tanpa Keterangan','-':'Tidak ada jadwal'};

 }
