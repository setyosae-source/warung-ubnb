<!-- DROPDOWN SATUAN STANDAR INDONESIA -->
<!-- Copy snippet ini ke form tambah/edit barang di warung.html -->

<div class="irow">
  <label>Satuan</label>
  <select id="form-satuan" required>
    <optgroup label="🔢 Unit/Satuan">
      <option value="pcs">Pcs (Pieces/Buah)</option>
      <option value="unit">Unit/Set</option>
      <option value="porsi">Porsi</option>
    </optgroup>
    
    <optgroup label="📦 Kemasan">
      <option value="dus">Dus/Box/Karton</option>
      <option value="pak">Pak/Pack/Bungkus</option>
      <option value="lusin">Lusin (12 pcs)</option>
      <option value="botol">Botol</option>
      <option value="kaleng">Kaleng</option>
      <option value="sachet">Sachet</option>
    </optgroup>
    
    <optgroup label="⚖️ Berat (qty desimal)">
      <option value="kg">Kilogram (kg)</option>
      <option value="gram">Gram</option>
      <option value="ons">Ons (100 gram)</option>
    </optgroup>
    
    <optgroup label="🧪 Volume (qty desimal)">
      <option value="liter">Liter</option>
      <option value="ml">Mililiter (ml)</option>
    </optgroup>
    
    <optgroup label="📏 Panjang (qty desimal)">
      <option value="meter">Meter</option>
      <option value="cm">Centimeter</option>
    </optgroup>
  </select>
</div>

<!-- CATATAN PENTING: -->
<!-- Satuan dengan qty desimal (bisa 0.5, 1.5, dst): -->
<!-- - kg, gram, ons -->
<!-- - liter, ml -->
<!-- - meter, cm -->
<!-- 
<!-- Satuan integer (hanya 1, 2, 3, dst): -->
<!-- - pcs, unit, porsi, dus, pak, lusin, botol, kaleng, sachet -->

<!-- LOGIC DI JAVASCRIPT -->
<script>
// Fungsi helper untuk cek apakah satuan support desimal
function isSatuanDesimal(satuan) {
  const desimalUnits = ['kg', 'gram', 'ons', 'liter', 'ml', 'meter', 'cm'];
  return desimalUnits.includes(satuan.toLowerCase());
}

// Contoh penggunaan saat render form:
function setInputQtyBySatuan(satuan) {
  const qtyInput = document.getElementById('qty-input');
  if (isSatuanDesimal(satuan)) {
    qtyInput.step = '0.1';
    qtyInput.min = '0.1';
    qtyInput.placeholder = 'Contoh: 1.5';
  } else {
    qtyInput.step = '1';
    qtyInput.min = '1';
    qtyInput.placeholder = 'Contoh: 5';
  }
}

// Event listener saat user pilih satuan
document.getElementById('form-satuan').addEventListener('change', function() {
  setInputQtyBySatuan(this.value);
});
</script>
