<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SJS — Setengah Jam Saja</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --hijau: #1a6b3a;
    --hijau-muda: #2d9255;
    --hijau-terang: #4db87a;
    --emas: #c8922a;
    --emas-muda: #e8b84b;
    --krem: #f5f0e8;
    --krem-gelap: #ede5d4;
    --putih: #fdfaf5;
    --teks: #1a1a1a;
    --teks-ringan: #5a5a5a;
    --merah: #c0392b;
    --biru: #2471a3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--krem);
    color: var(--teks);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--hijau);
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .logo-bulat {
    width: 46px; height: 46px;
    background: var(--emas);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Amiri', serif;
    font-size: 22px; font-weight: 700;
    color: var(--hijau);
    flex-shrink: 0;
  }
  header h1 {
    font-family: 'Amiri', serif;
    font-size: 22px; font-weight: 700;
    line-height: 1.2;
  }
  header p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

  /* NAV */
  nav {
    background: var(--hijau-muda);
    display: flex;
    overflow-x: auto;
  }
  nav button {
    background: none; border: none;
    color: rgba(255,255,255,0.75);
    padding: 12px 20px;
    font-family: 'Tajawal', sans-serif;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }
  nav button.aktif {
    color: white;
    border-bottom-color: var(--emas-muda);
    background: rgba(0,0,0,0.15);
  }

  /* HALAMAN */
  .halaman { display: none; padding: 20px; max-width: 720px; margin: 0 auto; }
  .halaman.tampil { display: block; }

  /* CARD */
  .card {
    background: var(--putih);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border: 1px solid var(--krem-gelap);
  }
  .card-judul {
    font-family: 'Amiri', serif;
    font-size: 18px; font-weight: 700;
    color: var(--hijau);
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--krem-gelap);
    display: flex; align-items: center; gap: 8px;
  }

  /* FORM CONTROLS */
  label { display: block; font-size: 13px; font-weight: 500; color: var(--teks-ringan); margin-bottom: 5px; }
  select, input[type=text] {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #d8d0c4;
    border-radius: 8px;
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    background: var(--putih);
    color: var(--teks);
    transition: border-color 0.2s;
    appearance: none;
    -webkit-appearance: none;
  }
  select:focus, input:focus { outline: none; border-color: var(--hijau-muda); }
  .form-baris { margin-bottom: 14px; }
  .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* TOMBOL */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 22px;
    border-radius: 8px;
    font-family: 'Tajawal', sans-serif;
    font-size: 15px; font-weight: 700;
    cursor: pointer; border: none;
    transition: all 0.2s;
  }
  .btn-hijau { background: var(--hijau); color: white; }
  .btn-hijau:hover { background: var(--hijau-muda); }
  .btn-emas { background: var(--emas); color: white; }
  .btn-emas:hover { background: var(--emas-muda); }
  .btn-abu { background: #e0d8cc; color: var(--teks); }
  .btn-abu:hover { background: #cec6ba; }
  .btn-full { width: 100%; justify-content: center; }

  /* TABEL ANAK */
  .tabel-anak { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tabel-anak th {
    background: var(--hijau);
    color: white;
    padding: 10px 10px;
    text-align: left;
    font-weight: 500;
  }
  .tabel-anak th:last-child, .tabel-anak td:last-child { text-align: center; }
  .tabel-anak tr:nth-child(even) td { background: #f7f3ec; }
  .tabel-anak td { padding: 10px; border-bottom: 1px solid #e8e0d4; vertical-align: middle; }
  .tabel-anak td select { font-size: 13px; padding: 7px 8px; }

  /* BADGE */
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
  }
  .badge-hijau { background: #d4edda; color: #155724; }
  .badge-merah { background: #f8d7da; color: #721c24; }
  .badge-emas { background: #fff3cd; color: #856404; }
  .badge-abu { background: #e2e3e5; color: #383d41; }

  /* KEGIATAN CHECKBOX */
  .kegiatan-grid {
    display: grid; grid-template-columns: 1fr;
    gap: 6px; margin-top: 8px;
  }
  .kegiatan-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 10px;
    background: var(--krem);
    border-radius: 8px;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 13px;
    line-height: 1.4;
  }
  .kegiatan-item:has(input:checked) {
    border-color: var(--hijau-muda);
    background: #e8f5ee;
  }
  .kegiatan-item input[type=checkbox] {
    margin-top: 2px; flex-shrink: 0;
    accent-color: var(--hijau);
    width: 16px; height: 16px;
  }

  /* PERSEN RADIO */
  .persen-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-top: 6px; }
  .persen-item {
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 6px;
    background: var(--krem);
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
  }
  .persen-item:has(input:checked) {
    border-color: var(--hijau);
    background: #e8f5ee;
  }
  .persen-item input[type=radio] { display: none; }
  .persen-angka { font-size: 22px; font-weight: 700; color: var(--hijau); }
  .persen-ket { font-size: 11px; color: var(--teks-ringan); }

  /* REKAP KELOMPOK */
  .kelompok-card {
    background: var(--putih);
    border-radius: 12px;
    margin-bottom: 14px;
    overflow: hidden;
    border: 1px solid var(--krem-gelap);
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .kelompok-header {
    background: var(--hijau);
    color: white;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .kelompok-header h3 { font-family: 'Amiri', serif; font-size: 17px; }
  .kelompok-body { padding: 12px 16px; }
  .progress-bar-wrap {
    background: #e8e0d4;
    border-radius: 20px;
    height: 10px;
    margin: 8px 0;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, var(--hijau), var(--hijau-terang));
    transition: width 0.6s ease;
  }
  .stat-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--teks-ringan); margin-bottom: 4px; }
  .keluarga-list { margin-top: 10px; }
  .keluarga-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 4px;
    font-size: 13px;
  }
  .keluarga-row.sudah { background: #e8f5ee; }
  .keluarga-row.belum { background: #fef5f5; }

  /* PRESENTASI */
  #hal-presentasi {
    background: var(--hijau);
    min-height: calc(100vh - 120px);
    padding: 30px 20px;
    color: white;
    max-width: 100%;
  }
  .slide {
    display: none;
    animation: fadeIn 0.4s ease;
  }
  .slide.tampil { display: block; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

  .slide-judul {
    font-family: 'Amiri', serif;
    font-size: 32px;
    text-align: center;
    margin-bottom: 8px;
    color: var(--emas-muda);
  }
  .slide-sub { text-align: center; opacity: 0.85; font-size: 16px; margin-bottom: 30px; }

  .slide-angka {
    font-family: 'Amiri', serif;
    font-size: 80px;
    font-weight: 700;
    text-align: center;
    color: var(--emas-muda);
    line-height: 1;
  }
  .slide-label { text-align: center; font-size: 18px; opacity: 0.9; margin-top: 8px; }

  .kelompok-slide-item {
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .kel-nama { flex: 1; font-size: 15px; font-weight: 500; }
  .kel-bar-wrap { flex: 2; background: rgba(255,255,255,0.2); border-radius: 20px; height: 14px; overflow: hidden; }
  .kel-bar-fill { height: 100%; border-radius: 20px; background: var(--emas-muda); transition: width 0.8s ease; }
  .kel-pct { min-width: 45px; text-align: right; font-weight: 700; font-size: 15px; color: var(--emas-muda); }

  .nav-slide {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 30px;
    flex-wrap: wrap;
  }
  .btn-slide {
    background: rgba(255,255,255,0.15);
    border: 1.5px solid rgba(255,255,255,0.4);
    color: white;
    padding: 10px 22px;
    border-radius: 8px;
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-slide:hover { background: rgba(255,255,255,0.25); }
  .btn-slide.aktif { background: var(--emas); border-color: var(--emas); }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 30px;
    color: var(--teks-ringan);
    font-size: 15px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--krem-gelap);
    border-top-color: var(--hijau);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ALERT */
  .alert { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
  .alert-sukses { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
  .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

  .kelas-label { font-size: 11px; color: var(--teks-ringan); }
  .nama-anak-cell { font-weight: 500; }
  .usia-cell { color: var(--teks-ringan); font-size: 13px; }

  /* SUDAH LAPOR */
  .sudah-lapor-row td { background: #e8f5ee !important; }
  .sudah-lapor-row .check-icon { color: var(--hijau); font-size: 18px; }

  .pilih-bulan-tahun {
    display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap;
  }
  .pilih-bulan-tahun > div { flex: 1; min-width: 120px; }

  .info-keluarga {
    background: linear-gradient(135deg, var(--hijau), var(--hijau-muda));
    color: white;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .info-keluarga strong { font-size: 17px; font-family: 'Amiri', serif; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.tampil { display: flex; }
  .modal-box {
    background: var(--putih);
    border-radius: 14px;
    padding: 24px;
    max-width: 500px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-judul {
    font-family: 'Amiri', serif;
    font-size: 20px;
    color: var(--hijau);
    margin-bottom: 16px;
  }

  .ornamen {
    text-align: center;
    font-size: 24px;
    margin: 10px 0;
    opacity: 0.4;
    color: var(--emas);
  }

  .chip-kelas {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
  }
  .chip-caberawit { background: #ffeaa7; color: #6c5900; }
  .chip-pra { background: #a8e6cf; color: #1a5c3a; }
  .chip-remaja-a { background: #dfe6e9; color: #2d3436; }
  .chip-remaja-b { background: #fd79a8; color: #6d1635; }
</style>
</head>
<body>

<header>
  <div class="logo-bulat">س</div>
  <div>
    <h1>SJS — Setengah Jam Saja</h1>
    <p>Program PPG Desa Perwira · Bekasi Timur</p>
  </div>
</header>

<nav>

    <div class="form-2col">

// Init

  const now = new Date();

  ['sel-bulan','rek-bulan','prs-bulan'].forEach(id => {

      const o = document.createElement('option');
      o.value = y; o.textContent = y;
      sel.appendChild(o);
    }
    sel.value = thn;
  });
};

function hitungUsiaStr(tgl) {
  if (!tgl) return '—';
  const lahir = new Date(tgl);
  const now = new Date();
  let usia = now.getFullYear() - lahir.getFullYear();
  const bln = now.getMonth() - lahir.getMonth();
  if (bln < 0 || (bln === 0 && now.getDate() < lahir.getDate())) usia--;
  return usia + ' th';
}

function hitungUsiaAngka(tgl) {
  if (!tgl) return 99;
  const lahir = new Date(tgl);
  const now = new Date();
  let usia = now.getFullYear() - lahir.getFullYear();
  const bln = now.getMonth() - lahir.getMonth();
  if (bln < 0 || (bln === 0 && now.getDate() < lahir.getDate())) usia--;
  return usia;
}

function kelasFromUsiaStr(usia) {
  if (usia <= 12) return 'Caberawit';
  if (usia <= 15) return 'Pra Remaja';
  if (usia <= 18) return 'Remaja A';
  return 'Remaja B';
}

function chipKelas(kelas) {
  const map = {
    'Caberawit':'chip-caberawit','Pra Remaja':'chip-pra',
    'Remaja A':'chip-remaja-a','Remaja B':'chip-remaja-b'
  };
  return `<span class="chip-kelas ${map[kelas]||''}">${kelas}</span>`;
}

async function supa(endpoint, opts={}) {
  const r = await fetch(SUPA_URL + '/rest/v1/' + endpoint, {
    headers: {
      'apikey': SUPA_KEY,
      'Authorization': 'Bearer ' + SUPA_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation',
      ...opts.headers
    },
    ...opts
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.message || r.statusText);
  }
  return r.status === 204 ? null : r.json();
}

// ===== LOAD KELUARGA =====
async function loadKeluarga() {
  const kel = document.getElementById('sel-kelompok').value;
  if (!kel) { document.getElementById('wrap-keluarga').style.display='none'; return; }

  const data = await supa(`jamaah_desa?select=nama_kk&kelompok=eq.${kel}&status_nikah=eq.Belum Menikah&order=nama_kk`);

  // Ambil nama KK unik
  const kks = [...new Set(data.map(d => d.nama_kk).filter(Boolean))].sort();

  const sel = document.getElementById('sel-keluarga');
  sel.innerHTML = '<option value="">— Pilih Keluarga —</option>';
  kks.forEach(kk => {
    const o = document.createElement('option');
    o.value = kk; o.textContent = kk;
    sel.appendChild(o);
  });
  document.getElementById('wrap-keluarga').style.display = 'block';
  document.getElementById('area-anak').innerHTML = '';
  document.getElementById('area-aksi').style.display = 'none';
}

// ===== LOAD ANAK KELUARGA =====
async function loadAnakKeluarga() {
  const kk = document.getElementById('sel-keluarga').value;
  const kelompok = document.getElementById('sel-kelompok').value;
  const bulan = document.getElementById('sel-bulan').value;
  const tahun = document.getElementById('sel-tahun').value;

  if (!kk) { document.getElementById('area-anak').innerHTML=''; return; }

  document.getElementById('area-anak').innerHTML = `<div class="loading"><div class="spinner"></div>Memuat data anak...</div>`;

  // Ambil anak belum menikah dari keluarga ini
  const anak = await supa(`jamaah_desa?select=did,nama,tgl_lahir,jenis_kelamin,status_nikah&nama_kk=eq.${encodeURIComponent(kk)}&status_nikah=eq.Belum Menikah&order=tgl_lahir`);

  // Ambil laporan yg sudah ada bulan ini
  const sudah = await supa(`sjs_laporan?select=jamaah_did,persen,kegiatan,kelas_sjs&bulan=eq.${bulan}&tahun=eq.${tahun}&kelompok=eq.${kelompok}`);
  laporan = {};
  sudah.forEach(l => { laporan[l.jamaah_did] = l; });

  anakList = anak;
  dataAnak = {};

  if (anak.length === 0) {
    document.getElementById('area-anak').innerHTML = `
      <div class="card"><div class="alert alert-info">
        Tidak ada anak belum menikah di keluarga ini yang perlu laporan SJS.
      </div></div>`;
    document.getElementById('area-aksi').style.display = 'none';
    return;
  }

  // Pre-fill dari laporan yang sudah ada
  anak.forEach(a => {
    if (laporan[a.did]) {
      dataAnak[a.did] = { persen: laporan[a.did].persen, kegiatan: laporan[a.did].kegiatan || [] };
    } else {
      dataAnak[a.did] = { persen: null, kegiatan: [] };
    }
  });

  renderTabelAnak(kk, kelompok);
}

function renderTabelAnak(kk, kelompok) {
  const bulan = document.getElementById('sel-bulan').value;
  const tahun = document.getElementById('sel-tahun').value;

  let html = `
  <div class="info-keluarga">
    <strong>${kk}</strong><br>
    Kelompok ${kelompok} · Laporan ${BULAN_NAMA[+bulan]} ${tahun}
  </div>
  <div class="card" style="padding:0; overflow:hidden">
    <table class="tabel-anak">
      <thead><tr>
        <th>Nama Anak</th>
        <th>Usia</th>
        <th>Kelas</th>
        <th>Status</th>
        <th>Aksi</th>
      </tr></thead>
      <tbody>`;

  anakList.forEach(a => {
    const usia = hitungUsiaAngka(a.tgl_lahir);
    const usiaStr = hitungUsiaStr(a.tgl_lahir);
    const kelas = kelasFromUsiaStr(usia);
    const d = dataAnak[a.did];
    const sudahIsi = d && d.persen !== null;
    const sudahDB = laporan[a.did];

    html += `<tr id="row-${a.did}" class="${sudahDB ? 'sudah-lapor-row' : ''}">
      <td class="nama-anak-cell">${a.nama}<br><span class="kelas-label">${a.jenis_kelamin||''}</span></td>
      <td class="usia-cell">${usiaStr}</td>
      <td>${chipKelas(kelas)}</td>
      <td>`;

    if (sudahIsi) {
      html += `<span class="badge badge-hijau">${d.persen}%</span>`;
    } else if (sudahDB) {
      html += `<span class="badge badge-emas">${laporan[a.did].persen}%</span>`;
    } else {
      html += `<span class="badge badge-merah">Belum</span>`;
    }

    html += `</td>
      <td><button class="btn btn-hijau" style="padding:6px 14px; font-size:13px" onclick="bukaModal('${a.did}','${a.nama.replace(/'/g,"\\'")}',${usia})">
        ${sudahIsi||sudahDB ? '✏️' : '➕'}
      </button></td>
    </tr>`;
  });

  html += `</tbody></table></div>`;
  document.getElementById('area-anak').innerHTML = html;
  document.getElementById('area-aksi').style.display = 'block';
}

// ===== MODAL =====
function bukaModal(did, nama, usia) {
  modalDid = did;
  const kelas = kelasFromUsiaStr(usia);
  document.getElementById('modal-nama-anak').textContent = nama + ' · ' + chipKelas(kelas).replace(/<[^>]+>/g,'') + ' · ' + usia + ' th';

  // Persen
  const d = dataAnak[did] || { persen: null, kegiatan: [] };
  const persenHtml = [25,50,75,100].map(p => `
    <label class="persen-item">
      <input type="radio" name="persen-modal" value="${p}" ${d.persen===p?'checked':''}>
      <span class="persen-angka">${p}%</span>
      <span class="persen-ket">${p/25}× kegiatan</span>
    </label>`).join('');
  document.getElementById('modal-persen').innerHTML = persenHtml;

  // Kegiatan
  const kegHtml = KEGIATAN_LIST.map((k,i) => `
    <label class="kegiatan-item">
      <input type="checkbox" value="${k}" ${d.kegiatan.includes(k)?'checked':''}>
      <span>${k}</span>
    </label>`).join('');
  document.getElementById('modal-kegiatan-list').innerHTML = kegHtml;

  document.getElementById('modal-kegiatan').classList.add('tampil');
}

function tutupModal() {
  document.getElementById('modal-kegiatan').classList.remove('tampil');
  modalDid = null;
}

function simpanDataAnak() {
  const persen = document.querySelector('input[name="persen-modal"]:checked');
  if (!persen) { alert('Pilih persentase dulu!'); return; }
  const kegiatan = [...document.querySelectorAll('#modal-kegiatan-list input:checked')].map(i=>i.value);
  if (kegiatan.length === 0) { alert('Pilih minimal 1 kegiatan!'); return; }

  dataAnak[modalDid] = { persen: +persen.value, kegiatan };

  // Update badge di tabel
  const row = document.getElementById('row-' + modalDid);
  if (row) {
    const badgeCell = row.querySelector('td:nth-child(4)');
    badgeCell.innerHTML = `<span class="badge badge-hijau">${persen.value}%</span>`;
  }

  tutupModal();
}

// ===== SIMPAN LAPORAN =====
async function simpanLaporan() {
  const bulan = +document.getElementById('sel-bulan').value;
  const tahun = +document.getElementById('sel-tahun').value;
  const kelompok = document.getElementById('sel-kelompok').value;
  const kk = document.getElementById('sel-keluarga').value;

  const belumIsi = anakList.filter(a => !dataAnak[a.did] || dataAnak[a.did].persen === null);
  if (belumIsi.length > 0) {
    if (!confirm(`${belumIsi.length} anak belum diisi. Lanjut simpan yang sudah diisi saja?`)) return;
  }

  const rows = anakList.filter(a => dataAnak[a.did] && dataAnak[a.did].persen !== null).map(a => {
    const usia = hitungUsiaAngka(a.tgl_lahir);
    return {
      bulan, tahun,
      jamaah_did: a.did,
      nama_anak: a.nama,
      nama_kk: kk,
      kelompok,
      kelas_sjs: kelasFromUsiaStr(usia),
      persen: dataAnak[a.did].persen,
      kegiatan: dataAnak[a.did].kegiatan,
      operator: kk
    };
  });

  if (rows.length === 0) { alert('Tidak ada data untuk disimpan.'); return; }

  try {
    // Upsert
    await supa('sjs_laporan?on_conflict=jamaah_did,bulan,tahun', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' },
      body: JSON.stringify(rows)
    });

    document.getElementById('area-anak').insertAdjacentHTML('afterbegin',
      `<div class="alert alert-sukses">✅ Laporan ${rows.length} anak berhasil disimpan!</div>`);

    // Reload
    setTimeout(() => loadAnakKeluarga(), 1500);
  } catch(e) {
    document.getElementById('area-anak').insertAdjacentHTML('afterbegin',
      `<div class="alert alert-error">❌ Gagal: ${e.message}</div>`);
  }
}

// ===== REKAP =====
async function loadRekap() {
  const bulan = +document.getElementById('rek-bulan').value;
  const tahun = +document.getElementById('rek-tahun').value;
  document.getElementById('area-rekap').innerHTML = `<div class="loading"><div class="spinner"></div>Memuat rekap...</div>`;

  // Semua anak belum menikah
  const semuaAnak = await supa('jamaah_desa?select=did,nama,nama_kk,kelompok&status_nikah=eq.Belum Menikah&order=kelompok,nama_kk');

  // Laporan bulan ini
  const laporanBulan = await supa(`sjs_laporan?select=jamaah_did,persen,nama_kk,kelompok&bulan=eq.${bulan}&tahun=eq.${tahun}`);
  const sudahSet = new Set(laporanBulan.map(l => l.jamaah_did));

  // Group by kelompok
  const byKel = {};
  semuaAnak.forEach(a => {
    const k = a.kelompok || '?';
    if (!byKel[k]) byKel[k] = {};
    const kk = a.nama_kk || 'Tanpa KK';
    if (!byKel[k][kk]) byKel[k][kk] = { anak: [], sudah: 0 };
    byKel[k][kk].anak.push(a);
    if (sudahSet.has(a.did)) byKel[k][kk].sudah++;
  });

  const kelKeys = Object.keys(byKel).sort((a,b) => +a - +b);

  let html = `<div class="card"><div class="card-judul">Rekap ${BULAN_NAMA[bulan]} ${tahun}</div>`;

  // Summary bar
  const totalKeluarga = Object.values(byKel).reduce((s,v) => s + Object.keys(v).length, 0);
  const sudahKeluarga = Object.values(byKel).reduce((s,kks) =>
    s + Object.values(kks).filter(kk => kk.sudah === kk.anak.length && kk.anak.length > 0).length, 0);
  const pctGlobal = totalKeluarga ? Math.round(sudahKeluarga/totalKeluarga*100) : 0;

  html += `<div class="stat-row"><span>Total Keluarga</span><strong>${totalKeluarga}</strong></div>
    <div class="stat-row"><span>Sudah Lapor Lengkap</span><strong style="color:var(--hijau)">${sudahKeluarga}</strong></div>
    <div class="stat-row"><span>Belum / Sebagian</span><strong style="color:var(--merah)">${totalKeluarga-sudahKeluarga}</strong></div>
    <div class="progress-bar-wrap" style="height:14px; margin:10px 0">
      <div class="progress-bar-fill" style="width:${pctGlobal}%"></div>
    </div>
    <div style="text-align:center; font-size:18px; font-weight:700; color:var(--hijau)">${pctGlobal}% keluarga sudah lapor</div>
  </div>`;

  kelKeys.forEach(k => {
    const kks = byKel[k];
    const kkList = Object.entries(kks).sort((a,b) => a[0].localeCompare(b[0]));
    const totalKK = kkList.length;
    const sudahKK = kkList.filter(([,v]) => v.sudah === v.anak.length && v.anak.length > 0).length;
    const pct = totalKK ? Math.round(sudahKK/totalKK*100) : 0;

    html += `<div class="kelompok-card">
      <div class="kelompok-header">
        <h3>Kelompok ${k}</h3>
        <span class="badge ${pct===100?'badge-hijau':pct>50?'badge-emas':'badge-merah'}">${pct}%</span>
      </div>
      <div class="kelompok-body">
        <div class="stat-row"><span>Sudah lapor</span><span>${sudahKK}/${totalKK} keluarga</span></div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="keluarga-list">`;

    kkList.forEach(([kkNama, data]) => {
      const selesai = data.sudah === data.anak.length;
      const sebagian = data.sudah > 0 && !selesai;
      html += `<div class="keluarga-row ${selesai?'sudah':'belum'}">
        <span>${kkNama}</span>
        <div>
          <span class="badge ${selesai?'badge-hijau':sebagian?'badge-emas':'badge-merah'}">
            ${data.sudah}/${data.anak.length} anak
          </span>
        </div>
      </div>`;
    });

    html += `</div></div></div>`;
  });

  document.getElementById('area-rekap').innerHTML = html;
}

// ===== PRESENTASI =====
let slideData = [];
let slideIdx = 0;

async function loadPresentasi() {
  const bulan = +document.getElementById('prs-bulan').value;
  const tahun = +document.getElementById('prs-tahun').value;

  document.getElementById('area-slide').innerHTML = `<div class="loading" style="color:rgba(255,255,255,0.7)"><div class="spinner"></div>Memuat data...</div>`;

  const semuaAnak = await supa('jamaah_desa?select=did,nama,nama_kk,kelompok&status_nikah=eq.Belum Menikah&order=kelompok,nama_kk');
  const laporanBulan = await supa(`sjs_laporan?select=jamaah_did,persen&bulan=eq.${bulan}&tahun=eq.${tahun}`);
  const sudahSet = new Set(laporanBulan.map(l => l.jamaah_did));

  // Group kelompok
  const byKel = {};
  semuaAnak.forEach(a => {
    const k = a.kelompok || '?';
    if (!byKel[k]) byKel[k] = { total: 0, sudah: 0, kks: new Set(), kk_sudah: new Set() };
    const kk = a.nama_kk || '?';
    byKel[k].total++;
    byKel[k].kks.add(kk);
    if (sudahSet.has(a.did)) {
      byKel[k].sudah++;
      byKel[k].kk_sudah.add(kk);
    }
  });

  const totalAnak = semuaAnak.length;
  const totalSudah = laporanBulan.length;
  const totalKK = [...new Set(semuaAnak.map(a=>a.nama_kk))].length;
  const kkSudah = [...new Set(laporanBulan.map(l=>l.nama_kk||''))].length;

  slideData = [
    { tipe: 'cover', bulan, tahun },
    { tipe: 'global', totalAnak, totalSudah, totalKK, kkSudah },
    ...Object.entries(byKel).sort((a,b)=>+a[0]-+b[0]).map(([k,v]) => ({
      tipe: 'kelompok', kelompok: k,
      totalAnak: v.total, sudahAnak: v.sudah,
      totalKK: v.kks.size, sudahKK: v.kk_sudah.size,
      pct: v.kks.size ? Math.round(v.kk_sudah.size/v.kks.size*100) : 0
    })),
    { tipe: 'summary', byKel }
  ];

  slideIdx = 0;
  renderSlide();
}

function renderSlide() {
  const s = slideData[slideIdx];
  if (!s) return;
  let html = '';

  if (s.tipe === 'cover') {
    html = `<div class="slide tampil">
      <div style="text-align:center; padding:40px 0">
        <div style="font-size:60px">🌙</div>
        <div class="slide-judul" style="font-size:38px">Laporan SJS</div>
        <div class="slide-judul" style="font-size:28px; color:white">Setengah Jam Saja</div>
        <div class="slide-sub">${BULAN_NAMA[s.bulan]} ${s.tahun}</div>
        <div class="slide-sub" style="margin-top:20px; opacity:0.6">PPG Desa Perwira · Bekasi Timur</div>
      </div>
    </div>`;
  }

  else if (s.tipe === 'global') {
    const pctAnak = Math.round(s.totalSudah/s.totalAnak*100);
    const pctKK = Math.round(s.kkSudah/s.totalKK*100);
    html = `<div class="slide tampil">
      <div class="slide-judul">Ringkasan Keseluruhan</div>
      <div class="slide-sub">Semua Kelompok · Desa Perwira</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:500px; margin:0 auto">
        <div style="background:rgba(255,255,255,0.1); border-radius:14px; padding:24px; text-align:center">
          <div class="slide-angka">${pctAnak}%</div>
          <div class="slide-label">anak sudah lapor</div>
          <div style="font-size:13px; opacity:0.7; margin-top:6px">${s.totalSudah} dari ${s.totalAnak}</div>
        </div>
        <div style="background:rgba(255,255,255,0.1); border-radius:14px; padding:24px; text-align:center">
          <div class="slide-angka">${pctKK}%</div>
          <div class="slide-label">keluarga sudah lapor</div>
          <div style="font-size:13px; opacity:0.7; margin-top:6px">${s.kkSudah} dari ${s.totalKK}</div>
        </div>
      </div>
    </div>`;
  }

  else if (s.tipe === 'kelompok') {
    html = `<div class="slide tampil">
      <div class="slide-judul">Kelompok ${s.kelompok}</div>
      <div class="slide-sub">Detail Kehadiran Laporan</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:500px; margin:0 auto 20px">
        <div style="background:rgba(255,255,255,0.1); border-radius:14px; padding:20px; text-align:center">
          <div class="slide-angka" style="font-size:60px">${s.pct}%</div>
          <div class="slide-label">keluarga lapor</div>
          <div style="font-size:13px; opacity:0.7; margin-top:4px">${s.sudahKK}/${s.totalKK} KK</div>
        </div>
        <div style="background:rgba(255,255,255,0.1); border-radius:14px; padding:20px; text-align:center">
          <div class="slide-angka" style="font-size:60px">${Math.round(s.sudahAnak/s.totalAnak*100)}%</div>
          <div class="slide-label">anak terlaporkan</div>
          <div style="font-size:13px; opacity:0.7; margin-top:4px">${s.sudahAnak}/${s.totalAnak} anak</div>
        </div>
      </div>
      <div class="progress-bar-wrap" style="height:20px; background:rgba(255,255,255,0.15); max-width:500px; margin:0 auto">
        <div class="progress-bar-fill" style="width:${s.pct}%; background:var(--emas-muda)"></div>
      </div>
    </div>`;
  }

  else if (s.tipe === 'summary') {
    const items = Object.entries(s.byKel).sort((a,b)=>+a[0]-+b[0]).map(([k,v]) => {
      const pct = v.kks.size ? Math.round(v.kk_sudah.size/v.kks.size*100) : 0;
      return { k, pct, sudah: v.kk_sudah.size, total: v.kks.size };
    });

    html = `<div class="slide tampil">
      <div class="slide-judul">Perbandingan Semua Kelompok</div>
      <div class="slide-sub">% Keluarga yang sudah lapor</div>
      <div style="max-width:540px; margin:0 auto">
        ${items.map(it => `
          <div class="kelompok-slide-item">
            <div class="kel-nama">Kelompok ${it.k}</div>
            <div class="kel-bar-wrap"><div class="kel-bar-fill" style="width:${it.pct}%"></div></div>
            <div class="kel-pct">${it.pct}%</div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  document.getElementById('area-slide').innerHTML = html + `
    <div class="nav-slide">
      ${slideIdx > 0 ? `<button class="btn-slide" onclick="slideNav(-1)">◀ Sebelumnya</button>` : ''}
      <span style="color:rgba(255,255,255,0.6); font-size:13px; align-self:center">${slideIdx+1} / ${slideData.length}</span>
      ${slideIdx < slideData.length-1 ? `<button class="btn-slide btn-emas" onclick="slideNav(1)">Selanjutnya ▶</button>` : '<span style="color:var(--emas-muda); font-weight:700; align-self:center">✓ Selesai</span>'}
    </div>`;
}

function slideNav(dir) {
  slideIdx = Math.max(0, Math.min(slideData.length-1, slideIdx+dir));
  renderSlide();
}

// NAV TAB
function pindahHal(id) {
  document.querySelectorAll('.halaman').forEach(h => h.classList.remove('tampil'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('aktif'));
  document.getElementById('hal-'+id).classList.add('tampil');
  event.target.classList.add('aktif');

  if (id === 'rekap') loadRekap();
}
