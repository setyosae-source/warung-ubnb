<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Survei Tur Kelompok 4</title>
<style>
:root{
  --bg:#f4f7f6;--card:#fff;--ink:#172220;--muted:#6e7c79;--line:#dce7e4;
  --brand:#0f766e;--brand2:#115e59;--soft:#e9f6f3;--shadow:0 14px 38px rgba(15,55,49,.08)
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#e8f5f2 0,#f7f9f8 260px,#f4f7f6 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}
.wrap{max-width:650px;margin:0 auto;padding:18px 14px 50px}
.hero{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;border-radius:24px;padding:23px 20px;box-shadow:0 18px 44px rgba(15,118,110,.2)}
.hero h1{font-size:27px;line-height:1.15;margin:0}
.card{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:21px;margin-top:16px}
.progress{height:6px;background:#e4eeeb;border-radius:99px;overflow:hidden;margin-bottom:18px}.progress>div{height:100%;background:var(--brand);width:0;transition:.2s}
.qno{font-size:12px;color:var(--brand);font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.question{font-size:21px;line-height:1.35;font-weight:850;margin:0 0 16px}
.options{display:grid;gap:10px}
.option{width:100%;border:1.5px solid var(--line);border-radius:15px;padding:14px 15px;background:#fff;color:var(--ink);font:inherit;font-weight:780;text-align:left;cursor:pointer;transition:.12s}
.option:hover{border-color:#9fc9c1}.option.selected{border-color:var(--brand);background:var(--soft);color:var(--brand2);box-shadow:0 0 0 2px rgba(15,118,110,.06)}
.input-wrap{display:flex;align-items:center;border:1.5px solid #cfdcd9;border-radius:14px;background:#fbfdfc;overflow:hidden}
.input-wrap span{padding:0 0 0 14px;color:#52645f;font-weight:800}
.input-wrap input{border:0;outline:0;width:100%;padding:14px;font:inherit;background:transparent}
textarea,input[type=text]{width:100%;border:1.5px solid #cfdcd9;background:#fbfdfc;border-radius:14px;padding:14px;font:inherit;outline:none}
textarea{min-height:120px;resize:vertical}
textarea:focus,input[type=text]:focus,.input-wrap:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.1);background:#fff}
.help{font-size:12px;color:var(--muted);line-height:1.45;margin:7px 0 0}
.actions{display:flex;gap:9px;margin-top:17px}
.btn{border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:850;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;flex:1}
.btn.secondary{background:#edf3f1;color:#40534f}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{display:none;margin-top:12px;padding:11px 12px;border-radius:12px;font-size:13px}
.status.show{display:block}.status.err{background:#fff1f1;border:1px solid #efc1c1;color:#922}
.success{text-align:center;padding:34px 20px}.success .tick{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;background:#e8f8ee;color:#137a43;font-size:32px;font-weight:900}.success h2{margin:0;font-size:23px}
@media(max-width:520px){.hero h1{font-size:24px}.question{font-size:19px}.card{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero"><h1>Survei Tur Kelompok 4</h1></section>
  <section class="card" id="surveyCard">
    <div class="progress"><div id="progressBar"></div></div>
    <div class="qno" id="qno"></div>
    <div class="question" id="question"></div>
    <div id="answerArea"></div>
    <div class="actions">
      <button class="btn secondary" id="backBtn" type="button" style="display:none">Kembali</button>
      <button class="btn primary" id="nextBtn" type="button" style="display:none">Lanjut</button>
    </div>
    <div id="status" class="status"></div>
  </section>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/+esm';

const supabase=createClient("https://skltbmcrqutevmtcxqxj.supabase.co","sb_publishable_-_oDmSzXdOTzEBcthp8v9w_p3zA1VXX");
const EVENT_CODE="PW4_TUR_2026_11";
const $=s=>document.querySelector(s);

let deviceKey=localStorage.getItem('pw4_tur_survey_device_key');
if(!deviceKey){deviceKey=crypto.randomUUID();localStorage.setItem('pw4_tur_survey_device_key',deviceKey)}

const state={};
let history=[];
let current='registered';

const QUESTIONS={
  registered:{
    text:'Apakah Anda sudah mendaftar Tur Kelompok 4?',
    type:'choice',
    options:[['yes','Sudah daftar'],['no','Belum daftar']],
    next:v=>v==='yes'?'common_cost':'interest'
  },

  interest:{
    text:'Apakah Anda tertarik untuk ikut?',
    type:'choice',
    key:'interested',
    options:[['yes','Ya, tertarik'],['maybe','Masih mungkin / mempertimbangkan'],['no','Tidak tertarik']],
    next:v=>v==='no'?'not_interested_reason':'not_registered_reason'
  },

  not_interested_reason:{
    text:'Apa alasan utama Anda tidak tertarik ikut?',
    type:'choice',
    key:'not_interested_reason',
    options:[
      ['time','Tanggal / waktu tidak cocok'],
      ['cost','Biaya'],
      ['activity','Tujuan / kegiatan kurang menarik'],
      ['transport','Transportasi'],
      ['food','Makan / konsumsi'],
      ['family','Kondisi keluarga / anak'],
      ['work','Pekerjaan / sekolah'],
      ['other','Lainnya']
    ],
    next:v=>'deep_no_'+v
  },
  deep_no_time:{
    text:'Kalau tanggal atau waktunya diubah, apakah Anda akan mempertimbangkan untuk ikut?',
    type:'choice',
    key:'no_time_if_changed',
    options:[['yes','Ya'],['maybe','Mungkin'],['no','Tetap tidak']],
    next:v=>v==='no'?'deep_no_time_note':'deep_no_time_pref'
  },
  deep_no_time_pref:{
    text:'Waktu seperti apa yang lebih memungkinkan?',
    type:'text',
    key:'no_time_preference',
    placeholder:'Contoh: minggu berikutnya, cukup 1 hari, berangkat pagi, dll.',
    next:()=> 'common_cost'
  },
  deep_no_time_note:{
    text:'Apa alasan lain yang membuat Anda tetap tidak ingin ikut?',
    type:'text',
    key:'no_time_other_reason',
    placeholder:'Tuliskan alasannya',
    next:()=> 'common_cost'
  },
  deep_no_cost:{
    text:'Kalau biayanya lebih ringan, apakah Anda akan mempertimbangkan untuk ikut?',
    type:'choice',
    key:'no_cost_if_lower',
    options:[['yes','Ya'],['maybe','Mungkin'],['no','Tetap tidak']],
    next:v=>v==='no'?'deep_no_cost_reason':'deep_no_cost_amount'
  },
  deep_no_cost_amount:{
    text:'Berapa biaya maksimal per orang yang masih sanggup?',
    type:'money',
    key:'affordable_price',
    next:()=> 'common_cost'
  },
  deep_no_cost_reason:{
    text:'Selain biaya, apa alasan yang membuat Anda tidak ingin ikut?',
    type:'text',
    key:'no_cost_other_reason',
    placeholder:'Tuliskan alasannya',
    next:()=> 'common_cost'
  },
  deep_no_activity:{
    text:'Kegiatan atau tujuan seperti apa yang lebih membuat Anda tertarik?',
    type:'text',
    key:'preferred_activity',
    placeholder:'Tuliskan saran kegiatan/tujuan',
    next:()=> 'common_cost'
  },
  deep_no_transport:{
    text:'Transportasi seperti apa yang membuat Anda lebih nyaman untuk ikut?',
    type:'choice_text',
    key:'preferred_transport',
    options:[['private','Kendaraan pribadi'],['rental','Sewa kendaraan']],
    placeholder:'Tambahkan penjelasan bila perlu',
    next:()=> 'common_cost'
  },
  deep_no_food:{
    text:'Pengaturan makan seperti apa yang Anda inginkan?',
    type:'choice_text',
    key:'preferred_food',
    options:[['catering','Catering — estimasi 3x makan Rp75.000–Rp100.000/orang'],['cook_location','Masak bersama di lokasi'],['bring_own','Bawa makan sendiri-sendiri']],
    placeholder:'Tambahkan saran bila ada',
    next:()=> 'common_cost'
  },
  deep_no_family:{
    text:'Apa yang perlu disiapkan agar kondisi keluarga/anak lebih memungkinkan untuk ikut?',
    type:'text',
    key:'family_need',
    placeholder:'Tuliskan kebutuhan atau kendalanya',
    next:()=> 'common_cost'
  },
  deep_no_work:{
    text:'Kalau jadwal disesuaikan, apakah Anda akan mempertimbangkan ikut?',
    type:'choice',
    key:'work_if_changed',
    options:[['yes','Ya'],['maybe','Mungkin'],['no','Tetap tidak']],
    next:v=>v==='no'?'deep_no_work_note':'deep_no_work_pref'
  },
  deep_no_work_pref:{
    text:'Jadwal seperti apa yang lebih memungkinkan?',
    type:'text',
    key:'work_preference',
    placeholder:'Tuliskan waktu yang lebih memungkinkan',
    next:()=> 'common_cost'
  },
  deep_no_work_note:{
    text:'Apa alasan lainnya?',
    type:'text',
    key:'work_other_reason',
    placeholder:'Tuliskan alasannya',
    next:()=> 'common_cost'
  },
  deep_no_other:{
    text:'Apa alasannya?',
    type:'text',
    key:'not_interested_other',
    placeholder:'Tuliskan alasannya',
    next:()=> 'deep_no_other_change'
  },
  deep_no_other_change:{
    text:'Apa yang perlu diubah agar Anda bisa tertarik ikut?',
    type:'text_optional',
    key:'not_interested_change',
    placeholder:'Opsional',
    next:()=> 'common_cost'
  },

  not_registered_reason:{
    text:'Apa alasan utama Anda belum mendaftar?',
    type:'choice',
    key:'not_registered_reason',
    options:[
      ['time','Tanggal / waktu belum cocok'],
      ['cost','Biaya'],
      ['family','Masih menunggu kepastian keluarga'],
      ['transport','Masih mempertimbangkan transportasi'],
      ['food','Masih mempertimbangkan makan/konsumsi'],
      ['info','Masih butuh informasi kegiatan'],
      ['other','Lainnya']
    ],
    next:v=>'deep_interest_'+v
  },
  deep_interest_time:{
    text:'Kalau tanggal atau waktunya diubah, apakah Anda berminat mendaftar?',
    type:'choice',
    key:'interest_time_if_changed',
    options:[['yes','Ya, akan daftar'],['maybe','Mungkin'],['no','Tidak']],
    next:v=>v==='no'?'deep_interest_time_other':'deep_interest_time_pref'
  },
  deep_interest_time_pref:{
    text:'Waktu seperti apa yang lebih memungkinkan?',
    type:'text',
    key:'interest_time_preference',
    placeholder:'Contoh: cukup 1 hari, minggu lain, jam keberangkatan tertentu, dll.',
    next:()=> 'common_cost'
  },
  deep_interest_time_other:{
    text:'Selain waktu, apa yang masih menjadi pertimbangan?',
    type:'text',
    key:'interest_time_other',
    placeholder:'Tuliskan pertimbangannya',
    next:()=> 'common_cost'
  },
  deep_interest_cost:{
    text:'Berapa biaya maksimal per orang yang masih sanggup?',
    type:'money',
    key:'affordable_price',
    next:()=> 'deep_interest_cost_register'
  },
  deep_interest_cost_register:{
    text:'Jika biayanya sesuai kemampuan tersebut, apakah Anda akan mendaftar?',
    type:'choice',
    key:'register_if_affordable',
    options:[['yes','Ya'],['maybe','Mungkin'],['no','Belum tentu']],
    next:()=> 'common_cost'
  },
  deep_interest_family:{
    text:'Kepastian apa yang masih ditunggu dari keluarga?',
    type:'text',
    key:'family_waiting',
    placeholder:'Tuliskan yang masih perlu dipastikan',
    next:()=> 'common_cost'
  },
  deep_interest_transport:{
    text:'Transportasi seperti apa yang Anda harapkan?',
    type:'choice_text',
    key:'interest_transport',
    options:[['private','Kendaraan pribadi'],['rental','Sewa kendaraan']],
    placeholder:'Tambahkan saran bila ada',
    next:()=> 'common_cost'
  },
  deep_interest_food:{
    text:'Pengaturan makan seperti apa yang Anda harapkan?',
    type:'choice_text',
    key:'interest_food',
    options:[['catering','Catering — estimasi 3x makan Rp75.000–Rp100.000/orang'],['cook_location','Masak bersama di lokasi'],['bring_own','Bawa makan sendiri-sendiri']],
    placeholder:'Tambahkan saran bila ada',
    next:()=> 'common_cost'
  },
  deep_interest_info:{
    text:'Informasi apa yang masih Anda perlukan sebelum memutuskan mendaftar?',
    type:'text',
    key:'needed_info',
    placeholder:'Contoh: tujuan, susunan kegiatan, fasilitas, waktu pulang, dll.',
    next:()=> 'common_cost'
  },
  deep_interest_other:{
    text:'Apa alasan Anda belum mendaftar?',
    type:'text',
    key:'not_registered_other',
    placeholder:'Tuliskan alasannya',
    next:()=> 'deep_interest_other_change'
  },
  deep_interest_other_change:{
    text:'Apa yang perlu dipastikan atau diubah agar Anda mau mendaftar?',
    type:'text_optional',
    key:'register_trigger',
    placeholder:'Opsional',
    next:()=> 'common_cost'
  },

  common_cost:{
    text:'Menurut Anda, apakah biaya Rp200.000 per orang wajar untuk Tur Kelompok 4?',
    type:'choice',
    key:'cost_200_reasonable',
    options:[['yes','Ya, wajar'],['no','Tidak / terlalu tinggi'],['maybe','Masih perlu disesuaikan']],
    next:v=>v==='yes'?'common_vehicle_own':'common_cost_suggestion'
  },
  common_cost_suggestion:{
    text:'Berapa biaya per orang yang menurut Anda lebih wajar?',
    type:'money',
    key:'suggested_price_200',
    help:'Isi nominal yang menurut Anda paling pas.',
    next:()=> 'common_vehicle_own'
  },
  common_vehicle_own:{
    text:'Apakah Anda memiliki kendaraan pribadi yang memungkinkan digunakan untuk tur?',
    type:'choice',
    key:'has_private_vehicle',
    options:[['yes','Ya, punya'],['no','Tidak punya']],
    next:v=>v==='yes'?'common_vehicle_willing':'common_transport'
  },
  common_vehicle_willing:{
    text:'Jika Anda ikut, apakah bersedia kendaraan pribadi Anda digunakan untuk tur bersama?',
    type:'choice',
    key:'private_vehicle_willing',
    options:[['yes','Ya, bersedia'],['maybe','Mungkin, perlu dibicarakan dulu'],['no','Tidak bersedia']],
    next:()=> 'common_transport'
  },
  common_transport:{
    text:'Menurut Anda, transportasi untuk tur sebaiknya bagaimana?',
    type:'choice_text',
    key:'common_transport',
    options:[
      ['private','Menggunakan kendaraan pribadi jamaah'],
      ['rental','Sewa kendaraan']
    ],
    placeholder:'Tambahkan saran bila ada, misalnya pembagian kendaraan, biaya BBM/tol, titik kumpul, atau cara pengaturannya.',
    next:()=> 'common_food'
  },
  common_food:{
    text:'Untuk makan / konsumsi selama tur, menurut Anda sebaiknya bagaimana?',
    type:'choice_text',
    key:'common_food',
    options:[
      ['catering','Catering — estimasi 3x makan Rp75.000–Rp100.000/orang'],
      ['cook_location','Masak bersama di lokasi'],
      ['bring_own','Bawa makan sendiri-sendiri']
    ],
    placeholder:'Tambahkan saran bila ada, misalnya menu, pembagian tugas masak, teknis membawa makanan, atau usulan lain.',
    next:()=> 'submit'
  },
};

function countProgress(){
  return Math.min(95, 18 + history.length*16);
}
function qKey(q){ return q.key || q===QUESTIONS.registered ? 'registered' : current; }

function render(){
  if(current==='submit'){ submitSurvey(); return }
  const q=QUESTIONS[current];
  $('#progressBar').style.width=countProgress()+'%';
  $('#qno').textContent='Pertanyaan '+(history.length+1);
  $('#question').textContent=q.text;
  $('#status').className='status';
  $('#backBtn').style.display=history.length?'inline-block':'none';
  $('#nextBtn').style.display='none';
  const area=$('#answerArea'); area.innerHTML='';

  if(q.type==='choice'){
    const box=document.createElement('div'); box.className='options';
    q.options.forEach(([v,l])=>{
      const b=document.createElement('button'); b.type='button'; b.className='option'; b.textContent=l;
      b.onclick=()=>advance(v);
      box.appendChild(b);
    });
    area.appendChild(box);
  }

  if(q.type==='money'){
    area.innerHTML=`<div class="input-wrap"><span>Rp</span><input id="moneyInput" type="number" min="0" max="500000" step="5000" inputmode="numeric" placeholder="contoh: 150000"></div>${q.help?`<div class="help">${q.help}</div>`:''}`;
    $('#nextBtn').style.display='block';
    $('#nextBtn').onclick=()=>{
      const n=Number($('#moneyInput').value);
      if(!n || n<10000){showErr('Isi nominal biaya terlebih dahulu.');return}
      advance(n);
    };
  }

  if(q.type==='text'||q.type==='text_optional'){
    area.innerHTML=`<textarea id="textInput" maxlength="700" placeholder="${q.placeholder||''}"></textarea>`;
    $('#nextBtn').style.display='block';
    $('#nextBtn').onclick=()=>{
      const v=$('#textInput').value.trim();
      if(q.type==='text'&&!v){showErr('Isi jawaban terlebih dahulu.');return}
      advance(v);
    };
  }

  if(q.type==='choice_text'){
    const box=document.createElement('div'); box.className='options';
    let selected='';
    q.options.forEach(([v,l])=>{
      const b=document.createElement('button'); b.type='button'; b.className='option'; b.textContent=l;
      b.onclick=()=>{selected=v; [...box.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};
      box.appendChild(b);
    });
    area.appendChild(box);
    const ta=document.createElement('textarea'); ta.id='choiceText'; ta.placeholder=q.placeholder||''; ta.style.marginTop='10px'; area.appendChild(ta);
    $('#nextBtn').style.display='block';
    $('#nextBtn').onclick=()=>{
      if(!selected){showErr('Pilih salah satu jawaban terlebih dahulu.');return}
      advance({choice:selected,note:ta.value.trim()});
    };
  }
}

function advance(value){
  const q=QUESTIONS[current];
  const key=q.key || current;
  state[key]=value;
  if(current==='registered') state.registered=value==='yes';
  history.push({id:current,key});
  current=q.next(value);
  render();
}
function back(){
  if(!history.length)return;
  const last=history.pop();
  delete state[last.key];
  current=last.id;
  render();
}
function showErr(msg){
  const s=$('#status');s.textContent=msg;s.className='status show err';
}

async function submitSurvey(){
  $('#progressBar').style.width='100%';
  $('#qno').textContent='Selesai';
  $('#question').textContent='Kirim jawaban survei?';
  $('#answerArea').innerHTML='';
  $('#backBtn').style.display=history.length?'inline-block':'none';
  $('#nextBtn').style.display='block';
  $('#nextBtn').textContent='Kirim Survei';
  $('#nextBtn').onclick=async()=>{
    $('#nextBtn').disabled=true;$('#nextBtn').textContent='Mengirim...';
    const payload={
      event_code:EVENT_CODE,
      device_key:deviceKey,
      nama:null,
      nomor_wa:null,
      sudah_daftar:!!state.registered,
      minat:null,
      jumlah_jiwa:0,
      harga_sanggup:Number(state.ideal_price||state.affordable_price)||null,
      alasan:[],
      saran:null,
      jawaban:state
    };
    const {error}=await supabase.from('ubnb_tur_survei_respon').insert(payload);
    if(error){
      console.error(error);showErr('Jawaban belum berhasil dikirim. Coba lagi.');
      $('#nextBtn').disabled=false;$('#nextBtn').textContent='Kirim Survei';return;
    }
    localStorage.setItem('pw4_tur_survey_last_submit',new Date().toISOString());
    $('#surveyCard').innerHTML='<div class="success"><div class="tick">✓</div><h2>Terima kasih</h2><p style="margin:8px 0 0;color:#6e7c79">Jawaban survei sudah terkirim.</p></div>';
  };
}
$('#backBtn').onclick=back;
render();
</script>
</body>
</html>
