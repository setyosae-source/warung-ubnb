<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPOB UBNB — Bayar & Beli Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── RESET & VARS ─────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g1:#1D9E75;--g2:#0F6E56;--g3:#e8f7f2;
  --gold:#f5c518;--gold2:#c9a227;
  --navy:#1a2744;--navy2:#0f1a30;
  --red:#dc2626;--amber:#f59e0b;--blue:#3b82f6;
  --text:#111827;--muted:#6b7280;--border:#e5e7eb;
  --bg:#f3f4f6;--card:#fff;
  --r:14px;--r2:10px;--r3:99px;
  --sh:0 2px 12px rgba(0,0,0,.07);
  --sh2:0 8px 32px rgba(0,0,0,.12);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── LAYOUT ──────────────────────────────── */
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.grid-main{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start;padding:24px 0 80px}
@media(max-width:768px){
  .grid-main{grid-template-columns:1fr;padding:16px 0 80px}
  .panel-right{order:-1}
}

/* ── TOPBAR ──────────────────────────────── */
.topbar{
  background:linear-gradient(135deg,var(--navy2),var(--navy));
  color:#fff;padding:0;
  position:sticky;top:0;z-index:200;
  box-shadow:0 2px 20px rgba(0,0,0,.2);
}
.topbar-inner{
  max-width:1100px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;gap:16px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;color:var(--navy);
  flex-shrink:0;
}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.3px}
.brand-sub{font-size:11px;opacity:.6;margin-top:1px}
.topbar-search{
  flex:1;max-width:400px;
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.1);
  border:1.5px solid rgba(255,255,255,.15);
  border-radius:var(--r3);padding:0 16px;height:40px;
  transition:.2s;
}
.topbar-search:focus-within{background:rgba(255,255,255,.15);border-color:var(--gold)}
.topbar-search input{
  background:none;border:none;outline:none;color:#fff;
  font-size:14px;font-family:inherit;width:100%;
}
.topbar-search input::placeholder{color:rgba(255,255,255,.4)}
.topbar-search .ico{font-size:16px;opacity:.5}
.topbar-right{display:flex;align-items:center;gap:10px}
.mode-badge{
  font-size:11px;font-weight:700;padding:4px 12px;
  border-radius:var(--r3);background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
}
.mode-badge.live{background:rgba(29,158,117,.3);border-color:var(--g1);color:#6ee7b7}

/* ── KATEGORI PILLS ──────────────────────── */
.kat-bar{
  background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;top:68px;z-index:100;
  box-shadow:var(--sh);
}
.kat-bar-inner{
  max-width:1100px;margin:0 auto;
  display:flex;gap:6px;overflow-x:auto;
  padding:12px 16px;scrollbar-width:none;
}
.kat-bar-inner::-webkit-scrollbar{display:none}
.kat-pill{
  flex-shrink:0;display:flex;align-items:center;gap:6px;
  padding:7px 16px;border-radius:var(--r3);
  border:2px solid var(--border);background:var(--card);
  cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
  transition:.2s;white-space:nowrap;color:var(--muted);
}
.kat-pill:hover{border-color:var(--g1);color:var(--g1)}
.kat-pill.active{border-color:var(--g1);background:var(--g3);color:var(--g2);font-weight:700}
.kat-pill .ico{font-size:16px}

/* ── PANEL KIRI (Input + Customer) ───────── */
.panel-left{position:sticky;top:120px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.card-head{padding:18px 20px 0;border-bottom:1px solid var(--border);margin-bottom:0}
.card-head-title{font-weight:800;font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-body{padding:20px}

/* Input nomor */
.input-nomor-wrap{position:relative}
.input-nomor{
  width:100%;height:52px;
  border:2px solid var(--border);border-radius:var(--r2);
  padding:0 52px 0 16px;font-size:16px;font-family:inherit;
  outline:none;transition:.2s;font-weight:600;
}
.input-nomor:focus{border-color:var(--g1)}
.input-nomor-clear{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:var(--border);border:none;border-radius:50%;
  width:24px;height:24px;cursor:pointer;font-size:12px;
  display:none;align-items:center;justify-content:center;
}
.input-nomor-clear.show{display:flex}

/* Operator detect */
.operator-chip{
  display:none;align-items:center;gap:8px;
  margin-top:10px;padding:8px 12px;
  background:var(--g3);border-radius:var(--r2);
  font-size:13px;font-weight:600;color:var(--g2);
}
.operator-chip.show{display:flex}
.operator-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--g1)}

/* Customer result */
.cust-result{
  display:none;margin-top:12px;
  padding:12px 14px;border-radius:var(--r2);
  border:2px solid var(--border);
}
.cust-result.anggota{border-color:var(--g1);background:var(--g3)}
.cust-result.jamaah{border-color:var(--blue);background:#eff6ff}
.cust-result.umum{border-color:var(--border);background:#f9fafb}
.cust-result.show{display:block}
.cust-nama{font-weight:700;font-size:14px}
.cust-meta{font-size:12px;color:var(--muted);margin-top:2px}
.cust-tag{
  display:inline-block;margin-top:6px;
  padding:3px 10px;border-radius:var(--r3);
  font-size:11px;font-weight:700;
}
.tag-anggota{background:var(--g1);color:#fff}
.tag-jamaah{background:var(--blue);color:#fff}
.tag-umum{background:var(--muted);color:#fff}
.cust-bayar-info{font-size:12px;margin-top:6px;opacity:.8}

/* Piutang */
.piutang-warn{
  display:none;margin-top:8px;padding:8px 12px;
  background:#fef3c7;border-radius:var(--r2);
  font-size:12px;color:#92400e;
}

/* Input manual nama (umum) */
.input-nama-wrap{display:none;margin-top:12px}
.input-nama-wrap.show{display:block}
.input-nama{
  width:100%;height:44px;
  border:2px solid var(--border);border-radius:var(--r2);
  padding:0 14px;font-size:14px;font-family:inherit;outline:none;
}
.input-nama:focus{border-color:var(--blue)}

/* ── ORDER SUMMARY (panel kiri bawah) ─────── */
.order-box{
  display:none;margin-top:16px;
}
.order-box.show{display:block}
.order-produk{
  background:var(--g3);border-radius:var(--r2);
  padding:14px;margin-bottom:14px;
}
.op-nama{font-weight:700;font-size:14px;color:var(--g2)}
.op-sku{font-size:11px;color:var(--muted);font-family:monospace;margin-top:2px}
.op-harga{font-size:22px;font-weight:900;color:var(--g2);margin-top:8px}
.op-modal{font-size:11px;color:var(--muted)}

/* Bank transfer info */
.bank-info{
  display:none;
  background:#fefce8;border:2px solid var(--gold);
  border-radius:var(--r2);padding:14px;margin-bottom:14px;
}
.bank-info.show{display:block}
.bank-info h4{font-size:12px;font-weight:700;color:var(--gold2);margin-bottom:8px}
.bank-nama{font-weight:700;font-size:15px}
.bank-norek{font-size:20px;font-weight:900;font-family:monospace;letter-spacing:2px;margin:4px 0}
.bank-atas{font-size:12px;color:var(--muted)}
.bank-nominal{margin-top:10px;padding-top:10px;border-top:1px solid var(--gold);font-size:13px;font-weight:700;color:var(--gold2)}

/* Btn order */
.btn-order{
  width:100%;height:52px;
  background:linear-gradient(135deg,var(--g2),var(--g1));
  color:#fff;border:none;border-radius:var(--r2);
  font-size:16px;font-weight:800;font-family:inherit;
  cursor:pointer;transition:.2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-order:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(15,110,86,.3)}
.btn-order:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-batal{
  width:100%;height:40px;background:none;
  border:2px solid var(--border);border-radius:var(--r2);
  font-size:13px;font-weight:600;font-family:inherit;
  cursor:pointer;color:var(--muted);margin-top:8px;transition:.2s;
}
.btn-batal:hover{border-color:var(--red);color:var(--red)}

/* ── PANEL KANAN (Produk grid) ─────────────── */
.produk-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:10px;
}
.produk-header-title{font-weight:800;font-size:18px}
.produk-header-sub{font-size:13px;color:var(--muted);margin-top:2px}
.produk-filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-select{
  height:36px;border:2px solid var(--border);border-radius:var(--r3);
  padding:0 12px;font-size:13px;font-family:inherit;outline:none;
  background:var(--card);cursor:pointer;
}
.filter-select:focus{border-color:var(--g1)}

.produk-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;
}
@media(max-width:480px){.produk-grid{grid-template-columns:repeat(2,1fr)}}

.produk-card{
  background:var(--card);border-radius:var(--r);
  border:2px solid var(--border);
  padding:16px 14px;cursor:pointer;
  transition:.2s;position:relative;
  display:flex;flex-direction:column;
}
.produk-card:hover{border-color:var(--g1);transform:translateY(-2px);box-shadow:var(--sh2)}
.produk-card.selected{border-color:var(--g1);background:var(--g3)}
.produk-card.highlight{border-color:var(--gold);background:#fffbeb}
.pc-badge{
  position:absolute;top:-8px;right:12px;
  font-size:10px;font-weight:700;padding:3px 8px;
  border-radius:var(--r3);
}
.badge-populer{background:var(--gold);color:var(--navy)}
.badge-hemat{background:var(--g1);color:#fff}
.pc-nama{font-weight:700;font-size:13px;line-height:1.3;margin-bottom:6px;flex:1}
.pc-sku{font-size:10px;color:var(--muted);font-family:monospace;margin-bottom:8px}
.pc-harga{font-size:17px;font-weight:900;color:var(--g2)}
.pc-modal{font-size:10px;color:var(--muted);margin-top:2px}
.pc-check{
  display:none;position:absolute;top:10px;right:10px;
  width:22px;height:22px;background:var(--g1);
  border-radius:50%;color:#fff;font-size:12px;
  align-items:center;justify-content:center;
}
.produk-card.selected .pc-check{display:flex}

/* Empty / loading */
.empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}
.empty .ico{font-size:48px;margin-bottom:12px}
.empty p{font-size:14px}
.spinner{
  width:32px;height:32px;border:3px solid var(--border);
  border-top-color:var(--g1);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SUCCESS OVERLAY ─────────────────────── */
.overlay{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;padding:20px;
}
.overlay.show{display:flex}
.overlay-card{
  background:var(--card);border-radius:var(--r);
  padding:40px 32px;text-align:center;
  max-width:420px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.ov-icon{font-size:72px;margin-bottom:16px}
.ov-title{font-size:24px;font-weight:900;margin-bottom:8px}
.ov-sub{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:20px}
.ov-ref{
  display:inline-block;background:var(--g3);
  padding:10px 20px;border-radius:var(--r2);
  font-family:monospace;font-size:15px;font-weight:700;
  color:var(--g2);margin-bottom:20px;
}
.btn-close-ov{
  width:100%;height:48px;background:var(--g1);
  color:#fff;border:none;border-radius:var(--r2);
  font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
}

/* ── TOAST ───────────────────────────────── */
#toast-wrap{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{
  padding:12px 18px;border-radius:var(--r2);color:#fff;
  font-size:13px;font-weight:600;max-width:320px;
  box-shadow:var(--sh2);opacity:0;transform:translateX(20px);
  transition:.3s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(0)}
.toast.s{background:var(--g1)}.toast.e{background:var(--red)}
.toast.w{background:var(--amber)}.toast.i{background:var(--navy)}

/* ── BOTTOM NAV (mobile) ─────────────────── */
.bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:var(--card);border-top:1px solid var(--border);
  padding:8px 0;z-index:200;box-shadow:0 -4px 20px rgba(0,0,0,.08);
}
@media(max-width:768px){.bottom-nav{display:flex}}
.bn-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  border:none;background:none;cursor:pointer;font-family:inherit;padding:4px 0;
}
.bn-ico{font-size:22px;color:var(--muted)}
.bn-lbl{font-size:10px;color:var(--muted);font-weight:600}
.bn-btn.active .bn-ico,.bn-btn.active .bn-lbl{color:var(--g1)}
.bn-btn.active .bn-lbl{font-weight:700}
</style>
</head>
<body>

<div id="toast-wrap"></div>

<!-- TOPBAR -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo">UB</div>
      <div>
        <div class="brand-name">PPOB UBNB</div>
        <div class="brand-sub">Desa Perwira · Layanan Digital</div>
      </div>
    </div>
    <div class="topbar-search">
      <span class="ico">🔍</span>
      <input type="text" id="global-search" placeholder="Cari produk... (pulsa, token PLN, BPJS)" oninput="globalSearch(this.value)">
    </div>
    <div class="topbar-right">
      <span class="mode-badge" id="mode-badge">🧪 Demo</span>
    </div>
  </div>
</header>

<!-- KATEGORI BAR -->
<div class="kat-bar">
  <div class="kat-bar-inner" id="kat-bar">
    <div style="color:var(--muted);font-size:13px;padding:4px 0">Memuat...</div>
  </div>
</div>

<!-- MAIN -->
<div class="wrap">
  <div class="grid-main">

    <!-- PANEL KIRI -->
    <div class="panel-left" id="panel-left">

      <!-- Input nomor -->
      <div class="card">
        <div class="card-head">
          <div class="card-head-title">📱 Nomor Tujuan</div>
        </div>
        <div class="card-body">
          <div class="input-nomor-wrap">
            <input type="tel" class="input-nomor" id="input-nomor"
              placeholder="Ketik no HP / no meter / ID..."
              inputmode="numeric" autocomplete="off"
              oninput="onNomorInput(this.value)">
            <button class="input-nomor-clear" id="btn-clear-nomor" onclick="clearNomor()">✕</button>
          </div>

          <!-- Operator chip -->
          <div class="operator-chip" id="operator-chip">
            <div class="dot"></div>
            <span id="operator-text">—</span>
          </div>

          <!-- Customer result -->
          <div class="cust-result" id="cust-result"></div>
          <div class="piutang-warn" id="piutang-warn"></div>

          <!-- Input nama manual (Umum) -->
          <div class="input-nama-wrap" id="input-nama-wrap">
            <input type="text" class="input-nama" id="input-nama"
              placeholder="Nama Anda (opsional)">
          </div>
        </div>
      </div>

      <!-- Order summary -->
      <div class="order-box" id="order-box">
        <div class="card">
          <div class="card-head">
            <div class="card-head-title">🛒 Ringkasan Pesanan</div>
          </div>
          <div class="card-body">
            <div class="order-produk">
              <div class="op-nama" id="op-nama">—</div>
              <div class="op-sku" id="op-sku">—</div>
              <div class="op-harga" id="op-harga">Rp 0</div>
              <div class="op-modal" id="op-modal">—</div>
            </div>

            <div style="font-size:13px;color:var(--muted);margin-bottom:12px">
              <b>Tujuan:</b> <span id="op-tujuan" style="font-family:monospace;font-weight:700;color:var(--text)">—</span>
            </div>

            <!-- Bank transfer info -->
            <div class="bank-info" id="bank-info">
              <h4>💳 Transfer Pembayaran ke:</h4>
              <div class="bank-nama" id="bank-nama">—</div>
              <div class="bank-norek" id="bank-norek">—</div>
              <div class="bank-atas" id="bank-atas">—</div>
              <div class="bank-nominal" id="bank-nominal">—</div>
              <div style="font-size:11px;color:var(--muted);margin-top:8px">⚠️ Diproses setelah admin verifikasi transfer</div>
            </div>

            <button class="btn-order" id="btn-order" onclick="submitOrder()">⚡ Pesan Sekarang</button>
            <button class="btn-batal" onclick="batalPilihan()">✕ Batal pilihan</button>
          </div>
        </div>
      </div>

    </div>

    <!-- PANEL KANAN -->
    <div class="panel-right" id="panel-right">
      <div class="produk-header">
        <div>
          <div class="produk-header-title" id="produk-title">Semua Produk</div>
          <div class="produk-header-sub" id="produk-sub">Pilih nomor tujuan untuk filter otomatis</div>
        </div>
        <div class="produk-filter">
          <select class="filter-select" id="sort-select" onchange="sortProduk(this.value)">
            <option value="nama">A-Z</option>
            <option value="harga_asc">Harga ↑</option>
            <option value="harga_desc">Harga ↓</option>
          </select>
        </div>
      </div>
      <div class="produk-grid" id="produk-grid">
        <div class="empty"><div class="spinner"></div><p>Memuat produk...</p></div>
      </div>
    </div>

  </div>
</div>

<!-- SUCCESS OVERLAY -->
<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="ov-icon" id="ov-icon">✅</div>
    <div class="ov-title" id="ov-title">Pesanan Diterima!</div>
    <div class="ov-ref" id="ov-ref">—</div>
    <div class="ov-sub" id="ov-sub">—</div>
    <button class="btn-close-ov" onclick="tutupOverlay()">🏠 Pesan Lagi</button>
  </div>
</div>

<!-- BOTTOM NAV (mobile) -->
<nav class="bottom-nav">
  <button class="bn-btn active" onclick="mobileTab('beranda')">
    <span class="bn-ico">🏠</span><span class="bn-lbl">Beranda</span>
  </button>
  <button class="bn-btn" onclick="mobileTab('riwayat')">
    <span class="bn-ico">📋</span><span class="bn-lbl">Riwayat</span>
  </button>
</nav>

<script>
// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════
const SB_URL = 'https://skltbmcrqutevmtcxqxj.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrbHRibWNycXV0ZXZtdGN4cXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzM5ODIsImV4cCI6MjA5MTI0OTk4Mn0._nogUZg5UylVyP45QTGYw69u76pNxGryj9hZORIfE_A';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let allProduk=[], allKategori=[], settingMap={}, supplierCfg=null;
let selectedKat=null, selectedProduk=null, currentCustomer=null;
let searchTimer=null, custTimer=null, sortMode='nama';
let displayedProduk=[];

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
const rp = n => 'Rp '+Number(n||0).toLocaleString('id-ID');
const tgl = d => d ? new Date(d).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';

function toast(msg, type='i'){
  const colors={s:'s',e:'e',w:'w',i:'i'};
  const el=document.createElement('div');
  el.className='toast '+(colors[type]||'i');
  el.textContent=msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(()=>el.classList.add('show'),10);
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300)},3500);
}

function genRef(){
  return 'PPOB-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).substring(2,5).toUpperCase();
}

// Detect operator dari nomor HP
function detectOperator(nomor){
  const n = nomor.replace(/\D/g,'');
  if(!n || n.length < 4) return null;
  const pre3 = n.substring(0,3);
  const pre4 = n.substring(0,4);
  const map = {
    // Telkomsel
    '0811':'Telkomsel','0812':'Telkomsel','0813':'Telkomsel',
    '0821':'Telkomsel','0822':'Telkomsel','0823':'Telkomsel',
    '0851':'Telkomsel','0852':'Telkomsel','0853':'Telkomsel',
    // Indosat
    '0814':'Indosat','0815':'Indosat','0816':'Indosat',
    '0855':'Indosat','0856':'Indosat','0857':'Indosat','0858':'Indosat',
    // XL
    '0817':'XL','0818':'XL','0819':'XL',
    '0859':'XL','0877':'XL','0878':'XL',
    // Tri
    '0895':'Tri','0896':'Tri','0897':'Tri','0898':'Tri','0899':'Tri',
    // Smartfren
    '0881':'Smartfren','0882':'Smartfren','0883':'Smartfren',
    '0884':'Smartfren','0885':'Smartfren','0886':'Smartfren',
    '0887':'Smartfren','0888':'Smartfren','0889':'Smartfren',
    // Axis
    '0831':'Axis','0832':'Axis','0833':'Axis','0838':'Axis',
  };
  return map[pre4] || map[pre3] || null;
}

// Deteksi jenis nomor
function detectNomorType(nomor){
  const n = nomor.replace(/\D/g,'');
  if(!n) return null;
  if(n.length >= 10 && n.length <= 13 && (n.startsWith('08') || n.startsWith('628'))) return 'hp';
  if(n.length >= 11 && n.length <= 12 && /^\d+$/.test(n)) return 'pln'; // meter PLN
  return 'other';
}

// Filter produk berdasarkan operator
function filterProdukByOperator(operator){
  if(!operator) return allProduk;
  const op = operator.toLowerCase();
  return allProduk.filter(p => {
    const nama = (p.nama_produk || '').toLowerCase();
    const sku  = (p.sku_supplier || '').toLowerCase();
    return nama.includes(op) || sku.includes(op);
  });
}

// Sort produk
function doSort(arr, mode){
  const sorted = [...arr];
  if(mode === 'harga_asc') return sorted.sort((a,b) => a.harga_jual - b.harga_jual);
  if(mode === 'harga_desc') return sorted.sort((a,b) => b.harga_jual - a.harga_jual);
  return sorted.sort((a,b) => a.nama_produk.localeCompare(b.nama_produk));
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
async function init(){
  try {
    const [setRes, supRes, katRes, prodRes] = await Promise.all([
      sb.from('ppob_setting').select('key,value'),
      sb.from('ppob_supplier').select('*').eq('status','aktif').limit(1),
      sb.from('ppob_kategori').select('*').eq('status','aktif').order('urutan'),
      sb.from('ppob_produk').select('*,ppob_kategori(nama,icon,kode)').eq('status','aktif').order('nama_produk')
    ]);

    (setRes.data||[]).forEach(s => settingMap[s.key]=s.value);
    supplierCfg = supRes.data?.[0] || null;
    allKategori = katRes.data || [];
    allProduk   = prodRes.data || [];

    // Mode badge
    const mode = settingMap['mode_operasi'] || 'demo';
    const badge = document.getElementById('mode-badge');
    if(mode === 'live'){ badge.textContent='🟢 Live'; badge.classList.add('live'); }
    else badge.textContent='🧪 Demo';

    renderKategori();
    displayedProduk = doSort(allProduk, sortMode);
    renderProduk(displayedProduk);

  } catch(e){
    console.error('init error:',e);
    toast('Gagal memuat: '+e.message,'e');
  }
}

// ═══════════════════════════════════════════
// RENDER KATEGORI
// ═══════════════════════════════════════════
function renderKategori(){
  const bar = document.getElementById('kat-bar');
  const all = [{id:null,icon:'🌐',nama:'Semua'}, ...allKategori];
  bar.innerHTML = all.map(k=>`
    <button class="kat-pill ${selectedKat===k.id?'active':''}"
      onclick="pilihKat(${k.id===null?'null':k.id})">
      <span class="ico">${k.icon||'📦'}</span>${k.nama}
    </button>`).join('');
}

function pilihKat(id){
  selectedKat = id;
  selectedProduk = null;
  document.getElementById('order-box').classList.remove('show');
  renderKategori();

  let filtered = id ? allProduk.filter(p=>p.kategori_id===id) : allProduk;

  // Jika ada operator terdeteksi, filter lebih lanjut
  const opText = document.getElementById('operator-text').textContent;
  if(opText && opText !== '—' && opText.startsWith('Operator:')) {
    const op = opText.replace('Operator: ','').toLowerCase();
    const byOp = filtered.filter(p=>(p.nama_produk||'').toLowerCase().includes(op)||(p.sku_supplier||'').toLowerCase().includes(op));
    if(byOp.length > 0) filtered = byOp;
  }

  displayedProduk = doSort(filtered, sortMode);

  const katNama = id ? (allKategori.find(k=>k.id===id)?.nama || '—') : 'Semua Produk';
  document.getElementById('produk-title').textContent = katNama;
  document.getElementById('produk-sub').textContent = `${displayedProduk.length} produk`;

  renderProduk(displayedProduk);
}

// ═══════════════════════════════════════════
// RENDER PRODUK
// ═══════════════════════════════════════════
function renderProduk(list){
  const grid = document.getElementById('produk-grid');
  if(!list || list.length === 0){
    grid.innerHTML=`<div class="empty"><div class="ico">📦</div><p>Tidak ada produk</p></div>`;
    return;
  }
  grid.innerHTML = list.map((p,i)=>{
    const isSelected = selectedProduk?.id === p.id;
    const isPopuler  = i < 3 && !selectedKat;
    const profit = Number(p.harga_jual||0) - Number(p.harga_modal||0);
    return `
    <div class="produk-card ${isSelected?'selected':''} ${isPopuler&&!isSelected?'highlight':''}"
      onclick="pilihProduk(${p.id})">
      ${isPopuler&&!isSelected?'<span class="pc-badge badge-populer">⭐ Populer</span>':''}
      <div class="pc-check">✓</div>
      <div class="pc-nama">${p.nama_produk}</div>
      <div class="pc-sku">${p.sku_supplier}</div>
      <div class="pc-harga">${rp(p.harga_jual)}</div>
      <div class="pc-modal">Modal ${rp(p.harga_modal)} · Profit +${rp(profit)}</div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════
// INPUT NOMOR → AUTO DETECT
// ═══════════════════════════════════════════
function onNomorInput(val){
  const clearBtn = document.getElementById('btn-clear-nomor');
  clearBtn.classList.toggle('show', val.length > 0);

  // Detect operator
  const operator = detectOperator(val);
  const chip = document.getElementById('operator-chip');
  const opText = document.getElementById('operator-text');

  if(operator && val.replace(/\D/g,'').length >= 4){
    chip.classList.add('show');
    opText.textContent = 'Operator: '+operator;
    // Auto filter produk by operator
    autoFilterByOperator(operator);
  } else {
    chip.classList.remove('show');
    opText.textContent = '—';
  }

  // Search customer debounce
  clearTimeout(custTimer);
  if(val.length >= 3){
    custTimer = setTimeout(()=>searchCustomer(val), 600);
  } else {
    resetCustomer();
  }
}

function autoFilterByOperator(operator){
  const byOp = filterProdukByOperator(operator);
  const filtered = selectedKat ? byOp.filter(p=>p.kategori_id===selectedKat) : byOp;
  displayedProduk = doSort(filtered.length > 0 ? filtered : allProduk, sortMode);

  document.getElementById('produk-title').textContent = filtered.length > 0 ? 'Produk '+operator : 'Semua Produk';
  document.getElementById('produk-sub').textContent = `${displayedProduk.length} produk ditemukan`;
  renderProduk(displayedProduk);
}

function clearNomor(){
  document.getElementById('input-nomor').value='';
  document.getElementById('btn-clear-nomor').classList.remove('show');
  document.getElementById('operator-chip').classList.remove('show');
  resetCustomer();
  displayedProduk = doSort(allProduk, sortMode);
  document.getElementById('produk-title').textContent='Semua Produk';
  document.getElementById('produk-sub').textContent=`${displayedProduk.length} produk`;
  renderProduk(displayedProduk);
  selectedProduk=null;
  document.getElementById('order-box').classList.remove('show');
}

// ═══════════════════════════════════════════
// SEARCH CUSTOMER
// ═══════════════════════════════════════════
async function searchCustomer(val){
  const resultEl = document.getElementById('cust-result');
  const piutangEl = document.getElementById('piutang-warn');
  const namaWrap = document.getElementById('input-nama-wrap');
  const q = val.toLowerCase().replace(/\D/g,'') || val.toLowerCase();

  try {
    // 1. Cek ubnb_anggota
    const { data: anggota } = await sb.from('ubnb_anggota')
      .select('id,nama,no_hp,kelompok')
      .or(`nama.ilike.%${val}%,no_hp.ilike.%${val}%`)
      .limit(1);

    if(anggota?.length > 0){
      const a = anggota[0];
      currentCustomer = {tipe:'anggota',anggota_id:a.id,nama:a.nama,no_hp:a.no_hp};
      resultEl.className='cust-result anggota show';
      resultEl.innerHTML=`
        <div class="cust-nama">⭐ ${a.nama}</div>
        <div class="cust-meta">HP: ${a.no_hp||'—'} · Kelompok: ${a.kelompok||'—'}</div>
        <span class="cust-tag tag-anggota">Anggota UBNB</span>
        <div class="cust-bayar-info">✅ Bayar nanti — dicatat sebagai utang</div>`;
      namaWrap.classList.remove('show');
      if(selectedProduk) document.getElementById('bank-info').classList.remove('show');
      // Cek piutang
      const {data:plg} = await sb.from('ppob_pelanggan').select('total_piutang').eq('anggota_id',a.id).maybeSingle();
      if(plg && Number(plg.total_piutang)>0){
        piutangEl.style.display='block';
        piutangEl.textContent='⚠️ Ada piutang PPOB: '+rp(plg.total_piutang);
      } else piutangEl.style.display='none';
      return;
    }

    // 2. Cek jamaah_desa
    const { data: jamaah } = await sb.from('jamaah_desa')
      .select('did,nama_kk,nomor_wa,kelompok')
      .or(`nama_kk.ilike.%${val}%,nomor_wa.ilike.%${val}%`)
      .limit(1);

    if(jamaah?.length > 0){
      const j = jamaah[0];
      currentCustomer = {tipe:'jamaah',jamaah_did:j.did,nama:j.nama_kk,no_hp:j.nomor_wa};
      resultEl.className='cust-result jamaah show';
      resultEl.innerHTML=`
        <div class="cust-nama">👥 ${j.nama_kk}</div>
        <div class="cust-meta">WA: ${j.nomor_wa||'—'} · Kelompok: ${j.kelompok||'—'}</div>
        <span class="cust-tag tag-jamaah">Jamaah Desa Perwira</span>
        <div class="cust-bayar-info">✅ Bayar nanti — dicatat sebagai utang</div>`;
      namaWrap.classList.remove('show');
      piutangEl.style.display='none';
      if(selectedProduk) document.getElementById('bank-info').classList.remove('show');
      return;
    }

    // 3. Umum
    currentCustomer = {tipe:'umum',nama:val,no_hp:val};
    resultEl.className='cust-result umum show';
    resultEl.innerHTML=`
      <div class="cust-nama">🔓 Customer Umum</div>
      <div class="cust-meta">Tidak ditemukan di data anggota/jamaah</div>
      <span class="cust-tag tag-umum">Umum</span>
      <div class="cust-bayar-info">💳 Wajib transfer manual — verifikasi admin</div>`;
    namaWrap.classList.add('show');
    piutangEl.style.display='none';
    if(selectedProduk) showBankInfo();

  } catch(e){ console.error('searchCustomer:',e); }
}

function resetCustomer(){
  currentCustomer=null;
  document.getElementById('cust-result').className='cust-result';
  document.getElementById('piutang-warn').style.display='none';
  document.getElementById('input-nama-wrap').classList.remove('show');
}

// ═══════════════════════════════════════════
// PILIH PRODUK
// ═══════════════════════════════════════════
function pilihProduk(id){
  selectedProduk = allProduk.find(p=>p.id===id);
  if(!selectedProduk) return;

  // Re-render grid
  renderProduk(displayedProduk);

  // Update summary
  document.getElementById('op-nama').textContent  = selectedProduk.nama_produk;
  document.getElementById('op-sku').textContent   = selectedProduk.sku_supplier;
  document.getElementById('op-harga').textContent = rp(selectedProduk.harga_jual);
  document.getElementById('op-modal').textContent = 'Modal: '+rp(selectedProduk.harga_modal);
  document.getElementById('op-tujuan').textContent = document.getElementById('input-nomor').value || '—';

  // Bank info untuk Umum
  const tipe = currentCustomer?.tipe || 'umum';
  if(tipe === 'umum' || !currentCustomer) showBankInfo();
  else document.getElementById('bank-info').classList.remove('show');

  document.getElementById('order-box').classList.add('show');

  // Scroll ke order box di mobile
  if(window.innerWidth <= 768){
    document.getElementById('order-box').scrollIntoView({behavior:'smooth',block:'nearest'});
  } else {
    document.getElementById('panel-left').scrollIntoView({behavior:'smooth',block:'start'});
  }
}

function showBankInfo(){
  const bi = document.getElementById('bank-info');
  bi.classList.add('show');
  document.getElementById('bank-nama').textContent  = settingMap['bank_tujuan_nama'] || 'BSI';
  document.getElementById('bank-norek').textContent = settingMap['bank_tujuan_no_rek'] || '—';
  document.getElementById('bank-atas').textContent  = settingMap['bank_tujuan_atas_nama'] || '—';
  document.getElementById('bank-nominal').textContent = 'Transfer sebesar: '+rp(selectedProduk?.harga_jual);
}

function batalPilihan(){
  selectedProduk=null;
  document.getElementById('order-box').classList.remove('show');
  renderProduk(displayedProduk);
}

// ═══════════════════════════════════════════
// GLOBAL SEARCH
// ═══════════════════════════════════════════
function globalSearch(val){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    if(!val.trim()){
      displayedProduk = doSort(allProduk, sortMode);
      document.getElementById('produk-title').textContent='Semua Produk';
      document.getElementById('produk-sub').textContent=`${displayedProduk.length} produk`;
      renderProduk(displayedProduk); return;
    }
    const q = val.toLowerCase();
    const filtered = allProduk.filter(p=>
      (p.nama_produk||'').toLowerCase().includes(q) ||
      (p.sku_supplier||'').toLowerCase().includes(q) ||
      (p.ppob_kategori?.nama||'').toLowerCase().includes(q)
    );
    displayedProduk = doSort(filtered, sortMode);
    document.getElementById('produk-title').textContent=`Hasil: "${val}"`;
    document.getElementById('produk-sub').textContent=`${displayedProduk.length} produk ditemukan`;
    renderProduk(displayedProduk);
  }, 300);
}

function sortProduk(mode){
  sortMode = mode;
  displayedProduk = doSort(displayedProduk, mode);
  renderProduk(displayedProduk);
}

// ═══════════════════════════════════════════
// SUBMIT ORDER
// ═══════════════════════════════════════════
async function submitOrder(){
  if(!selectedProduk){ toast('Pilih produk dulu','e'); return; }
  const nomor = document.getElementById('input-nomor').value.trim();
  if(!nomor){ toast('Nomor tujuan wajib diisi','e'); return; }

  const namaManual = document.getElementById('input-nama').value.trim();
  const custTipe   = currentCustomer?.tipe || 'umum';
  if(custTipe==='umum' && !currentCustomer){
    currentCustomer={tipe:'umum',nama:namaManual||nomor,no_hp:nomor};
  }

  const bayarLabel = custTipe==='umum' ? 'Transfer manual' : 'Bayar nanti';
  const ok = confirm('Konfirmasi: ' + selectedProduk.nama_produk + ' - ' + nomor + ' - ' + rp(selectedProduk.harga_jual) + ' - ' + bayarLabel + '. Lanjutkan?');
  if(!ok) return;

  const btn = document.getElementById('btn-order');
  btn.disabled=true; btn.textContent='⏳ Memproses...';

  try {
    const refId = genRef();
    const now   = new Date().toISOString();

    // Upsert pelanggan
    let pelangganId=null;
    if(currentCustomer){
      let existQ = sb.from('ppob_pelanggan').select('id,total_piutang,total_transaksi,total_belanja');
      if(custTipe==='anggota') existQ=existQ.eq('anggota_id',currentCustomer.anggota_id);
      else if(custTipe==='jamaah') existQ=existQ.eq('jamaah_did',currentCustomer.jamaah_did);
      else existQ=existQ.eq('nama',currentCustomer.nama).eq('tipe','umum');
      const {data:ep}=await existQ.maybeSingle();

      if(ep){
        pelangganId=ep.id;
        await sb.from('ppob_pelanggan').update({
          total_transaksi:(ep.total_transaksi||0)+1,
          total_belanja:Number(ep.total_belanja||0)+Number(selectedProduk.harga_jual),
          last_order_at:now,updated_at:now
        }).eq('id',pelangganId);
      } else {
        const ins={nama:currentCustomer.nama,no_hp:currentCustomer.no_hp,tipe:custTipe,
          total_transaksi:1,total_belanja:selectedProduk.harga_jual,last_order_at:now};
        if(custTipe==='anggota') ins.anggota_id=currentCustomer.anggota_id;
        if(custTipe==='jamaah')  ins.jamaah_did=currentCustomer.jamaah_did;
        const {data:np}=await sb.from('ppob_pelanggan').insert(ins).select('id').single();
        pelangganId=np?.id;
      }
    }

    // Insert transaksi
    const metodeBayar=custTipe==='anggota'?'utang_anggota':custTipe==='jamaah'?'utang_jamaah':'transfer_umum';
    const statusBayar=custTipe==='umum'?'menunggu':'utang';
    const {data:trx,error:trxErr}=await sb.from('ppob_transaksi').insert({
      ref_id:refId,pelanggan_id:pelangganId,
      produk_id:selectedProduk.id,supplier_id:supplierCfg?.id||null,
      sku_supplier:selectedProduk.sku_supplier,nama_produk:selectedProduk.nama_produk,
      tujuan:nomor,harga_modal:selectedProduk.harga_modal,
      harga_jual:selectedProduk.harga_jual,markup:selectedProduk.markup,
      status:'pending',metode_bayar:metodeBayar,status_bayar:statusBayar,
      created_at:now,updated_at:now
    }).select('id').single();
    if(trxErr) throw trxErr;

    // Piutang
    if(custTipe!=='umum' && pelangganId){
      await sb.from('ppob_piutang').insert({
        transaksi_id:trx.id,pelanggan_id:pelangganId,
        jumlah:selectedProduk.harga_jual,status:'belum_bayar'
      });
      const {data:plg}=await sb.from('ppob_pelanggan').select('total_piutang').eq('id',pelangganId).single();
      await sb.from('ppob_pelanggan').update({
        total_piutang:Number(plg?.total_piutang||0)+Number(selectedProduk.harga_jual)
      }).eq('id',pelangganId);
    }

    // Pembayaran umum
    if(custTipe==='umum'){
      await sb.from('ppob_pembayaran_umum').insert({
        transaksi_id:trx.id,jumlah:selectedProduk.harga_jual,
        nama_pengirim:currentCustomer?.nama||nomor,status:'menunggu'
      });
    }

    // Success overlay
    const msg = custTipe==='umum'
      ? `Silakan transfer ${rp(selectedProduk.harga_jual)} ke rekening ${settingMap['bank_tujuan_nama']||'BSI'} ${settingMap['bank_tujuan_no_rek']||''}. Pesanan diproses setelah admin verifikasi.`
      : `Pesanan dicatat sebagai utang ${rp(selectedProduk.harga_jual)}. Akan ditagih saat MPPS atau dikonfirmasi admin.`;

    document.getElementById('ov-icon').textContent = '✅';
    document.getElementById('ov-title').textContent = 'Pesanan Diterima!';
    document.getElementById('ov-ref').textContent = refId;
    document.getElementById('ov-sub').textContent = msg;
    document.getElementById('overlay').classList.add('show');

  } catch(e){
    console.error('submitOrder:',e);
    toast('Gagal: '+e.message,'e');
  } finally {
    btn.disabled=false; btn.textContent='⚡ Pesan Sekarang';
  }
}

function tutupOverlay(){
  document.getElementById('overlay').classList.remove('show');
  clearNomor();
  resetCustomer();
  selectedProduk=null;
  document.getElementById('order-box').classList.remove('show');
  document.getElementById('input-nama').value='';
}

  document.querySelector(`.bn-btn[onclick="mobileTab('${tab}')"]`).classList.add('active');
  // TODO: riwayat tab

init();
