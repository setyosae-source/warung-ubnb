textarea{font:inherit;width:100%;padding:12px;border:1px solid #c4d6d3;border-radius:10px;margin:6px 0 16px;color:var(--ink);resize:vertical}details{border-top:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:700;margin-bottom:12px}.cal-item{border:1px solid var(--line);padding:18px;margin:12px 0;border-radius:12px}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(95px,1fr));gap:5px;min-width:700px}.cal-day{min-height:100px;background:#f2f7f4;border-radius:8px;padding:7px}.cal-day button{display:block;width:100%;padding:5px;font-size:12px;text-align:left;margin-top:6px;white-space:normal}.cal-scroll{overflow:auto}.cal-checks{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 18px}.cal-checks label,.cal-pick label{display:flex;align-items:center;gap:8px;font-weight:500}.cal-pick{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;margin:12px 0}.cal-pick label{padding:8px;border-bottom:1px solid var(--line)}.cal-rule{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}.cal-pick small{margin-left:auto}.error{color:#a13b30}#modal-content>form>label{margin:12px 0}#modal-content table{font-size:13px}@media(max-width:600px){dialog{padding:16px}.cal-checks{gap:12px}}

</head><body data-page="dashboard"><div class="shell"><aside><a href="index.html" class="brand">UBAID.</a><p class="org">DESA PERWIRA<br>Portal Kehadiran</p><nav><button data-view="overview" class="active">Ringkasan</button><button data-view="raw">Catatan mentah</button><button data-view="devices">Mesin UBAID</button><button data-view="people">Jamaah & kartu</button><button data-view="events">Acara</button><button data-view="registrations">Pendaftaran via HP</button><button data-view="members" data-owner>Pengguna</button><button data-view="audit" data-owner>Log perubahan</button></nav><footer><a href="panduan-mesin.html" target="_blank" rel="noopener">Panduan suara mesin</a><br>UBAID · Meramut jamaah</footer></aside><main><header class="top"><span>Organisasi / <b>Desa Perwira</b></span><div><span id="account">Memeriksa akun…</span> <button id="logout">Keluar</button></div></header><div id="notice" hidden role="status"></div><section id="content"><p>Memuat dashboard…</p></section></main></div><dialog id="modal"><div id="modal-content"></div><form method="dialog"><button>Tutup</button></form></dialog><script>
'use strict';
const API='https://skltbmcrqutevmtcxqxj.supabase.co/rest/v1/rpc/';
const KEY='sb_publishable_-_oDmSzXdOTzEBcthp8v9w_p3zA1VXX';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=sessionStorage.getItem('ubaid-perwira-token')||'',me,view='overview',scans=[],people=[],devices=[],events=[],lastQuery={},busy=false,selectedScans=new Set();
function notice(s,error=false){$('notice').hidden=!s;$('notice').textContent=s;$('notice').className=error?'error':'';}
async function rpc(name,args){const r=await fetch(API+name,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(args),signal:AbortSignal.timeout(20000)});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||j.message||'Permintaan belum berhasil');return j;}
async function call(action,data={}){return rpc('ubaid_portal',{p_token:token,p_action:action,p_data:data});}
const date=s=>s?new Date(s).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'medium',timeStyle:'medium'}):'Jam belum valid';
function modal(html){$('modal-content').innerHTML=html;$('modal').showModal();}
function table(head,body){return '<div class="tablewrap"><table><thead><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+body+'</tbody></table></div>';}
function empty(s){return '<div class="empty">'+esc(s)+'</div>';}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function task(fn){if(busy)return;busy=true;try{await fn();}catch(e){notice(e.message,true);}finally{busy=false;}}
if(document.body.dataset.page==='login'){
 $('login-form').onsubmit=e=>{e.preventDefault();task(async()=>{$('submit-login').disabled=true;try{const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode($('password').value));const hash=[...new Uint8Array(digest)].map(v=>v.toString(16).padStart(2,'0')).join('');const r=await rpc('dk_attendance_login',{p_username:$('username').value.trim(),p_password_hash:hash});token=r.token;await call('me');sessionStorage.setItem('ubaid-perwira-token',token);$('password').value='';location.assign('dashboard.html');}finally{$('submit-login').disabled=false;}});};
}else{
 $('logout').onclick=()=>task(async()=>{try{await rpc('dk_attendance_logout',{p_token:token});}finally{sessionStorage.removeItem('ubaid-perwira-token');location.replace('login.html');}});
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>task(()=>render(b.dataset.view)));
 window.addEventListener('DOMContentLoaded',init);
}
async function init(){if(!token){location.replace('login.html');return;}try{me=await call('me');$('account').textContent=me.nama+' · '+(me.scope||'Desa');document.querySelectorAll('[data-owner]').forEach(b=>b.hidden=me.role!=='owner');await render('overview');}catch(e){notice(e.message,true);$('content').innerHTML='<a href="login.html">Kembali ke login</a>';}}
async function render(next){view=next;notice('');document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const c=$('content');c.innerHTML='<p>Memuat data…</p>';
 if(view==='overview'){
  const [raw,ds,ps]=await Promise.all([call('summary',{limit:5}),call('devices'),call('people')]);devices=ds.devices;
  c.innerHTML='<div class="hero"><div><div class="eyebrow">KEHADIRAN TERHUBUNG</div><h1>Ringkasan kehadiran</h1><p>Kelola acara, periksa catatan mesin, dan daftarkan kartu jamaah dari satu tempat.</p></div><div><span class="badge">Desa Perwira</span></div></div><div class="cards"><div class="card"><small>Scan diterima · 7 hari terakhir</small><strong>'+raw.total+'</strong>catatan mentah</div><div class="card"><small>Mesin terhubung sekarang</small><strong>'+devices.filter(d=>d.online).length+' / '+devices.length+'</strong>mesin terdaftar</div><div class="card"><small>Identitas dari Dashboard Kelompok</small><strong>'+ps.people.length+'</strong>jamaah</div></div><div class="panel"><div class="row"><h2 style="flex:1">Catatan terbaru</h2><button id="openraw">Lihat semua</button></div>'+rawTable(raw.scans,false)+'</div>';scans=raw.scans;$('openraw').onclick=()=>task(()=>render('raw'));
 }else if(view==='raw'){
  const ds=await call('devices');devices=ds.devices;
  c.innerHTML='<div class="eyebrow">BUKTI SCAN ASLI</div><h1>Catatan mentah.</h1><p class="muted">Filter tanggal dan jam dalam WIB. Pilih waktu scan asli atau waktu diterima server. Scan tanpa jam valid dapat dicari melalui waktu diterima server.</p><div class="panel"><form id="filter" class="row"><label>Dasar waktu<select id="timebasis"><option value="scan">Waktu scan asli</option><option value="received">Waktu diterima server</option></select></label><label>Dari tanggal & jam (WIB)<input type="datetime-local" id="from" required></label><label>Sampai tanggal & jam (WIB)<input type="datetime-local" id="to" required></label><label>Mesin<select id="device"><option value="">Semua mesin</option>'+devices.map(d=>'<option value="'+d.id+'">'+esc(d.label_name)+'</option>').join('')+'</select></label><button class="primary">Terapkan</button></form><div class="row"><button id="jsonl">Unduh JSONL asli</button><button id="csv">Unduh CSV</button><button id="allocate" class="primary">Masukkan pilihan ke acara</button><span id="total" class="muted"></span></div><div class="row"><button id="selectall" type="button">Pilih semua hasil filter</button><button id="selectnone" type="button">Tidak pilih semua</button><span id="selectedcount" role="status"></span></div><p class="muted">Pilih semua mencakup seluruh hasil filter, termasuk halaman yang belum dimuat. Batas akhir mencakup satu menit yang dipilih.</p><div id="rawtable"></div><button id="more" hidden>Muat catatan berikutnya</button></div>';
  const todayWIB=new Date(Date.now()+7*3600000).toISOString().slice(0,10);$('from').value=todayWIB+'T00:00';$('to').value=todayWIB+'T23:59';$('selectnone').onclick=()=>{selectedScans.clear();syncRawSelection();};$('selectall').onclick=()=>task(async()=>{const all=await fetchFilteredRaw();selectedScans=new Set(all.map(r=>Number(r.id)));syncRawSelection();notice(all.length+' catatan dipilih sesuai filter yang diterapkan.');});$('filter').onsubmit=e=>{e.preventDefault();task(()=>loadRaw(false));};$('more').onclick=()=>task(()=>loadRaw(true));$('jsonl').onclick=()=>task(()=>exportRaw('jsonl'));$('csv').onclick=()=>task(()=>exportRaw('csv'));$('allocate').onclick=()=>task(allocate);await loadRaw(false);
 }else if(view==='devices'){
  const ds=await call('devices');devices=ds.devices;
  c.innerHTML='<div class="eyebrow">PERANGKAT DI LOKASI</div><h1>Mesin UBAID.</h1><p class="muted">Mesin tetap menyimpan lokal saat offline. Status online mengikuti koneksi terakhir.</p><div class="row"><button class="primary" id="adddevice">Daftarkan mesin</button><button id="refresh">Perbarui status</button></div><div class="cards">'+devices.map(d=>'<article class="card devicebox"><span class="badge '+(d.online?'':'warn')+'">'+(d.online?'Online':'Offline / belum tersambung')+'</span><h2 style="margin:20px 0 5px">'+esc(d.label_name)+'</h2><p class="mono">'+esc(d.register_no)+'</p><small>Terakhir terhubung<br>'+date(d.last_seen)+'</small><p><small>'+esc(d.firmware||'Firmware belum dilaporkan')+'</small></p></article>').join('')+'</div>';
  $('refresh').onclick=()=>task(()=>render('devices'));$('adddevice').onclick=()=>{modal('<h2>Daftarkan mesin</h2><form id="deviceform"><label>Nama mesin<input name="label" maxlength="80" required placeholder="Contoh: Perwira Laki-laki"></label><p>Mesin mengikuti lingkup '+esc(me.scope||'Desa Perwira')+'.</p><button class="primary">Daftarkan</button></form>');$('deviceform').onsubmit=e=>{e.preventDefault();task(async()=>{const r=await call('device_add',{label:new FormData(e.target).get('label')});modal('<h2>Identitas mesin siap</h2><p>Simpan kunci ini sekarang. Kunci tidak ditampilkan lagi setelah ditutup.</p><label>Nomor register<input readonly value="'+esc(r.register_no)+'"></label><label>Kunci mesin<input readonly value="'+esc(r.device_key)+'"></label><p>Masukkan kedua nilai melalui dashboard lokal mesin pada menu Identitas UBAID.</p>');});};};
 }else if(view==='people'){
  c.innerHTML='<div class="eyebrow">DATABASE KELOMPOK PERWIRA</div><h1>Jamaah & kartu.</h1><div class="panel"><form class="row" id="searchform"><label>Cari nama atau kode absen<input id="query" type="search" placeholder="Nama atau 4 digit kode"></label><button class="primary">Cari</button></form><p class="muted">Untuk membaca KTP/kartu NFC-A gunakan aplikasi Android UBAID NFC. UID hanya dipakai sebagai pengenal kartu, bukan NIK.</p><div id="peopletable"></div></div>'; $('searchform').onsubmit=e=>{e.preventDefault();task(loadPeople);};await loadPeople();
 }else if(view==='events'){
  const r=await call('events');events=r.events;
  c.innerHTML='<div class="eyebrow">ALOKASIKAN KETIKA SIAP</div><h1>Acara pengajian.</h1><p class="muted">Acara terhubung dengan Dashboard Kelompok. Catatan mentah tetap disimpan setelah dialokasikan.</p><button class="primary" id="addevent">Buat acara</button><div class="panel" style="margin-top:20px">'+table(['Acara','Tanggal','Lingkup','Status'],events.map(e=>'<tr><td>'+esc(e.acara_nama)+'</td><td>'+esc(e.tanggal)+'</td><td>'+esc(e.scope_kelompok||e.scope_level)+'</td><td>'+esc(e.status)+'</td></tr>').join(''))+'</div>';
  $('addevent').onclick=()=>{modal('<h2>Buat acara</h2><form id="eventform"><label>Nama acara<input name="nama" required maxlength="150"></label><label>Tanggal<input type="date" name="tanggal" required></label><label>Jam (WIB)<input type="time" name="waktu"></label><label>Lokasi<input name="lokasi"></label><p>Lingkup: '+esc(me.scope||'Desa Perwira')+'</p><button class="primary">Simpan acara</button></form>');$('eventform').onsubmit=e=>{e.preventDefault();task(async()=>{await call('event_create',Object.fromEntries(new FormData(e.target)));$('modal').close();await render('events');notice('Acara tersimpan. Pilih catatan melalui menu Catatan mentah.');});};};
 }else if(view==='members'){
  const r=await call('members');c.innerHTML='<div class="eyebrow">SATU ADMIN UTAMA</div><h1>Pengguna portal.</h1><div class="panel"><h2>Tambahkan pengurus</h2><form id="memberform" class="row"><label>Username Dashboard Kelompok<input name="username" required></label><label>Lingkup<select name="scope"><option value="">Seluruh desa</option>'+['PW1','PW2','PW3','PW4'].map(v=>'<option>'+v+'</option>').join('')+'</select></label><button class="primary">Berikan akses</button></form><p class="muted">Password mengikuti akun Dashboard Kelompok. Hanya Setyo sebagai admin utama yang mengatur akses portal.</p>'+table(['Nama','Username','Peran','Lingkup','Status',''],r.members.map(m=>'<tr><td>'+esc(m.nama)+'</td><td>'+esc(m.username)+'</td><td>'+esc(m.role)+'</td><td>'+esc(m.scope||'Desa')+'</td><td>'+(m.enabled?'Aktif':'Nonaktif')+'</td><td>'+(m.role!=='owner'&&m.enabled?'<button data-disable="'+m.id+'">Nonaktifkan</button>':'')+'</td></tr>').join(''))+'</div>';
  $('memberform').onsubmit=e=>{e.preventDefault();task(async()=>{await call('member_add',Object.fromEntries(new FormData(e.target)));await render('members');notice('Akses pengurus tersimpan.');});};document.querySelectorAll('[data-disable]').forEach(b=>b.onclick=()=>task(async()=>{if(confirm('Nonaktifkan akses portal pengguna ini?')){await call('member_disable',{user_id:b.dataset.disable});await render('members');}}));
 }else if(view==='audit'){
  const r=await call('audit');c.innerHTML='<h1>Log perubahan.</h1><div class="panel">'+table(['Waktu','Pengguna','Tindakan','Rincian'],r.audit.map(a=>'<tr><td>'+date(a.created_at)+'</td><td>'+esc(a.actor)+'</td><td>'+esc(a.action)+'</td><td class="mono">'+esc(JSON.stringify(a.detail))+'</td></tr>').join(''))+'</div>';
 }
}
function rawTable(rows,select=true){if(!rows.length)return empty('Belum ada scan diterima pada rentang ini. Scan baru akan muncul setelah firmware V23 terpasang dan mesin tersinkron.');return table([...(select?['Pilih']:[]),'Waktu scan (WIB)','Nama / kode','Metode','Mesin','Alokasi'],rows.map(r=>'<tr>'+(select?'<td><input type="checkbox" data-scan="'+r.id+'" aria-label="Pilih catatan '+r.id+'"></td>':'')+'<td>'+date(r.occurred_at)+(!r.clock_valid?'<br><span class="badge warn">Periksa jam mesin</span>':'')+'</td><td><b>'+esc(r.nama)+'</b><br><small>'+esc(r.code||r.credential||'Belum dikenali')+'</small></td><td>'+esc(r.method)+'</td><td>'+esc(r.label_name)+'</td><td>'+(r.allocations.length?r.allocations.map(a=>esc(a.nama)).join('<br>'):'<span class="badge warn">Belum dialokasikan</span>')+'</td></tr>').join(''));}
function readRawFilter(){
 const from=$('from').value,to=$('to').value;
 if(!from||!to)throw Error('Isi tanggal dan jam awal serta akhir.');
 const start=new Date(from+':00+07:00'),end=new Date(to+':00+07:00');
 if(!Number.isFinite(start.getTime())||!Number.isFinite(end.getTime())||end<start)throw Error('Rentang tanggal/jam tidak valid.');
 return {device_id:$('device').value,time_basis:$('timebasis').value,from:start.toISOString(),to:new Date(end.getTime()+60000).toISOString()};
}
function syncRawSelection(){
 document.querySelectorAll('[data-scan]').forEach(b=>{b.checked=selectedScans.has(Number(b.dataset.scan));b.onchange=()=>{const id=Number(b.dataset.scan);if(b.checked)selectedScans.add(id);else selectedScans.delete(id);$('selectedcount').textContent=selectedScans.size+' dipilih';};});
 if($('selectedcount'))$('selectedcount').textContent=selectedScans.size+' dipilih';
}
async function fetchFilteredRaw(){let all=[],before;do{const r=await call('raw',{...lastQuery,before_id:before,limit:1000});all.push(...r.scans);before=r.next_before_id;}while(before);return all;}
async function loadRaw(more){
 if(!more){const next=readRawFilter();lastQuery=next;scans=[];selectedScans.clear();}
 const r=await call('raw',{...lastQuery,before_id:more?scans.at(-1)?.id:undefined,limit:100});

function calPeriodForm(){const box=$('cal-output');box.innerHTML='<h2>Rekap lintas pelaksanaan</h2><p class="muted">Matriks memakai DID jamaah, bukan kesamaan nama. Hanya pelaksanaan dengan daftar hadir yang sudah dibuat yang direkap; jadwal virtual dan acara dibatalkan tidak dihitung. Tamu tanpa DID tercantum pada rekap masing-masing acara.</p><form id="period-form"><div class="row"><label>Mulai<input id="period-from" type="date" required value="'+calMonth+'-01"></label><label>Sampai<input id="period-to" type="date" required value="'+new Date(Date.UTC(Number(calMonth.slice(0,4)),Number(calMonth.slice(5)),0)).toISOString().slice(0,10)+'"></label><label>Nama acara<input id="period-name" type="search" value="'+esc(calSearch)+'"></label><button class="primary">Buat rekap</button></div></form><div id="period-result"></div>';$('period-form').onsubmit=ev=>{ev.preventDefault();calRun(async()=>{const start=$('period-from').value,end=$('period-to').value,q=$('period-name').value.toLowerCase();if(end<start)throw Error('Tanggal akhir sebelum awal.');const ks=calData.kegiatan.filter(k=>k.tanggal>=start&&k.tanggal<=end&&k.status!=='dibatalkan'&&(!calGroup||k.scope_kelompok===calGroup)&&k.acara_nama.toLowerCase().includes(q)).sort((a,b)=>(a.tanggal+(a.waktu||'')).localeCompare(b.tanggal+(b.waktu||'')));if(ks.length>120)throw Error('Persempit rentang atau nama acara; maksimal 120 pelaksanaan per rekap.');const matrix=new Map(),columns=[];for(const k of ks){const report=await calRPC('report',{event_id:k.id});columns.push(k.tanggal+' '+k.acara_nama+(report.final?' [final]':' [berjalan]'));for(const p of report.peserta||[]){if(!p.did)continue;if(!matrix.has(p.did))matrix.set(p.did,{did:p.did,nama:p.nama,statuses:new Map()});matrix.get(p.did).statuses.set(k.id,p.status_hadir||'tidak_hadir');}}const rows=[...matrix.values()].sort((a,b)=>a.nama.localeCompare(b.nama)),header=['DID','Nama',...columns,'Hadir','Izin','Sakit','Tidak hadir','Total wajib','% hadir'],data=rows.map(p=>{const ss= calReadCriteria=function(old={}){if(calCriteriaState()===calCriteriaInitial&&$('cc-source').value!=='criteria_builder')return structuredClone(old);if($('cc-source').value==='criteria_builder'){if(!calBuilderGroups.length||calBuilderGroups.some(g=>!g.criteria_builder.length))throw Error('Setiap kategori perlu minimal satu kriteria.');for(const g of calBuilderGroups){const types=g.criteria_builder.map(r=>r.type);if(new Set(types).size!==types.length)throw Error('Jenis kriteria tidak boleh berulang dalam kategori yang sama.');for(const r of g.criteria_builder){if(r.type==='usia'&&r.min!==''&&r.max!==''&&Number(r.min)>Number(r.max))throw Error('Rentang usia tidak valid.');}}return {...old,sumber:'criteria_builder',criteria_version:2,criteria_builder:structuredClone(calBuilderGroups[0].criteria_builder),criteria_groups:structuredClone(calBuilderGroups)};}return calReadCriteriaBasic(old);};

function calSetupTargets(k,j,filter){const targets=calData.targets.filter(t=>k?t.kegiatan_id===k.id:j?t.jadwal_id===j.id:false).map(t=>t.jamaah_did);calInitialTargets=JSON.stringify(targets.sort());$('cf-slots').closest('details').insertAdjacentHTML('beforebegin','<details><summary>Sasaran peserta tersimpan</summary><label>Cara menentukan<select id="ct-mode">'+['criteria','manual','combined'].map(v=>'<option '+((filter.participant_selection||'criteria')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><p class="muted">criteria = kriteria; manual = nama terpilih; combined = gabungan keduanya. Ini menyimpan sasaran acara/jadwal; daftar hadir tiap pelaksanaan dibuat melalui Pilih/generate peserta.</p><label>Cari sasaran<input id="ct-search" type="search"></label><div id="ct-list" class="cal-pick">'+calData.people.filter(p=>!me.scope||p.kelompok_nama===me.scope).map(p=>'<label data-target-name="'+esc(p.nama.toLowerCase())+'"><input type="checkbox" data-target="'+esc(p.did)+'" '+(targets.includes(p.did)?'checked':'')+'>'+esc(p.nama+' · '+p.kelompok_nama)+'</label>').join('')+'</div></details>');$('ct-search').oninput=()=>document.querySelectorAll('[data-target-name]').forEach(n=>n.hidden=!n.dataset.targetName.includes($('ct-search').value.toLowerCase()));}
function calTargetValues(){return [...document.querySelectorAll('[data-target]:checked')].map(n=>n.dataset.target).sort();}
function calTemplates(){const box=$('cal-output');box.innerHTML='<h2>Template peserta</h2><p class="muted">Template dibaca oleh acara yang memilih sumber template. Perubahan tidak mengganti snapshot kehadiran pelaksanaan yang sudah dibuat.</p>'+calData.masters.map(t=>'<article class="cal-item"><b>'+esc(t.nama)+'</b><p>'+esc(t.scope_kelompok||t.scope_level)+' · '+esc(t.default_filter?.participant_mode==='custom'?'Nama pilihan':'Kriteria')+'</p><button data-template="'+t.id+'">Atur peserta template</button></article>').join('');box.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>calRun(()=>calTemplateEditor(Number(b.dataset.template))));}
function calTemplateEditor(id){const t=calData.masters.find(t=>t.id===id),ids=new Set(calCandidates({sumber:'template',template_id:id},t.scope_level,t.scope_kelompok).map(p=>p.did)),pool=calData.people.filter(p=>p.status_sambung==='Tetap'&&(!t.scope_kelompok||p.kelompok_nama===t.scope_kelompok));calModal('<h2>Template · '+esc(t.nama)+'</h2><p>Daftar pilihan berlaku untuk penggunaan template berikutnya. Peserta acara yang sudah dibuat tetap utuh.</p><input id="tmpl-search" type="search" placeholder="Cari nama"><div id="tmpl-list" class="cal-pick">'+pool.map(p=>'<label data-tmpl-name="'+esc(p.nama.toLowerCase())+'"><input type="checkbox" data-tmpl="'+esc(p.did)+'" '+(ids.has(p.did)?'checked':'')+'>'+esc(p.nama+' · '+p.kelompok_nama)+'</label>').join('')+'</div><div class="row"><button id="tmpl-save" class="primary">Simpan nama pilihan</button><button id="tmpl-reset">Kembali memakai kriteria</button></div>');$('tmpl-search').oninput=()=>document.querySelectorAll('[data-tmpl-name]').forEach(n=>n.hidden=!n.dataset.tmplName.includes($('tmpl-search').value.toLowerCase()));async function save(custom){await calRPC('template_participants',{template_id:id,custom,dids:custom?[...document.querySelectorAll('[data-tmpl]:checked')].map(n=>n.dataset.tmpl):[]});$('modal').close();await calendarHome();notice('Template peserta diperbarui.');}$('tmpl-save').onclick=()=>calRun(()=>save(true));$('tmpl-reset').onclick=()=>calRun(()=>save(false));}
