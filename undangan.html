<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Undangan</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--g:#0f5b46;--gold:#b68a2a;--paper:#fffdf8;--mut:#64748b}*{box-sizing:border-box}body{margin:0;background:#eef3ef;font-family:Inter,Arial,sans-serif;color:#1f2937}.wrap{max-width:760px;margin:24px auto;padding:14px}.sheet{background:var(--paper);border:1px solid #e6dfce;border-radius:16px;box-shadow:0 14px 36px rgba(15,91,70,.10);overflow:hidden}.head{padding:24px 26px 18px;text-align:center;border-bottom:3px double #d7c8a1}.brand{font-size:12px;letter-spacing:2px;color:var(--g);font-weight:800}.powered{padding:11px 20px 14px;text-align:center;font-size:12px;color:#9ca3af;border-top:1px solid #eee8d9}.title{font-family:Georgia,serif;font-size:27px;margin:7px 0 3px;color:var(--g)}.to{margin-top:10px;font-size:14px}.body{padding:24px 28px}.naskah{white-space:pre-wrap;line-height:1.62;font-family:Georgia,serif;font-size:14px}.event{margin:18px 0;padding:13px 15px;border-left:4px solid var(--gold);background:#fff8e7;border-radius:8px;font-size:13px}.event b{color:var(--g)}.countdown{margin:16px 0 18px;padding:16px;border:1px solid #d7c8a1;border-radius:12px;background:linear-gradient(180deg,#fffdf8,#fff8e7);text-align:center}.countdown .cd-label{font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--g);margin-bottom:10px}.countdown .cd-grid{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.countdown .cd-unit{min-width:66px;padding:9px 8px;border-radius:10px;background:white;border:1px solid #eadfca;box-shadow:0 3px 10px rgba(15,91,70,.06)}.countdown .cd-num{display:block;font-size:24px;font-weight:900;line-height:1;color:var(--g);font-variant-numeric:tabular-nums}.countdown .cd-name{display:block;margin-top:5px;font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}.countdown .cd-status{font-size:17px;font-weight:900;color:var(--g);padding:6px 0}.countdown .cd-sub{margin-top:7px;font-size:12px;color:var(--mut)}.participants{margin-top:18px}.participant-table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;background:white;margin:0 0 14px;table-layout:fixed}.participant-table thead{display:table-header-group}.participant-table th{width:50%;padding:9px 11px;background:#f0fdf4;color:var(--g);font-size:13px;text-align:left;border-bottom:1px solid #dbe8df}.participant-table th+th,.participant-table td+td{border-left:1px solid #e5e7eb}.participant-table td{padding:3px 11px;font-size:13px;line-height:1.45;vertical-align:top}.participant-table tbody tr:first-child td{padding-top:8px}.participant-table tbody tr:last-child td{padding-bottom:9px}.participant-table tr{break-inside:avoid;page-break-inside:avoid}.pnum{display:inline-block;min-width:24px;color:#475569}.box{border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;background:white}.box h3{margin:0;padding:9px 11px;background:#f0fdf4;color:var(--g);font-size:13px}.box ul{margin:8px 0 10px;padding-left:30px;font-size:13px;line-height:1.6}.slots{margin-top:14px}.sign{margin:32px 0 4px auto;text-align:center;width:220px;font-size:14px}.sign img{max-width:150px;max-height:75px;object-fit:contain;display:block;margin:5px auto}.sign .name{font-weight:800;text-decoration:underline}.actions{display:flex;gap:8px;justify-content:center;padding:16px;background:#f8fafc;border-top:1px solid #e5e7eb}.actions button{border:0;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer}.print{background:var(--g);color:white}.share{background:#e9d6a3;color:#5b4612}.err{padding:30px;text-align:center;color:#b91c1c}.loading{padding:34px;text-align:center;color:var(--mut)}@media(max-width:600px){.wrap{margin:0;padding:0}.sheet{border-radius:0}.body{padding:20px 18px}.title{font-size:24px}.participant-table th,.participant-table td{font-size:12px;padding-left:8px;padding-right:8px}}@media print{body{background:white}.wrap{max-width:none;margin:0;padding:0}.sheet{box-shadow:none;border:0;border-radius:0}.actions,.countdown{display:none}.participant-table{page-break-inside:auto}.participant-table thead{display:table-header-group}.participant-table tbody{display:table-row-group}.participant-table tr{page-break-inside:avoid;break-inside:avoid}.sign{break-inside:avoid;page-break-inside:avoid}}
</style></head><body><div class="wrap"><div class="sheet" id="app"><div class="loading">Memuat undangan...</div></div></div><script>
const SURL='https://skltbmcrqutevmtcxqxj.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrbHRibWNycXV0ZXZtdGN4cXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzM5ODIsImV4cCI6MjA5MTI0OTk4Mn0._nogUZg5UylVyP45QTGYw69u76pNxGryj9hZORIfE_A';
const sb=supabase.createClient(SURL,SKEY);const token=new URLSearchParams(location.search).get('token');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normG=g=>/^L/i.test(String(g||''))?'L':/^P/i.test(String(g||''))?'P':'';
const fmtDate=s=>s?new Date(String(s).slice(0,10)+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'-';
function waStyledSegments(text){const s=String(text||''),out=[];let buf='',bold=false,italic=false,strike=false,underline=false;const flush=()=>{if(buf){out.push({text:buf,bold,italic,strike,underline});buf='';}};const propFor={'*':'bold','_':'italic','~':'strike'};for(let i=0;i<s.length;i++){const ch=s[i],prop=propFor[ch];if(ch==='\\'){if(underline||s.indexOf('/',i+1)!==-1){flush();underline=!underline;continue;}}if(ch==='/'&&underline){flush();underline=false;continue;}if(prop){const active=prop==='bold'?bold:prop==='italic'?italic:strike;if(active||s.indexOf(ch,i+1)!==-1){flush();if(prop==='bold')bold=!bold;else if(prop==='italic')italic=!italic;else strike=!strike;continue;}}buf+=ch;}flush();return out;}
function waMarkupHtml(text){return waStyledSegments(text).map(seg=>{let h=esc(seg.text);if(seg.strike)h=`<s>${h}</s>`;if(seg.underline)h=`<u>${h}</u>`;if(seg.italic)h=`<em>${h}</em>`;if(seg.bold)h=`<strong>${h}</strong>`;return h;}).join('');}
function resolved(inv,rec,ev){let t=String(inv.naskah||'');const vals={nama_penerima:rec.type==='jamaah'?(rec.nama||''):`Jamaah ${rec.kelompok||''}`,nama_acara:ev.nama||'',tanggal:fmtDate(ev.tanggal),waktu:[ev.waktu&&String(ev.waktu).slice(0,5),ev.waktu_selesai&&String(ev.waktu_selesai).slice(0,5)].filter(Boolean).join(' - '),lokasi:ev.lokasi||'-',kelompok:rec.kelompok||''};Object.entries(vals).forEach(([k,v])=>t=t.split(`{{${k}}}`).join(v||''));return t;}
function eventDateTimeWIB(date,time){
  const d=String(date||'').slice(0,10),t=String(time||'00:00:00').slice(0,8)||'00:00:00';
  if(!d)return null;
  const x=new Date(`${d}T${t.length===5?t+':00':t}+07:00`);
  return isNaN(x.getTime())?null:x;
}
let countdownTimer=null;
function countdownHtml(){return `<div class="countdown" id="countdownBox"><div class="cd-label">Menuju Pelaksanaan</div><div class="cd-grid"><div class="cd-unit"><span class="cd-num" id="cdDays">0</span><span class="cd-name">Hari</span></div><div class="cd-unit"><span class="cd-num" id="cdHours">00</span><span class="cd-name">Jam</span></div><div class="cd-unit"><span class="cd-num" id="cdMinutes">00</span><span class="cd-name">Menit</span></div><div class="cd-unit"><span class="cd-num" id="cdSeconds">00</span><span class="cd-name">Detik</span></div></div><div class="cd-sub" id="cdSub"></div></div>`;}
function startCountdown(ev){
  if(countdownTimer){clearInterval(countdownTimer);countdownTimer=null;}
  const box=document.getElementById('countdownBox'); if(!box)return;
  const start=eventDateTimeWIB(ev.tanggal,ev.waktu); const end=ev.waktu_selesai?eventDateTimeWIB(ev.tanggal,ev.waktu_selesai):null;
  if(!start){box.style.display='none';return;}
  const pad=n=>String(n).padStart(2,'0');
  const tick=()=>{
    const now=new Date();
    if(now<start){
      let ms=start-now,days=Math.floor(ms/86400000);ms%=86400000;let hrs=Math.floor(ms/3600000);ms%=3600000;let mins=Math.floor(ms/60000);let secs=Math.floor((ms%60000)/1000);
      box.innerHTML=`<div class="cd-label">Menuju Pelaksanaan</div><div class="cd-grid"><div class="cd-unit"><span class="cd-num">${days}</span><span class="cd-name">Hari</span></div><div class="cd-unit"><span class="cd-num">${pad(hrs)}</span><span class="cd-name">Jam</span></div><div class="cd-unit"><span class="cd-num">${pad(mins)}</span><span class="cd-name">Menit</span></div><div class="cd-unit"><span class="cd-num">${pad(secs)}</span><span class="cd-name">Detik</span></div></div><div class="cd-sub">${esc(fmtDate(ev.tanggal))} • ${esc(String(ev.waktu||'').slice(0,5))} WIB</div>`;
    }else if(end && now<end){
      box.innerHTML=`<div class="cd-label">Pelaksanaan</div><div class="cd-status">🟢 Acara sedang berlangsung</div><div class="cd-sub">Berakhir sekitar ${esc(String(ev.waktu_selesai||'').slice(0,5))} WIB</div>`;
    }else{
      box.innerHTML=`<div class="cd-label">Pelaksanaan</div><div class="cd-status">✅ Acara telah ${end?'selesai':'dimulai'}</div><div class="cd-sub">${esc(fmtDate(ev.tanggal))} • ${esc(String(ev.waktu||'').slice(0,5))} WIB</div>`;
      clearInterval(countdownTimer);countdownTimer=null;
    }
  };
  tick(); countdownTimer=setInterval(tick,1000);
}
function participantBuckets(parts){const out={bapak:[],ibu:[],remajaPutra:[],remajaPutri:[]};(Array.isArray(parts)?parts:[]).forEach(p=>{const g=normG(p.gender),belum=String(p.status_nikah||'').trim()==='Belum Menikah';if(g==='L')(belum?out.remajaPutra:out.bapak).push(p);else if(g==='P')(belum?out.remajaPutri:out.ibu).push(p);});Object.values(out).forEach(a=>a.sort((x,y)=>String(x.nama||'').localeCompare(String(y.nama||''),'id')));return out;}
function participantPairTable(leftTitle,left,rightTitle,right){const n=Math.max(left.length,right.length,1),rows=[];for(let i=0;i<n;i++){const l=left[i],r=right[i];rows.push(`<tr><td>${l?`<span class="pnum">${i+1}.</span>${esc(l.nama||'-')}`:'&nbsp;'}</td><td>${r?`<span class="pnum">${i+1}.</span>${esc(r.nama||'-')}`:'&nbsp;'}</td></tr>`);}return `<table class="participant-table"><thead><tr><th>${esc(leftTitle)}</th><th>${esc(rightTitle)}</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;}
function render(data){const inv=data.invitation,rec=data.recipient,ev=data.event,parts=Array.isArray(rec.peserta)?rec.peserta:[],slots=Array.isArray(rec.slots)?rec.slots:[],b=participantBuckets(parts);document.title=`${inv.judul||'Undangan'} - ${ev.nama||''}`;document.getElementById('app').innerHTML=`<div class="head"><div class="brand">DESA PERWIRA</div><div class="title">${esc(inv.judul||'UNDANGAN')}</div><div class="to">${rec.type==='jamaah'?`Kepada Yth. <b>${esc(rec.nama||'')}</b>`:`Untuk <b>Kelompok ${esc(rec.kelompok||'')}</b>`}</div></div><div class="body"><div class="naskah">${waMarkupHtml(resolved(inv,rec,ev))}</div><div class="event"><b>${esc(ev.nama||'')}</b><br>📅 ${esc(fmtDate(ev.tanggal))}<br>⏰ ${esc([ev.waktu&&String(ev.waktu).slice(0,5),ev.waktu_selesai&&String(ev.waktu_selesai).slice(0,5)].filter(Boolean).join(' - ')||'-')}<br>📍 ${esc(ev.lokasi||'-')}</div>${countdownHtml()}${rec.type==='kelompok'?`<div class="participants">${participantPairTable('Bapak-bapak',b.bapak,'Ibu-ibu',b.ibu)}${participantPairTable('Remaja Putra',b.remajaPutra,'Remaja Putri',b.remajaPutri)}</div>`:''}${slots.length?`<div class="box slots"><h3>Slot / Kuota Tambahan</h3><ul>${slots.map(s=>`<li>${esc(s.nama_slot||'Slot')} — <b>${Number(s.kuota||0)} orang</b>${s.allow_over_quota?' (boleh lebih dari kuota)':' (maksimal sesuai kuota)'}</li>`).join('')}</ul></div>`:''}<div class="sign">${inv.signature_data?`<img src="${esc(inv.signature_data)}">`:''}<div class="name">${esc(inv.signer_name||'')}</div><div>${esc(inv.signer_title||'')}</div></div></div><div class="powered">Powered by UBNB Desa Perwira</div><div class="actions"><button class="print" onclick="window.print()">🖨️ Cetak / PDF</button><button class="share" onclick="shareLink()">📤 Bagikan</button></div>`;startCountdown(ev);}
async function shareLink(){if(navigator.share){try{await navigator.share({title:document.title,url:location.href});return}catch(e){}}try{await navigator.clipboard.writeText(location.href);alert('Link undangan disalin.')}catch(e){prompt('Salin link:',location.href)}}
(async()=>{if(!token){document.getElementById('app').innerHTML='<div class="err">Link undangan tidak valid.</div>';return}const {data,error}=await sb.rpc('dk_invitation_public',{p_token:token});if(error||!data||data.ok!==true){document.getElementById('app').innerHTML=`<div class="err">${esc(error?.message||data?.error||'Undangan tidak ditemukan')}</div>`;return}render(data)})();
</script></body></html>
