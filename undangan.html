<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Undangan</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--g:#0f5b46;--gold:#b68a2a;--paper:#fffdf8;--mut:#64748b}*{box-sizing:border-box}body{margin:0;background:#eef3ef;font-family:Inter,Arial,sans-serif;color:#1f2937}.wrap{max-width:760px;margin:24px auto;padding:14px}.sheet{background:var(--paper);border:1px solid #e6dfce;border-radius:16px;box-shadow:0 14px 36px rgba(15,91,70,.10);overflow:hidden}.head{padding:24px 26px 18px;text-align:center;border-bottom:3px double #d7c8a1}.brand{font-size:11px;letter-spacing:2px;color:var(--g);font-weight:800}.powered{padding:11px 20px 14px;text-align:center;font-size:10px;color:#9ca3af;border-top:1px solid #eee8d9}.title{font-family:Georgia,serif;font-size:27px;margin:7px 0 3px;color:var(--g)}.to{margin-top:10px;font-size:14px}.body{padding:24px 28px}.naskah{white-space:pre-wrap;line-height:1.62;font-family:Georgia,serif;font-size:14px}.event{margin:18px 0;padding:13px 15px;border-left:4px solid var(--gold);background:#fff8e7;border-radius:8px;font-size:13px}.event b{color:var(--g)}.participants{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.box{border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;background:white}.box h3{margin:0;padding:9px 11px;background:#f0fdf4;color:var(--g);font-size:12px}.box ol,.box ul{margin:8px 0 10px;padding-left:30px;font-size:12px;line-height:1.6}.slots{margin-top:14px}.sign{margin:28px 0 4px auto;text-align:center;width:220px;font-size:12px}.sign img{max-width:150px;max-height:75px;object-fit:contain;display:block;margin:5px auto}.sign .name{font-weight:800;text-decoration:underline}.actions{display:flex;gap:8px;justify-content:center;padding:16px;background:#f8fafc;border-top:1px solid #e5e7eb}.actions button{border:0;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer}.print{background:var(--g);color:white}.share{background:#e9d6a3;color:#5b4612}.err{padding:30px;text-align:center;color:#b91c1c}.loading{padding:34px;text-align:center;color:var(--mut)}@media(max-width:600px){.wrap{margin:0;padding:0}.sheet{border-radius:0}.body{padding:20px 18px}.participants{grid-template-columns:1fr}.title{font-size:24px}}@media print{body{background:white}.wrap{max-width:none;margin:0;padding:0}.sheet{box-shadow:none;border:0;border-radius:0}.actions{display:none}}
</style></head><body><div class="wrap"><div class="sheet" id="app"><div class="loading">Memuat undangan...</div></div></div><script>
const SURL='https://skltbmcrqutevmtcxqxj.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrbHRibWNycXV0ZXZtdGN4cXhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NzM5ODIsImV4cCI6MjA5MTI0OTk4Mn0._nogUZg5UylVyP45QTGYw69u76pNxGryj9hZORIfE_A';
const sb=supabase.createClient(SURL,SKEY);const token=new URLSearchParams(location.search).get('token');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normG=g=>/^L/i.test(String(g||''))?'L':/^P/i.test(String(g||''))?'P':'';
const fmtDate=s=>s?new Date(String(s).slice(0,10)+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'-';
function resolved(inv,rec,ev){let t=String(inv.naskah||'');const vals={nama_penerima:rec.type==='jamaah'?(rec.nama||''):`Jamaah ${rec.kelompok||''}`,nama_acara:ev.nama||'',tanggal:fmtDate(ev.tanggal),waktu:[ev.waktu&&String(ev.waktu).slice(0,5),ev.waktu_selesai&&String(ev.waktu_selesai).slice(0,5)].filter(Boolean).join(' - '),lokasi:ev.lokasi||'-',kelompok:rec.kelompok||''};Object.entries(vals).forEach(([k,v])=>t=t.split(`{{${k}}}`).join(v||''));return t;}
function render(data){const inv=data.invitation,rec=data.recipient,ev=data.event,parts=Array.isArray(rec.peserta)?rec.peserta:[],slots=Array.isArray(rec.slots)?rec.slots:[];const male=parts.filter(p=>normG(p.gender)==='L').sort((a,b)=>String(a.nama||'').localeCompare(String(b.nama||''),'id')),female=parts.filter(p=>normG(p.gender)==='P').sort((a,b)=>String(a.nama||'').localeCompare(String(b.nama||''),'id'));document.title=`${inv.judul||'Undangan'} - ${ev.nama||''}`;document.getElementById('app').innerHTML=`<div class="head"><div class="brand">DESA PERWIRA</div><div class="title">${esc(inv.judul||'UNDANGAN')}</div><div class="to">${rec.type==='jamaah'?`Kepada Yth. <b>${esc(rec.nama||'')}</b>`:`Untuk <b>Kelompok ${esc(rec.kelompok||'')}</b>`}</div></div><div class="body"><div class="naskah">${esc(resolved(inv,rec,ev))}</div><div class="event"><b>${esc(ev.nama||'')}</b><br>📅 ${esc(fmtDate(ev.tanggal))}<br>⏰ ${esc([ev.waktu&&String(ev.waktu).slice(0,5),ev.waktu_selesai&&String(ev.waktu_selesai).slice(0,5)].filter(Boolean).join(' - ')||'-')}<br>📍 ${esc(ev.lokasi||'-')}</div>${rec.type==='kelompok'?`<div class="participants"><div class="box"><h3>Peserta Laki-laki</h3><ol>${male.length?male.map(p=>`<li>${esc(p.nama||'-')}</li>`).join(''):'<li>—</li>'}</ol></div><div class="box"><h3>Peserta Perempuan</h3><ol>${female.length?female.map(p=>`<li>${esc(p.nama||'-')}</li>`).join(''):'<li>—</li>'}</ol></div></div>`:''}${slots.length?`<div class="box slots"><h3>Slot / Kuota Tambahan</h3><ul>${slots.map(s=>`<li>${esc(s.nama_slot||'Slot')} — <b>${Number(s.kuota||0)} orang</b>${s.allow_over_quota?' (boleh lebih dari kuota)':' (maksimal sesuai kuota)'}</li>`).join('')}</ul></div>`:''}<div class="sign">${inv.signature_data?`<img src="${esc(inv.signature_data)}">`:''}<div class="name">${esc(inv.signer_name||'')}</div><div>${esc(inv.signer_title||'')}</div></div></div><div class="powered">Powered by UBNB Desa Perwira</div><div class="actions"><button class="print" onclick="window.print()">🖨️ Cetak / PDF</button><button class="share" onclick="shareLink()">📤 Bagikan</button></div>`;}
async function shareLink(){if(navigator.share){try{await navigator.share({title:document.title,url:location.href});return}catch(e){}}try{await navigator.clipboard.writeText(location.href);alert('Link undangan disalin.')}catch(e){prompt('Salin link:',location.href)}}
(async()=>{if(!token){document.getElementById('app').innerHTML='<div class="err">Link undangan tidak valid.</div>';return}const {data,error}=await sb.rpc('dk_invitation_public',{p_token:token});if(error||!data||data.ok!==true){document.getElementById('app').innerHTML=`<div class="err">${esc(error?.message||data?.error||'Undangan tidak ditemukan')}</div>`;return}render(data)})();
</script></body></html>
